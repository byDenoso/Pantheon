name: NEXO runtime contract one-shot
on:
  push:
    branches: [nexo-runtime-contract-20260910]
    paths: ['.github/workflows/nexo-runtime-contract-fix.yml']
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexo-runtime-contract-20260910
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nexo-one/package-lock.json
      - name: Apply exact runtime-contract patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}: {old!r}')
              p.write_text(text.replace(old, new))

          replace(
              'nexo-one/server/compiler/system-state.mjs',
              "return ['PASS','UNVERIFIED','UNKNOWN','BLOCKED'].includes(v)?v:'UNKNOWN';",
              "return ['PASS','UNVERIFIED','UNKNOWN','RETIRED_RUNTIME','BLOCKED'].includes(v)?v:'UNKNOWN';"
          )
          replace(
              'nexo-one/server/compiler/system-state.mjs',
              "const global_state=worst([projectionBus.state,...providers.map(p=>p.state),...findings.map(f=>f.status),...lanes.map(l=>l.state)]);",
              "const globalProviders=providers.filter(provider=>provider.id!=='vercel');\n  const global_state=worst([projectionBus.state,...globalProviders.map(p=>p.state),...findings.map(f=>f.status),...lanes.map(l=>l.state)]);"
          )

          replace(
              'nexo-one/src/contracts/system.ts',
              "export type CapabilityStatus = 'PASS' | 'UNVERIFIED' | 'UNKNOWN' | 'BLOCKED';",
              "export type CapabilityStatus = 'PASS' | 'UNVERIFIED' | 'UNKNOWN' | 'RETIRED_RUNTIME' | 'BLOCKED';"
          )
          replace(
              'nexo-one/src/contracts/system.ts',
              "export const CAPABILITY_STATUSES: CapabilityStatus[] = ['PASS', 'UNVERIFIED', 'UNKNOWN', 'BLOCKED'];",
              "export const CAPABILITY_STATUSES: CapabilityStatus[] = ['PASS', 'UNVERIFIED', 'UNKNOWN', 'RETIRED_RUNTIME', 'BLOCKED'];"
          )

          replace(
              'nexo-one/src/viewmodels/tokens.ts',
              "PASS: 'live', UNVERIFIED: 'unknown', UNKNOWN: 'unknown',",
              "PASS: 'live', UNVERIFIED: 'unknown', UNKNOWN: 'unknown', RETIRED_RUNTIME: 'stale',"
          )
          replace(
              'nexo-one/src/viewmodels/tokens.ts',
              "PASS: 'Verificada', UNVERIFIED: 'Sem prova', UNKNOWN: 'Desconhecido',",
              "PASS: 'Verificada', UNVERIFIED: 'Sem prova', UNKNOWN: 'Desconhecido', RETIRED_RUNTIME: 'Runtime retirado',"
          )
          replace(
              'nexo-one/src/viewmodels/tokens.ts',
              "PASS: 'live', UNVERIFIED: 'unknown', UNKNOWN: 'unknown', BLOCKED: 'blocked',",
              "PASS: 'live', UNVERIFIED: 'unknown', UNKNOWN: 'unknown', RETIRED_RUNTIME: 'stale', BLOCKED: 'blocked',"
          )

          replace(
              'nexo-one/src/viewmodels/system.ts',
              "degradedCapabilities: state.capabilities.filter(c => c.status !== 'PASS'),",
              "degradedCapabilities: state.capabilities.filter(c => c.status !== 'PASS' && c.status !== 'RETIRED_RUNTIME'),"
          )
          replace(
              'nexo-one/src/viewmodels/system.ts',
              "if (cap && (cap.status === 'BLOCKED' || cap.status === 'UNKNOWN')) return false;",
              "if (cap && (cap.status === 'BLOCKED' || cap.status === 'UNKNOWN' || cap.status === 'RETIRED_RUNTIME')) return false;"
          )
          replace(
              'nexo-one/src/viewmodels/system.ts',
              "const CAPABILITY_WEIGHT: Record<CapabilityStatus, number> = { PASS: 0, UNVERIFIED: 1, UNKNOWN: 2, BLOCKED: 3 };",
              "const CAPABILITY_WEIGHT: Record<CapabilityStatus, number> = { PASS: 0, UNVERIFIED: 1, UNKNOWN: 2, RETIRED_RUNTIME: 3, BLOCKED: 4 };"
          )
          replace(
              'nexo-one/src/viewmodels/system.ts',
              "  UNKNOWN: state.capabilities.filter(c => c.status === 'UNKNOWN').length,\n  BLOCKED: state.capabilities.filter(c => c.status === 'BLOCKED').length,",
              "  UNKNOWN: state.capabilities.filter(c => c.status === 'UNKNOWN').length,\n  RETIRED_RUNTIME: state.capabilities.filter(c => c.status === 'RETIRED_RUNTIME').length,\n  BLOCKED: state.capabilities.filter(c => c.status === 'BLOCKED').length,"
          )
          replace(
              'nexo-one/src/viewmodels/system.ts',
              "if (capability.status === 'PASS') continue;",
              "if (capability.status === 'PASS' || capability.status === 'RETIRED_RUNTIME') continue;"
          )

          replace(
              'nexo-one/src/features/system/Integrity.tsx',
              "(['PASS', 'UNVERIFIED', 'UNKNOWN', 'BLOCKED'] as const)",
              "(['PASS', 'UNVERIFIED', 'UNKNOWN', 'RETIRED_RUNTIME', 'BLOCKED'] as const)"
          )
          replace(
              'nexo-one/src/features/system/Integrity.tsx',
              "              UNKNOWN: 'sem declaração nem evidência',\n              BLOCKED: 'impedidas de serem tentadas',",
              "              UNKNOWN: 'sem declaração nem evidência',\n              RETIRED_RUNTIME: 'retiradas por decisão explícita',\n              BLOCKED: 'impedidas de serem tentadas',"
          )
          replace(
              'nexo-one/src/features/system/Integrity.tsx',
              "description=\"Todos os domínios estão LIVE, todas as capabilities têm evidência e nenhum readback falhou.\"",
              "description=\"Todos os domínios estão LIVE, todas as capabilities ativas estão verificadas e nenhum readback falhou.\""
          )

          replace(
              'nexo-one/src/app/App.tsx',
              "            {system.sourceKind === 'fixture' ? 'FIXTURE' : 'REMOTO'} · {scenario.label}",
              "            {system.sourceKind === 'fixture'\n              ? `FIXTURE · ${scenario.label}`\n              : `REMOTO · ${system.state?.scenario_label || system.sourceLabel}`}"
          )
          PY
      - name: Verify NEXO ONE
        working-directory: nexo-one
        run: |
          npm ci
          npm run check
      - name: Commit verified patch and remove one-shot workflow
        run: |
          rm .github/workflows/nexo-runtime-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexo-one .github/workflows/nexo-runtime-contract-fix.yml
          git commit -m "fix(nexo-one): enforce runtime architecture decisions"
          git push origin HEAD:nexo-runtime-contract-20260910
