name: nested
# No automatic push trigger. Review/merge/configure is separate from permission to launch.
on:
  workflow_dispatch:
    inputs:
      model:
        type: choice
        options: [LCDM, P1, P3]
        required: true
      seedidx:
        type: choice
        options: ['0', '1']
        required: true
      chunk:
        type: string
        default: '0'
      max_chunks:
        type: string
        default: '90'
permissions:
  contents: read
  actions: write
concurrency:
  group: nested-S1-${{ inputs.model }}-s${{ inputs.seedidx }}
  cancel-in-progress: false
jobs:
  nested:
    if: github.repository == 'byDenoso/Pantheon' && github.ref == 'refs/heads/nested/peer-n2'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      JOB: S1-${{ inputs.model }}-s${{ inputs.seedidx }}
      CHUNK: ${{ inputs.chunk }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare transport runtime
        run: |
          umask 077
          echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/nested-private/logs"
          python -m pip install google-auth requests > "$RUNNER_TEMP/nested-private/logs/transport.log" 2>&1 || { echo 'STATUS FAILED'; exit 1; }
          echo 'STATUS RUNTIME_READY'
      - name: Verify private destination and restore previous immutable chunk
        id: prepare
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.NEXO_DRIVE_WRITER_JSON }}
          NESTED_PRIVATE_CONFIG_FILE_ID: ${{ secrets.NEXO_NESTED_PRIVATE_CONFIG_FILE_ID }}
          NESTED_PRIVATE_CONFIG_SHA256: ${{ secrets.NEXO_NESTED_PRIVATE_CONFIG_SHA256 }}
        run: python code/nested_private.py prepare
      - name: Install scientific runtime with private diagnostics
        run: |
          scripts/install_linux.sh s1 > "$RUNNER_TEMP/nested-private/logs/install.log" 2>&1 || { echo 'STATUS FAILED'; exit 1; }
          echo 'STATUS SCIENTIFIC_RUNTIME_READY'
      - name: Run private smoke and resumable chunk in credential-free child
        id: compute
        run: python code/nested_private.py execute
      - name: Verify private delivery before any continuation
        id: delivery
        if: always() && steps.prepare.outcome == 'success'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.NEXO_DRIVE_WRITER_JSON }}
        run: python code/nested_private.py upload
      - name: Continue only after verified private checkpoint
        if: steps.delivery.outputs.continue == 'true' && steps.delivery.outcome == 'success' && steps.compute.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_CHUNKS: ${{ inputs.max_chunks }}
          MODEL: ${{ inputs.model }}
          SEEDIDX: ${{ inputs.seedidx }}
        shell: python
        run: |
          import json, os, urllib.request
          try:
              nxt = int(os.environ['CHUNK']) + 1
              if nxt >= int(os.environ['MAX_CHUNKS']):
                  print('STATUS CHUNK_LIMIT_REACHED')
              else:
                  payload = json.dumps({'ref': os.environ['GITHUB_REF_NAME'], 'inputs': {
                      'model': os.environ['MODEL'], 'seedidx': os.environ['SEEDIDX'],
                      'chunk': str(nxt), 'max_chunks': os.environ['MAX_CHUNKS']}}).encode()
                  req = urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/workflows/nested.yml/dispatches',
                      data=payload, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'}, method='POST')
                  with urllib.request.urlopen(req, timeout=60) as response:
                      assert response.status == 204
                  print('STATUS CONTINUATION_REQUESTED')
          except Exception:
              print('STATUS CONTINUATION_UNCONFIRMED')
              raise SystemExit(1)
