name: NEXO ONE Readback Fix CI

on:
  push:
    branches:
      - chatgpt/nexo-one-readback-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nexo-one/package-lock.json
      - name: Install
        working-directory: nexo-one
        run: npm ci --no-audit --no-fund
      - name: Check
        working-directory: nexo-one
        run: npm run check
