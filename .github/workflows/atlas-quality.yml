name: Atlas Quality

on:
  push:
    branches:
      - atlas-control-tower-v3-20260905
      - 'atlas-premium-v2-*'
      - 'atlas-visual-*'
  pull_request:
    paths:
      - 'atlas-control-tower/**'
      - '.github/workflows/atlas-quality.yml'

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-control-tower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit and contract tests
        run: npm test
      - name: Typecheck React frontend
        run: npm run typecheck
      - name: Build production frontend
        run: npm run build
      - name: Run Graph Lab browser smoke
        run: node test/graph-lab-browser-smoke.mjs
      - name: Run Breakthrough React browser smoke
        run: node test/bt-browser-smoke.mjs
      - name: Package tested Atlas build
        uses: actions/upload-artifact@v4
        with:
          name: atlas-control-tower-tested
          path: atlas-control-tower/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
