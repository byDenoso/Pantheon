name: Atlas Quality

on:
  push:
    branches:
      - main
      - feat/nexo-atlas-vnext
      - feat/atlas-graph-engine-v2
    paths:
      - 'atlas-control-tower/**'
      - '.github/workflows/atlas-quality.yml'
  pull_request:
    paths:
      - 'atlas-control-tower/**'
      - '.github/workflows/atlas-quality.yml'
      - '.github/workflows/atlas-deploy.yml'

permissions:
  contents: write

jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-control-tower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install graph-v2 dependencies and generate lock
        if: github.ref == 'refs/heads/feat/atlas-graph-engine-v2'
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Persist graph-v2 lockfile
        if: github.ref == 'refs/heads/feat/atlas-graph-engine-v2'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas-control-tower/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(graph-v2): persist dependency lock"
            git push origin HEAD:feat/atlas-graph-engine-v2
          fi
      - name: Install locked dependencies
        if: github.ref != 'refs/heads/feat/atlas-graph-engine-v2'
        run: npm ci --no-audit --no-fund
      - name: Run unit and contract tests
        run: npm test
      - name: Typecheck React frontend
        run: npm run typecheck
      - name: Build production frontend
        run: npm run build
      - name: Package tested frontend build
        uses: actions/upload-artifact@v4
        with:
          name: atlas-control-tower-dist
          path: atlas-control-tower/dist/
          if-no-files-found: error
          retention-days: 1
