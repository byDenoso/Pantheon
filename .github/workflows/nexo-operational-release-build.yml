name: NEXO operational release assembly
on:
  push:
    branches: [nexo/operational-mcp-production]
    paths:
      - 'scripts/assemble_operational_release.py'
      - '.github/workflows/nexo-operational-release-build.yml'
permissions:
  contents: write
concurrency:
  group: nexo-operational-source-assembly
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'byDenoso/Pantheon' && github.ref == 'refs/heads/nexo/operational-mcp-production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexo/operational-mcp-production
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nexo-one/package-lock.json
      - name: Apply reviewed source wiring
        run: python scripts/assemble_operational_release.py
      - name: Verify Python entrypoint
        run: python -m py_compile scripts/nexo_operational_package.py
      - name: Fix compatible development dependency advisories without force
        working-directory: nexo-one
        run: |
          npm install --save-dev --save-exact vite@8.3.2
          npm audit fix --package-lock-only
          npm ci
      - name: Test installed MCP SDK and existing project
        working-directory: nexo-one
        run: npm run check
      - name: Capture tested source and audit
        run: |
          mkdir -p release-evidence
          (cd nexo-one && npm audit --json) > release-evidence/npm-audit.json || test -s release-evidence/npm-audit.json
          cp scripts/nexo_operational_package.py release-evidence/
          cp nexo-one/server/inbox-gateway.mjs release-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: operational-release-final-evidence
          path: release-evidence/
          retention-days: 7
          if-no-files-found: error
      - name: Commit tested application source only
        run: |
          git add nexo-one/server/inbox-gateway.mjs scripts/nexo_operational_package.py nexo-one/package.json nexo-one/package-lock.json
          git -c user.name=nexo-release-builder -c user.email=nexo-release-builder@users.noreply.github.com commit -m "feat(nexo): reuse Writer OIDC and canonical operational configuration"
          git push origin HEAD:nexo/operational-mcp-production
