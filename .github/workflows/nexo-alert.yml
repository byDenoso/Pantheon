name: NEXO alert

# This workflow reports public projection/observability and Actions execution signals only.
# A public snapshot cannot confirm canonical Tower application or prove that an agent stopped.
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:

concurrency:
  group: nexo-alert-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect observed problems
        run: |
          set -euo pipefail
          projection="$RUNNER_TEMP/nexo-public-projection.json"
          writer_runs="$RUNNER_TEMP/nexo-writer-runs.json"
          problems="$RUNNER_TEMP/nexo-alert-problems.json"
          rm -f "$projection"
          curl -fsS --max-time 20 "https://bydenoso.github.io/Pantheon/tower-projection/projection.json" -o "$projection" || rm -f "$projection"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/nexo-writer-robot.yml/runs?per_page=4&status=completed" --jq '[.workflow_runs[].conclusion] | .[0:2]' > "$writer_runs"
          python3 scripts/nexo_alert.py detect --projection "$projection" --writer-runs "$writer_runs" --now "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" --output "$problems"
          cat "$problems"
      - name: Open, update or close the issue
        run: |
          python3 scripts/nexo_alert.py reconcile --problems "$RUNNER_TEMP/nexo-alert-problems.json"
