name: NEXO alert

# Actions observations prove workflow outcomes only. They do not establish
# private role activity, scientific progress or Tower effects.
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: nexo-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile confirmed Writer failures on condition transitions
        run: python scripts/nexo_alert.py
