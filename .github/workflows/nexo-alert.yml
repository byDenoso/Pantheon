name: NEXO alert

# The only human-facing alarm. It stays silent while the system is healthy and opens (or updates) ONE GitHub issue
# when something the agents cannot fix by themselves breaks. GitHub sends the issue by e-mail. It closes itself on recovery.
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "NEXO: alerta de infraestrutura"
    steps:
      - name: Collect problems
        run: |
          set -u
          : > /tmp/problems
          proj=$(curl -fsS "https://bydenoso.github.io/Pantheon/tower-projection/projection.json" || true)
          if [ -z "$proj" ]; then echo "- O site público não respondeu." >> /tmp/problems; fi
          if [ -n "$proj" ]; then
            gen=$(echo "$proj" | jq -r '.manifest.generated_at // empty')
            if [ -n "$gen" ]; then
              age=$(( ( $(date -u +%s) - $(date -u -d "$gen" +%s) ) / 3600 ))
              [ "$age" -ge 3 ] && echo "- O site está sem atualização há ${age}h (última: $gen)." >> /tmp/problems
            fi
            for role in EXECUTOR LEARNER REFUTADOR GUARDIAO; do
              last=$(echo "$proj" | jq -r --arg r "$role" '[.activity[] | select(.role==$r) | .at] | max // empty')
              if [ -z "$last" ]; then echo "- O papel $role não tem nenhuma ação registrada." >> /tmp/problems; continue; fi
              h=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 3600 ))
              [ "$h" -ge 8 ] && echo "- O papel $role está parado há ${h}h (última ação: $last). A tarefa correspondente no ChatGPT pode ter pausado." >> /tmp/problems
            done
            last_run=$(echo "$proj" | jq -r '[.tests[] | (.executed_at | if type=="object" then .at else . end) // empty] | max // empty')
            if [ -n "$last_run" ]; then
              h=$(( ( $(date -u +%s) - $(date -u -d "$last_run" +%s) ) / 3600 ))
              [ "$h" -ge 6 ] && echo "- Nenhum teste executado há ${h}h: famílias e fila pronta vazias ou baterias paradas." >> /tmp/problems
            fi
            # Only originals await review: an attack (contests_test_id) is evidence about its parent and can never
            # be attacked, so counting attacks made this alarm fire on results the system had already closed.
            pend=$(echo "$proj" | jq -r '[.tests[] | select((.contests_test_id // "") == "" and (.state // .status // "" | ascii_upcase) != "ARCHIVED" and (.verdict // "" | ascii_upcase) == "PROMOTED" and ((.review_state // "PENDING_REVIEW") == "PENDING_REVIEW"))] | length')
            [ "$pend" -gt 5 ] && echo "- ${pend} resultados originais promovidos sem contestação (o Crítico/Refutador deveria atacá-los)." >> /tmp/problems
            health=$(echo "$proj" | jq -r '(.integrity.status // "") + "|" + ((.integrity.failing_areas // []) | join(", "))')
            [ "${health%%|*}" = "RED" ] && echo "- Saúde RED: ${health#*|}." >> /tmp/problems
            open=$(echo "$proj" | jq -r '[.evolution.recipe_health // {} | to_entries[] | .key] | join(", ")')
            [ -n "$open" ] && echo "- Receita com circuito aberto: $open." >> /tmp/problems
          fi
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/nexo-writer-robot.yml/runs?per_page=4&status=completed" --jq '[.workflow_runs[].conclusion] | .[0:2] | join(",")')
          [ "$runs" = "failure,failure" ] && echo "- O robô escritor falhou nas 2 últimas execuções." >> /tmp/problems
          cat /tmp/problems
      - name: Open, update or close the issue
        run: |
          n=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -s /tmp/problems ]; then
            body="$(printf 'Problemas detectados (%s UTC):\n\n%s\n\nO que fazer: abra o chat do ChatGPT das tarefas NEXO em Agendado e retome a tarefa pausada; para o robô, veja a aba Actions.' "$(date -u +%H:%M)" "$(cat /tmp/problems)")"
            if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$TITLE" --body "$body"; fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "Tudo voltou ao normal ($(date -u +%H:%M) UTC)."
          fi
