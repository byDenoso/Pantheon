name: Atlas Feature Package

on:
  push:
    branches: [atlas-nextgen-mobile-fix-20260908]
    paths:
      - 'atlas-control-tower/**'
      - '.github/workflows/atlas-feature-deploy.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test
        working-directory: atlas-control-tower
        run: npm test
      - name: Package source
        run: tar -czf atlas-control-tower-source.tgz atlas-control-tower
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-control-tower-source
          path: atlas-control-tower-source.tgz
          if-no-files-found: error
          retention-days: 1
