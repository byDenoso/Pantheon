name: Actions Projected Work Check
on:
  push:
    branches: [fix-actions-projected-work-20260920]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nexo-one/package-lock.json
      - name: Install
        working-directory: nexo-one
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Check
        working-directory: nexo-one
        run: npm run check
