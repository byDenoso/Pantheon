name: mpi-dependency-builder

on:
  push:
    branches: [ops/mpi-dependency-builder-20260821]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-mpi-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download signed public runtime wheels
        run: |
          set -euxo pipefail
          mkdir wheels
          python -m pip download --no-deps --only-binary=:all: --dest wheels mpi4py==4.1.2 mpich==5.0.1.post1
          sha256sum wheels/* | tee wheels/SHA256SUMS.txt
      - name: Smoke installed MPI layer
        run: |
          set -euxo pipefail
          python -m pip install --target mpi_layer wheels/*.whl
          find mpi_layer -maxdepth 5 \( -name 'mpiexec*' -o -name 'libmpi*.so*' -o -name 'libmpich*.so*' \) -print
          MPIEXEC="$(find mpi_layer -type f -name 'mpiexec*' -perm -u+x | head -1)"
          MPILIB="$(find mpi_layer -type f \( -name 'libmpi.so*' -o -name 'libmpich.so*' \) | head -1)"
          test -n "$MPIEXEC"
          test -n "$MPILIB"
          LIBDIR="$(dirname "$MPILIB")"
          if [ ! -e "$LIBDIR/libmpi.so.12" ]; then
            case "$(basename "$MPILIB")" in
              libmpich.so.12*) ln -s "$(basename "$MPILIB")" "$LIBDIR/libmpi.so.12" ;;
            esac
          fi
          export PATH="$(dirname "$MPIEXEC"):$PATH"
          export LD_LIBRARY_PATH="$LIBDIR:${LD_LIBRARY_PATH:-}"
          export PYTHONPATH="$PWD/mpi_layer"
          "$MPIEXEC" -n 2 python -c 'from mpi4py import MPI; print(f"rank={MPI.COMM_WORLD.rank} size={MPI.COMM_WORLD.size}", flush=True)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpi-runtime-wheels
          path: wheels/
          if-no-files-found: error
          retention-days: 1
