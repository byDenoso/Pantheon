name: NEXO ONE Branch Check

on:
  push:
    branches: [nexo-ui-runtime-pass-20260919-v2]
    paths:
      - 'nexo-one/**'
      - '.github/workflows/nexo-one-branch-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nexo-one/package-lock.json
      - name: Install
        working-directory: nexo-one
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: nexo-one
        run: npm run typecheck
      - name: Targeted regression tests
        working-directory: nexo-one
        run: node --test test/nexo-prime-ui.test.mjs test/ui-language-reconciliation.test.mjs test/mobile-regressions.test.mjs test/frontend.test.mjs
      - name: Style lint
        working-directory: nexo-one
        run: npm run style:lint
      - name: Build
        working-directory: nexo-one
        run: npm run build
      - name: Full suite diagnostic
        continue-on-error: true
        working-directory: nexo-one
        run: npm test
