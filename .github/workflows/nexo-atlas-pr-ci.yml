name: NEXO Research public PR checks

on:
  pull_request:
    paths:
      - 'nexo-atlas/**'
      - '.github/workflows/nexo-atlas-pr-ci.yml'

permissions:
  contents: read

concurrency:
  group: nexo-atlas-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nexo-atlas
    env:
      VITE_PUBLIC_API_URL: /atlas-public.json
      PYTHONUTF8: '1'
      NEXO_REQUIRE_SOURCE_COMMIT: '1'
      NEXO_PUBLIC_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nexo-atlas/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run check
      - name: Verify prior public history is preserved
        env:
          NEXO_REGISTRY_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-research-history.mjs
      - name: Verify static public package and private-data boundary
        run: |
          node scripts/build-pages-public.mjs
          node scripts/build-pages-public.mjs --check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run automated accessibility checks
        run: |
          set -euo pipefail
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4195 --strictPort > /tmp/nexo-atlas-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4195/ > /dev/null; then break; fi
            sleep 1
          done
          node test/research-registry-axe.browser.mjs
          node test/research-revision-notice.browser.mjs
