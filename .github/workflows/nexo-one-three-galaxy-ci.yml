name: NEXO ONE Three Galaxy CI

on:
  push:
    branches:
      - chatgpt/nexo-one-three-galaxy-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nexo-one/package-lock.json
      - name: Install
        working-directory: nexo-one
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: nexo-one
        run: npm run typecheck
      - name: Procedural galaxy tests
        working-directory: nexo-one
        run: node --test test/three-galaxy.test.mjs test/galaxy-stage2.test.mjs test/mobile-regressions.test.mjs
      - name: Full regression suite
        working-directory: nexo-one
        run: npm test
      - name: Style lint
        working-directory: nexo-one
        run: npm run style:lint
      - name: Production build
        working-directory: nexo-one
        run: npm run build
