name: nested private unit tests
on:
  pull_request:
    branches: ['nested/peer-n2']
    paths: ['code/nested_state.py', 'code/nested_private.py', 'code/n2core.py', 'tests/**', '.github/workflows/nested*.yml']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install dynesty==3.1.0 numpy scipy pyyaml > /tmp/install.log 2>&1 || { echo 'STATUS FAILED'; exit 1; }
      - run: python -m unittest discover -s tests -p 'test_nested*.py'
