name: NEXO Writer robot

# The only unattended Tower writer: proposals may remain append-only in the public TCC inbox; this job reads only the delta since its Pantheon cursor, applies it with the canonical writer bundle, and signals the ATLAS.
# Runs in this public repository (no Actions minutes quota). No proposal content is ever printed.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # off-peak minutes every 15 min: GitHub drops some scheduled runs under load (21:07-22:07 UTC were all lost), so a miss costs 15 min, not 1 h; proposals still wake it instantly
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nexo-writer-robot.yml"
      - "nexo-wake/*.json"
      - "nexo-control/execution-assessment-approvals.json"

permissions:
  contents: write
  actions: write
  id-token: write
  issues: write

concurrency:
  group: nexo-writer-robot
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require writer credential
        id: cred
        env:
          WRITER: ${{ secrets.NEXO_DRIVE_WRITER_JSON }}
        run: |
          if [ -z "$WRITER" ]; then echo "NEXO_DRIVE_WRITER_JSON not set; nothing to do."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.cred.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.cred.outputs.ok == 'true'
        with:
          python-version: '3.12'

      - name: Fetch canonical writer bundle from Drive
        if: steps.cred.outputs.ok == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.NEXO_DRIVE_WRITER_JSON }}
        run: |
          pip install --quiet google-auth requests
          python - <<'EOF'
          import json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          info = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])
          creds = service_account.Credentials.from_service_account_info(info, scopes=["https://www.googleapis.com/auth/drive"])
          r = AuthorizedSession(creds).get("https://www.googleapis.com/drive/v3/files/1DBw9H1wUHjZkasE2BI-aEafCzNnjKOjV",
                                           params={"alt": "media", "supportsAllDrives": "true"}, timeout=120)
          r.raise_for_status()
          open("/tmp/nexo_gpt_writer.py", "wb").write(r.content)
          print("bundle bytes", len(r.content))
          EOF

      - name: Reconcile Writer bundle with tested TCC main
        id: bundle
        if: steps.cred.outputs.ok == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.NEXO_DRIVE_WRITER_JSON }}
          GH_TOKEN: ${{ github.token }}
          WRITER_BUNDLE_ID: 1DBw9H1wUHjZkasE2BI-aEafCzNnjKOjV
        run: |
          set -euo pipefail
          drive=$(sha256sum /tmp/nexo_gpt_writer.py | cut -d' ' -f1)
          tested_sha=$(python scripts/select_tested_tcc_main.py)
          if [ -z "$tested_sha" ]; then
            echo "drive=$drive" >> "$GITHUB_OUTPUT"
            echo "main=" >> "$GITHUB_OUTPUT"
            echo "drift=unknown" >> "$GITHUB_OUTPUT"
            echo "reconciled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No tested TCC Writer revision is currently available; retaining the Drive bundle."
            exit 0
          fi

          main_file=/tmp/nexo_gpt_writer.tcc.py
          rm -rf /tmp/tcc-tested
          git clone -q --filter=blob:none --no-checkout https://github.com/byDenoso/TCC.git /tmp/tcc-tested
          git -C /tmp/tcc-tested checkout -q "$tested_sha"
          (cd /tmp/tcc-tested && python scripts/build_gpt_writer_bundle.py >/tmp/tcc-writer-build.log)
          cp /tmp/tcc-tested/gpt/nexo_gpt_writer.py "$main_file"
          python -m py_compile "$main_file"
          main=$(sha256sum "$main_file" | cut -d' ' -f1)
          # Recheck after clone/build as well: never publish a revision that is no
          # longer the tested current main. Keep the already active Drive bytes.
          verified_sha=$(python scripts/select_tested_tcc_main.py)
          if [ "$verified_sha" != "$tested_sha" ]; then
            echo "drive=$drive" >> "$GITHUB_OUTPUT"
            echo "main=" >> "$GITHUB_OUTPUT"
            echo "drift=unknown" >> "$GITHUB_OUTPUT"
            echo "reconciled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TCC main changed or lost matching CI; retaining the Drive bundle."
            exit 0
          fi
          echo "drive=$drive" >> "$GITHUB_OUTPUT"
          echo "main=$main" >> "$GITHUB_OUTPUT"

          if [ "$drive" != "$main" ]; then
            cp "$main_file" /tmp/nexo_gpt_writer.py
            python - <<'PY'
          import hashlib, json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession

          info = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])
          creds = service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/drive"])
          session = AuthorizedSession(creds)
          file_id = os.environ["WRITER_BUNDLE_ID"]
          local = open("/tmp/nexo_gpt_writer.py", "rb").read()
          response = session.patch(
              f"https://www.googleapis.com/upload/drive/v3/files/{file_id}",
              params={"uploadType": "media", "supportsAllDrives": "true"},
              data=local,
              headers={"Content-Type": "text/x-python"},
              timeout=120,
          )
          response.raise_for_status()
          readback = session.get(
              f"https://www.googleapis.com/drive/v3/files/{file_id}",
              params={"alt": "media", "supportsAllDrives": "true"},
              timeout=120,
          )
          readback.raise_for_status()
          if hashlib.sha256(readback.content).digest() != hashlib.sha256(local).digest():
              raise SystemExit("Drive Writer bundle readback hash mismatch")
          print("Drive Writer bundle reconciled and read back")
          PY
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "reconciled=true" >> "$GITHUB_OUTPUT"
            echo "bundle reconciled drive=${drive:0:12} -> tested_tcc=${main:0:12} @ ${tested_sha:0:12}"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "reconciled=false" >> "$GITHUB_OUTPUT"
            echo "bundle aligned drive=${drive:0:12} tested_tcc=${main:0:12} @ ${tested_sha:0:12}"
          fi

      - name: Collect proposals from public TCC inbox
        if: steps.cred.outputs.ok == 'true'
        env:
          TCC_REPO: byDenoso/TCC
          TCC_BRANCH: nexo-inbox
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, urllib.parse, urllib.request
          from scripts.github_api_read import read_api_json

          cursor_path="nexo-one/tcc-public-inbox-ack.json"
          cursor=json.load(open(cursor_path,encoding="utf-8"))
          base=str(cursor.get("base_commit") or "").strip()
          if not base:
              raise SystemExit("public inbox cursor missing base_commit")

          repo=os.environ["TCC_REPO"]
          branch=os.environ["TCC_BRANCH"]
          event=os.environ.get("EVENT_NAME","")
          headers={"Accept":"application/vnd.github+json","User-Agent":"nexo-writer-robot"}
          ref_api=f"https://api.github.com/repos/{repo}/git/ref/heads/{branch}"
          ref=read_api_json(ref_api)
          head=str((ref.get("object") or {}).get("sha") or "").strip()
          if not head:
              raise SystemExit("public inbox ref missing head sha")

          if event=="workflow_dispatch":
              tree_api=f"https://api.github.com/repos/{repo}/git/trees/{head}?recursive=1"
              tree=read_api_json(tree_api)
              source_files=[
                  {"filename":str(item.get("path") or ""),"status":"modified"}
                  for item in (tree.get("tree") or [])
                  if item.get("type")=="blob"
                  and str(item.get("path") or "").startswith("inbox/")
                  and str(item.get("path") or "").endswith(".json")
              ]
          else:
              api=f"https://api.github.com/repos/{repo}/compare/{base}...{head}"
              comparison=read_api_json(api)
              source_files=comparison.get("files") or []

          acked=cursor.get("acked") or {}
          receipts=cursor.get("receipts") or {}
          resolved_outcomes={"APPLIED","ALREADY_APPLIED","REJECTED_TERMINAL"}
          def cursor_resolved(path, fingerprint):
              if acked.get(path)==fingerprint:
                  return True
              value=receipts.get(path)
              if isinstance(value,dict):
                  if value.get("fingerprint")!=fingerprint:
                      return False
                  # Entries written before OPERATION_RECEIPT_V1 are legacy acks.
                  outcome=value.get("outcome")
                  return outcome in resolved_outcomes if outcome else True
              return value==fingerprint

          candidates=[]
          for item in source_files:
              path=str(item.get("filename") or "")
              if not path.startswith("inbox/") or not path.endswith(".json"):
                  continue
              if str(item.get("status") or "")=="removed":
                  continue
              raw_url="https://raw.githubusercontent.com/"+repo+"/"+head+"/"+urllib.parse.quote(path,safe="/")
              raw=urllib.request.urlopen(
                  urllib.request.Request(raw_url,headers={"User-Agent":"nexo-writer-robot"}),
                  timeout=60,
              ).read()
              fingerprint=hashlib.sha256(raw).hexdigest()
              if cursor_resolved(path,fingerprint):
                  continue
              try:
                  envelope=json.loads(raw.decode("utf-8-sig"))
              except Exception:
                  print("skip invalid json",path)
                  continue
              stable=hashlib.sha256((path+"\0"+fingerprint).encode()).hexdigest()[:32]
              candidates.append({"id":"tcc-"+stable,"path":path,"fingerprint":fingerprint,"envelope":envelope})

          gateway={"items":[{"id":item["id"],"envelope":item["envelope"]} for item in candidates]}
          json.dump(gateway,open("/tmp/gateway.json","w",encoding="utf-8"),ensure_ascii=False)
          json.dump(
              {"head_sha":head,"items":[{k:v for k,v in item.items() if k!="envelope"} for item in candidates]},
              open("/tmp/tcc-public-map.json","w",encoding="utf-8"),
              ensure_ascii=False,
          )
          print("public TCC inbox items",len(candidates),"mode",("full-scan" if event=="workflow_dispatch" else "delta"))
          PY

      - name: Collect proposals from scheduled Sheet spool
        if: steps.cred.outputs.ok == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.NEXO_DRIVE_WRITER_JSON }}
          SPOOL_ID: 1M2maKkuEjxumZRa145dzei7dEPFi2yKsKlUf7_scC-E
        run: |
          python - <<'PY'
          import base64, csv, io, json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession

          path="/tmp/gateway.json"
          try:
              gateway=json.load(open(path,encoding="utf-8"))
          except Exception:
              gateway={"items":[]}
          gateway.setdefault("items",[])

          ack_path="nexo-one/scheduled-spool-ack.json"
          try:
              ack=json.load(open(ack_path,encoding="utf-8")).get("acked",{})
          except Exception:
              ack={}

          info=json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])
          creds=service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/drive.readonly"])
          s=AuthorizedSession(creds)
          url=f"https://www.googleapis.com/drive/v3/files/{os.environ['SPOOL_ID']}/export"
          r=s.get(url,params={"mimeType":"text/csv"},timeout=60)
          r.raise_for_status()

          reader=csv.DictReader(io.StringIO(r.text))
          mapping=[]
          for row in reader:
              stable=(row.get("stable_id") or "").strip().lower()
              raw=(row.get("envelope_b64url") or "").strip()
              if not stable or not raw or stable in ack:
                  continue
              try:
                  padded=raw+"="*((4-len(raw)%4)%4)
                  envelope=json.loads(base64.urlsafe_b64decode(padded.encode()).decode("utf-8"))
              except Exception:
                  continue
              item_id=f"sheet-{stable}"
              gateway["items"].append({"id":item_id,"envelope":envelope})
              mapping.append({"id":item_id,"stable_id":stable})
          json.dump(gateway,open(path,"w",encoding="utf-8"),ensure_ascii=False)
          json.dump(mapping,open("/tmp/sheet-spool-map.json","w",encoding="utf-8"),ensure_ascii=False)
          print("sheet spool items",len(mapping))
          PY

      - name: Collect finished test batteries
        if: steps.cred.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/bat /tmp/dispatch
          gh run list --repo "$GITHUB_REPOSITORY" --workflow nexo-test-battery.yml --status completed --limit 20 --json databaseId,displayTitle,event,conclusion,startedAt,updatedAt > /tmp/bat/runs.json || echo '[]' > /tmp/bat/runs.json
          python3 - <<'PY'
          import json, subprocess, os, pathlib
          from datetime import datetime, timezone

          def parsed(value):
              if not value:
                  return None
              try:
                  return datetime.fromisoformat(str(value).replace("Z", "+00:00")).astimezone(timezone.utc)
              except ValueError:
                  return None

          runs = json.load(open("/tmp/bat/runs.json"))
          updates = []
          for run in runs:
              if str(run.get("event") or "") != "workflow_dispatch":
                  continue  # PR canaries prove the runner but never enter canonical state
              bid = str(run.get("displayTitle", "")).replace("battery ", "").strip()
              if not bid:
                  continue
              run_ref = f"actions/runs/{run['databaseId']}"
              d = pathlib.Path(f"/tmp/bat/{run['databaseId']}")
              dl = subprocess.run(["gh", "run", "download", str(run["databaseId"]), "--repo",
                                   os.environ["GITHUB_REPOSITORY"], "-n", "battery-results", "-D", str(d)],
                                  capture_output=True)
              result_file = d / "battery-results.json"
              if dl.returncode != 0 or not result_file.is_file():
                  conclusion = str(run.get("conclusion") or "startup_failure")
                  if conclusion not in {"failure", "cancelled", "timed_out", "startup_failure"}:
                      conclusion = "startup_failure"
                  updates.append({"kind": "BATTERY_STATUS", "source": "WRITER_ROBOT",
                                  "payload": {"battery_id": bid, "status": "DONE", "run_ref": run_ref,
                                              "completed_at": run.get("updatedAt"), "conclusion": conclusion,
                                              "results_missing": True, "results": []}})
                  continue

              results = json.load(open(result_file, encoding="utf-8")).get("results", [])
              started = {str(row.get("test_id")): row.get("started_at") for row in results
                         if isinstance(row, dict) and row.get("test_id") and parsed(row.get("started_at"))}
              if started:
                  updates.append({"kind": "BATTERY_STATUS", "source": "WRITER_ROBOT",
                                  "payload": {"battery_id": bid, "status": "RUNNING", "run_ref": run_ref,
                                              "started_tests": started}})
              completion_times = [parsed(row.get("executed_at")) for row in results if isinstance(row, dict)]
              completion_times = [stamp for stamp in completion_times if stamp is not None]
              completed = max(completion_times).isoformat().replace("+00:00", "Z") if completion_times else run.get("updatedAt")
              updates.append({"kind": "BATTERY_STATUS", "source": "WRITER_ROBOT",
                              "payload": {"battery_id": bid, "status": "DONE", "run_ref": run_ref,
                                          "completed_at": completed, "conclusion": run.get("conclusion"),
                                          "results": results}})
          json.dump(updates, open("/tmp/bat/updates.json", "w", encoding="utf-8"), ensure_ascii=False)
          print("battery runs seen", len(runs), "observations", len(updates))
          PY
          python scripts/collect_execution_assessments.py --approvals nexo-control/execution-assessment-approvals.json --updates /tmp/bat/updates.json

      - name: Apply inbox to the Tower
        id: robot
        if: steps.cred.outputs.ok == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.NEXO_DRIVE_WRITER_JSON }}
          NEXO_GATEWAY_ITEMS: /tmp/gateway.json
          NEXO_OPERATION_RECEIPTS_OUT: /tmp/operation-public-receipts.json
          NEXO_BATTERY_UPDATES: /tmp/bat/updates.json
          NEXO_BATTERY_DIR: /tmp/dispatch
          NEXO_RECIPE_REVISION: ${{ github.sha }}
          # Read the existing approval registry from this checked-out revision.
          # Missing or mismatched admin-managed pins leave C01 fail-closed/OFF.
          NEXO_C01_APPROVAL_REGISTRY_PATH: ${{ github.workspace }}/nexo-control/execution-assessment-approvals.json
          NEXO_C01_APPROVAL_REGISTRY_SHA256: ${{ vars.NEXO_C01_APPROVAL_REGISTRY_SHA256 }}
          NEXO_C01_APPROVAL_REF: ${{ vars.NEXO_C01_APPROVAL_REF }}
          NEXO_C01_APPROVED_AT: ${{ vars.NEXO_C01_APPROVED_AT }}
        # Who runs the scheduled roles: nexo-control/producers.json (GPT | CLAUDE). The other producer is shadow-only.
        run: |
          export NEXO_ACTIVE_PRODUCER=$(python -c "import json;print(json.load(open('nexo-control/producers.json')).get('active','GPT'))" 2>/dev/null || echo GPT)
          echo "active producer: $NEXO_ACTIVE_PRODUCER"
          python /tmp/nexo_gpt_writer.py robot

      - name: Dispatch queued test batteries
        if: steps.robot.outputs.tower_revision != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          specs=(/tmp/dispatch/*.json)
          [ ${#specs[@]} -eq 0 ] && { echo "no batteries"; exit 0; }
          git config user.name "nexo-writer-robot"; git config user.email "nexo-writer-robot@users.noreply.github.com"
          rm -rf /tmp/bb && git clone -q --depth 1 --branch nexo-batteries "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/bb 2>/dev/null || {
            mkdir -p /tmp/bb && cd /tmp/bb && git init -q && git checkout -q -b nexo-batteries && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"; cd - >/dev/null; }
          mkdir -p /tmp/bb/batteries
          for f in "${specs[@]}"; do cp "$f" /tmp/bb/batteries/; done
          cd /tmp/bb && git -c user.name=nexo-writer-robot -c user.email=nexo-writer-robot@users.noreply.github.com add batteries && git -c user.name=nexo-writer-robot -c user.email=nexo-writer-robot@users.noreply.github.com commit -qm "batteries: dispatch $(ls batteries | wc -l)" && git push -q origin nexo-batteries
          for f in "${specs[@]}"; do id=$(basename "$f" .json); gh workflow run nexo-test-battery.yml --repo "$GITHUB_REPOSITORY" --ref main -f battery_id="$id"; echo "dispatched $id"; done

      - name: Record public TCC operation receipts
        if: steps.robot.outputs.gateway_reported != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPORTED: ${{ steps.robot.outputs.gateway_reported }}
          RESOLVED: ${{ steps.robot.outputs.gateway_resolved }}
          REV: ${{ steps.robot.outputs.tower_revision }}
        run: |
          python - <<'PY'
          import base64, datetime, json, os, subprocess, time

          map_path="/tmp/tcc-public-map.json"
          if not os.path.exists(map_path):
              raise SystemExit(0)

          reported={value for value in os.environ.get("REPORTED","").split(",") if value}
          resolved={value for value in os.environ.get("RESOLVED","").split(",") if value}
          try:
              receipt_items={item.get("id"):item for item in json.load(open("/tmp/operation-public-receipts.json",encoding="utf-8")).get("items",[])}
          except Exception:
              receipt_items={}
          mapping=json.load(open(map_path,encoding="utf-8"))
          path="nexo-one/tcc-public-inbox-ack.json"
          repo=os.environ["GITHUB_REPOSITORY"]
          now=datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          rev=os.environ.get("REV","")

          for attempt in range(1,6):
              get=subprocess.run(["gh","api",f"repos/{repo}/contents/{path}?ref=main"],text=True,capture_output=True)
              if get.returncode!=0:
                  print("public inbox cursor read retry",attempt); time.sleep(2); continue
              meta=json.loads(get.stdout)
              cursor=json.loads(base64.b64decode(meta["content"]).decode())
              acked=cursor.setdefault("acked",{})
              receipts=cursor.setdefault("receipts",{})

              for old_path, old_fp in list(acked.items()):
                  receipts.setdefault(old_path,{"fingerprint":old_fp,"source":"legacy-acked"})

              for item in mapping.get("items") or []:
                  item_id=item.get("id")
                  if item_id not in reported:
                      continue
                  public=receipt_items.get(item_id) or {}
                  outcome=public.get("outcome")
                  receipts[item["path"]]={
                      "fingerprint":item["fingerprint"],
                      "outcome":outcome,
                      "receipt_ids":public.get("receipt_ids",[]),
                      "receipts":public.get("receipts",[]),
                      "observed_at":now,
                      "tower_revision":rev or None,
                  }
                  if item_id in resolved and outcome in {"APPLIED","ALREADY_APPLIED","REJECTED_TERMINAL"}:
                      acked[item["path"]]=item["fingerprint"]
                  else:
                      acked.pop(item["path"],None)

              def is_resolved(item):
                  path=item["path"]
                  value=receipts.get(path)
                  if isinstance(value,dict):
                      if value.get("fingerprint")!=item["fingerprint"]:
                          return False
                      outcome=value.get("outcome")
                      return outcome in {"APPLIED","ALREADY_APPLIED","REJECTED_TERMINAL"} if outcome else acked.get(path)==item["fingerprint"]
                  return acked.get(path)==item["fingerprint"]
              all_current=all(is_resolved(item) for item in (mapping.get("items") or []))
              if all_current:
                  cursor["base_commit"]=mapping.get("head_sha") or cursor.get("base_commit")
                  cursor["acked"]={}

              body=json.dumps(cursor,indent=2,sort_keys=True)+"\n"
              payload=json.dumps({
                  "message":"NEXO writer robot: advance public TCC inbox cursor",
                  "content":base64.b64encode(body.encode()).decode(),
                  "sha":meta["sha"],
                  "branch":"main",
              })
              put=subprocess.run(
                  ["gh","api","--method","PUT",f"repos/{repo}/contents/{path}","--input","-"],
                  input=payload,text=True,capture_output=True
              )
              if put.returncode==0:
                  print("public TCC inbox cursor PASS receipts",len(receipts))
                  raise SystemExit(0)
              print("public inbox cursor CAS retry",attempt); time.sleep(2)

          raise SystemExit("public TCC inbox cursor update failed after retries")
          PY

      - name: Acknowledge applied scheduled Sheet spool proposals
        if: steps.robot.outputs.gateway_resolved != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED: ${{ steps.robot.outputs.gateway_resolved }}
        run: |
          python - <<'PY'
          import base64, datetime, json, os, subprocess, time

          map_path="/tmp/sheet-spool-map.json"
          if not os.path.exists(map_path):
              raise SystemExit(0)

          resolved=set(x for x in os.environ.get("RESOLVED","").split(",") if x)
          mapping=json.load(open(map_path,encoding="utf-8"))
          stable=[x["stable_id"] for x in mapping if x.get("id") in resolved]
          if not stable:
              print("sheet spool ack 0")
              raise SystemExit(0)

          repo=os.environ["GITHUB_REPOSITORY"]
          path="nexo-one/scheduled-spool-ack.json"
          now=datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          for attempt in range(1,6):
              get=subprocess.run(
                  ["gh","api",f"repos/{repo}/contents/{path}?ref=main"],
                  text=True,capture_output=True
              )
              if get.returncode!=0:
                  print("sheet ack ledger read retry",attempt)
                  time.sleep(2); continue
              meta=json.loads(get.stdout)
              current=json.loads(base64.b64decode(meta["content"]).decode())
              current.setdefault("version",1)
              acked=current.setdefault("acked",{})
              for sid in stable:
                  acked[sid]=now
              body=json.dumps(current,indent=2,sort_keys=True)+"\n"
              payload=json.dumps({
                  "message":f"NEXO writer robot: ack {len(stable)} scheduled spool item(s)",
                  "content":base64.b64encode(body.encode()).decode(),
                  "sha":meta["sha"],
                  "branch":"main",
              })
              put=subprocess.run(
                  ["gh","api","--method","PUT",f"repos/{repo}/contents/{path}","--input","-"],
                  input=payload,text=True,capture_output=True
              )
              if put.returncode==0:
                  print("sheet spool ack",len(stable))
                  raise SystemExit(0)
              print("sheet ack ledger CAS retry",attempt)
              time.sleep(2)

          raise SystemExit("sheet spool ack failed after retries")
          PY

      - name: Signal the ATLAS (tower-head)
        if: steps.robot.outputs.tower_revision != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REV: ${{ steps.robot.outputs.tower_revision }}
        run: |
          # Update tower-head with GitHub Contents API CAS instead of a local
          # commit/rebase. Other workflows also write main, so rebasing this
          # one-file signal can conflict even after the Tower write succeeded.
          python - <<'PY'
          import base64, datetime, json, os, subprocess, time

          repo = os.environ["GITHUB_REPOSITORY"]
          rev = os.environ["REV"]
          path = "nexo-one/tower-head.json"
          body = json.dumps({
              "tower_revision": rev,
              "signalled_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }, indent=2) + "\n"
          encoded = base64.b64encode(body.encode()).decode()

          for attempt in range(1, 6):
              get = subprocess.run(
                  ["gh", "api", f"repos/{repo}/contents/{path}?ref=main"],
                  text=True, capture_output=True
              )
              if get.returncode != 0:
                  print(f"tower-head read failed on attempt {attempt}")
                  time.sleep(2)
                  continue
              sha = json.loads(get.stdout)["sha"]
              payload = json.dumps({
                  "message": f"NEXO writer robot: tower head {rev}",
                  "content": encoded,
                  "sha": sha,
                  "branch": "main",
              })
              put = subprocess.run(
                  ["gh", "api", "--method", "PUT", f"repos/{repo}/contents/{path}", "--input", "-"],
                  input=payload, text=True, capture_output=True
              )
              if put.returncode == 0:
                  print("tower-head CAS PASS")
                  raise SystemExit(0)
              print(f"tower-head CAS conflict/retry {attempt}")
              time.sleep(2)

          raise SystemExit("tower-head CAS failed after 5 retries")
          PY

      - name: Rebuild the ATLAS now
        if: steps.robot.outputs.tower_revision != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nexo-one-pages.yml --ref main

      - name: Run the health alarm (hourly; GitHub drops the alarm's own schedule)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/nexo-alert.yml/runs?per_page=1" --jq '.workflow_runs[0].created_at // "1970-01-01T00:00:00Z"')
          if [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -ge 3000 ]; then gh workflow run nexo-alert.yml --ref main && echo "alarm dispatched"; else echo "alarm ran recently"; fi

      - name: Report writer bundle drift (one issue, closes itself)
        if: always() && steps.bundle.outputs.drift != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRIFT: ${{ steps.bundle.outputs.drift }}
          DRIVE: ${{ steps.bundle.outputs.drive }}
          MAIN: ${{ steps.bundle.outputs.main }}
          TITLE: "NEXO: robô rodando bundle diferente do TCC main"
        run: |
          n=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ "$DRIFT" = "true" ]; then
            body=$(printf 'O robô baixou do Drive o bundle `%s`, mas o `gpt/nexo_gpt_writer.py` do TCC main é `%s`.\n\nCorreções já mergeadas no TCC não estão rodando.\n\nPara alinhar: no TCC, `python scripts/build_gpt_writer_bundle.py --upload` (credencial do Drive).' "${DRIVE:0:12}" "${MAIN:0:12}")
            if [ -z "$n" ]; then gh issue create --title "$TITLE" --body "$body"; fi
          elif [ "$DRIFT" = "false" ] && [ -n "$n" ]; then
            gh issue close "$n" --comment "Bundle do Drive alinhado ao último Writer testado no TCC (${MAIN:0:12})."
          fi
