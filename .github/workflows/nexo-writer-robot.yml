name: NEXO Writer robot

# The only unattended Tower writer: ChatGPT tasks create small proposals in Drive NEXO_INBOX
# (or TCC nexo-inbox); this job applies them with the canonical writer bundle and signals the ATLAS.
# Runs in this public repository (no Actions minutes quota). No proposal content is ever printed.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nexo-writer-robot.yml"

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: nexo-writer-robot
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require writer credential
        id: cred
        env:
          WRITER: ${{ secrets.NEXO_DRIVE_WRITER_JSON }}
        run: |
          if [ -z "$WRITER" ]; then echo "NEXO_DRIVE_WRITER_JSON not set; nothing to do."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.cred.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.cred.outputs.ok == 'true'
        with:
          python-version: '3.12'

      - name: Fetch canonical writer bundle from Drive
        if: steps.cred.outputs.ok == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.NEXO_DRIVE_WRITER_JSON }}
        run: |
          pip install --quiet google-auth requests
          python - <<'EOF'
          import json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          info = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])
          creds = service_account.Credentials.from_service_account_info(info, scopes=["https://www.googleapis.com/auth/drive"])
          r = AuthorizedSession(creds).get("https://www.googleapis.com/drive/v3/files/1DBw9H1wUHjZkasE2BI-aEafCzNnjKOjV",
                                           params={"alt": "media", "supportsAllDrives": "true"}, timeout=120)
          r.raise_for_status()
          open("/tmp/nexo_gpt_writer.py", "wb").write(r.content)
          print("bundle bytes", len(r.content))
          EOF

      - name: Collect proposals from the inbox gateway (OIDC, no secret)
        if: steps.cred.outputs.ok == 'true'
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nexo-inbox" | python -c "import sys,json;print(json.load(sys.stdin)['value'])")
          echo "::add-mask::$TOKEN"
          curl -sS -H "Authorization: Bearer $TOKEN" https://nexo-one-two.vercel.app/api/inbox-list -o /tmp/gateway.json || echo '{"items":[]}' > /tmp/gateway.json
          python -c "import json;d=json.load(open('/tmp/gateway.json'));print('gateway items',len(d.get('items') or []), d.get('error',''))"
          echo "$TOKEN" > /tmp/oidc.txt

      - name: Collect proposals from Gmail spool
        if: steps.cred.outputs.ok == 'true'
        env:
          NEXO_GMAIL_IMAP_JSON: ${{ secrets.NEXO_GMAIL_IMAP_JSON }}
        run: |
          python - <<'PY'
          import base64, email, imaplib, json, os, re
          from email.header import decode_header

          path="/tmp/gateway.json"
          try:
              gateway=json.load(open(path,encoding="utf-8"))
          except Exception:
              gateway={"items":[]}
          gateway.setdefault("items",[])
          cfg_raw=os.environ.get("NEXO_GMAIL_IMAP_JSON","").strip()
          if not cfg_raw:
              json.dump([],open("/tmp/gmail-spool-map.json","w"))
              print("gmail spool not configured")
              raise SystemExit(0)
          cfg=json.loads(cfg_raw)
          user=str(cfg["user"]).strip()
          password=str(cfg["app_password"]).replace(" ","").strip()
          M=imaplib.IMAP4_SSL("imap.gmail.com",993)
          M.login(user,password)
          M.select("INBOX")
          typ,data=M.uid("search",None,'UNSEEN SUBJECT "[NEXO_INBOX]"')
          uids=(data[0].decode().split() if typ=="OK" and data and data[0] else [])
          mapping=[]
          for uid in uids[-100:]:
              typ,msgdata=M.uid("fetch",uid,"(RFC822)")
              if typ!="OK" or not msgdata or not msgdata[0]:
                  continue
              msg=email.message_from_bytes(msgdata[0][1])
              subject=str(msg.get("Subject") or "")
              m=re.search(r"\[NEXO_INBOX\]\s+([a-z0-9-]{4,60})",subject,re.I)
              if not m:
                  continue
              stable=m.group(1).lower()
              parts=[]
              if msg.is_multipart():
                  for p in msg.walk():
                      if p.get_content_type()=="text/plain" and not str(p.get("Content-Disposition") or "").lower().startswith("attachment"):
                          parts.append((p.get_payload(decode=True) or b"").decode(p.get_content_charset() or "utf-8","replace"))
              else:
                  parts.append((msg.get_payload(decode=True) or b"").decode(msg.get_content_charset() or "utf-8","replace"))
              body="\n".join(parts)
              mm=re.search(r"NEXO_ENVELOPE_B64URL\s*\n([A-Za-z0-9_-]+)\s*\nEND_NEXO_ENVELOPE_B64URL",body,re.S)
              if not mm:
                  continue
              raw=mm.group(1)
              raw += "="*((4-len(raw)%4)%4)
              try:
                  envelope=json.loads(base64.urlsafe_b64decode(raw.encode()).decode("utf-8"))
              except Exception:
                  continue
              item_id=f"gmail-{uid}-{stable}"
              gateway["items"].append({"id":item_id,"envelope":envelope})
              mapping.append({"id":item_id,"uid":uid})
          json.dump(gateway,open(path,"w",encoding="utf-8"),ensure_ascii=False)
          json.dump(mapping,open("/tmp/gmail-spool-map.json","w"),ensure_ascii=False)
          M.logout()
          print("gmail spool items",len(mapping))
          PY

      - name: Collect finished test batteries
        if: steps.cred.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/bat /tmp/dispatch
          gh run list --repo "$GITHUB_REPOSITORY" --workflow nexo-test-battery.yml --status completed --limit 20 --json databaseId,displayTitle > /tmp/bat/runs.json || echo '[]' > /tmp/bat/runs.json
          python3 - <<'PY'
          import json, subprocess, os, pathlib
          runs = json.load(open("/tmp/bat/runs.json"))
          updates = []
          for run in runs:
              bid = str(run.get("displayTitle", "")).replace("battery ", "").strip()
              if not bid:
                  continue
              d = pathlib.Path(f"/tmp/bat/{run['databaseId']}")
              r = subprocess.run(["gh", "run", "download", str(run["databaseId"]), "--repo", os.environ["GITHUB_REPOSITORY"], "-n", "battery-results", "-D", str(d)], capture_output=True)
              f = d / "battery-results.json"
              if r.returncode != 0 or not f.is_file():
                  continue
              results = json.load(open(f, encoding="utf-8")).get("results", [])
              updates.append({"kind": "BATTERY_STATUS", "source": "WRITER_ROBOT",
                              "payload": {"battery_id": bid, "status": "DONE", "run_ref": f"actions/runs/{run['databaseId']}", "results": results}})
          json.dump(updates, open("/tmp/bat/updates.json", "w", encoding="utf-8"), ensure_ascii=False)
          print("battery runs seen", len(runs), "collected", len(updates))
          PY

      - name: Apply inbox to the Tower
        id: robot
        if: steps.cred.outputs.ok == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.NEXO_DRIVE_WRITER_JSON }}
          NEXO_INBOX_GITHUB_TOKEN: ${{ secrets.NEXO_INBOX_TOKEN }}
          NEXO_GATEWAY_ITEMS: /tmp/gateway.json
          NEXO_BATTERY_UPDATES: /tmp/bat/updates.json
          NEXO_BATTERY_DIR: /tmp/dispatch
        run: python /tmp/nexo_gpt_writer.py robot

      - name: Dispatch queued test batteries
        if: steps.robot.outputs.tower_revision != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          specs=(/tmp/dispatch/*.json)
          [ ${#specs[@]} -eq 0 ] && { echo "no batteries"; exit 0; }
          git config user.name "nexo-writer-robot"; git config user.email "nexo-writer-robot@users.noreply.github.com"
          rm -rf /tmp/bb && git clone -q --depth 1 --branch nexo-batteries "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/bb 2>/dev/null || {
            mkdir -p /tmp/bb && cd /tmp/bb && git init -q && git checkout -q -b nexo-batteries && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"; cd - >/dev/null; }
          mkdir -p /tmp/bb/batteries
          for f in "${specs[@]}"; do cp "$f" /tmp/bb/batteries/; done
          cd /tmp/bb && git -c user.name=nexo-writer-robot -c user.email=nexo-writer-robot@users.noreply.github.com add batteries && git -c user.name=nexo-writer-robot -c user.email=nexo-writer-robot@users.noreply.github.com commit -qm "batteries: dispatch $(ls batteries | wc -l)" && git push -q origin nexo-batteries
          for f in "${specs[@]}"; do id=$(basename "$f" .json); gh workflow run nexo-test-battery.yml --repo "$GITHUB_REPOSITORY" --ref main -f battery_id="$id"; echo "dispatched $id"; done

      - name: Acknowledge applied gateway proposals
        if: steps.robot.outputs.gateway_applied != ''
        run: |
          curl -sS -H "Authorization: Bearer $(cat /tmp/oidc.txt)" "https://nexo-one-two.vercel.app/api/inbox-ack?ids=${{ steps.robot.outputs.gateway_applied }}"

      - name: Acknowledge applied Gmail spool proposals
        if: steps.robot.outputs.gateway_applied != ''
        env:
          NEXO_GMAIL_IMAP_JSON: ${{ secrets.NEXO_GMAIL_IMAP_JSON }}
          APPLIED: ${{ steps.robot.outputs.gateway_applied }}
        run: |
          python - <<'PY'
          import imaplib, json, os
          cfg_raw=os.environ.get("NEXO_GMAIL_IMAP_JSON","").strip()
          if not cfg_raw or not os.path.exists("/tmp/gmail-spool-map.json"):
              raise SystemExit(0)
          cfg=json.loads(cfg_raw)
          applied=set(x for x in os.environ.get("APPLIED","").split(",") if x)
          mapping=json.load(open("/tmp/gmail-spool-map.json"))
          uids=[str(x["uid"]) for x in mapping if x.get("id") in applied]
          if not uids:
              print("gmail spool ack 0")
              raise SystemExit(0)
          M=imaplib.IMAP4_SSL("imap.gmail.com",993)
          M.login(str(cfg["user"]).strip(),str(cfg["app_password"]).replace(" ","").strip())
          M.select("INBOX")
          for uid in uids:
              M.uid("store",uid,"+FLAGS","(\\Seen)")
          M.logout()
          print("gmail spool ack",len(uids))
          PY

      - name: Signal the ATLAS (tower-head)
        if: steps.robot.outputs.tower_revision != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REV: ${{ steps.robot.outputs.tower_revision }}
        run: |
          # Update tower-head with GitHub Contents API CAS instead of a local
          # commit/rebase. Other workflows also write main, so rebasing this
          # one-file signal can conflict even after the Tower write succeeded.
          python - <<'PY'
          import base64, datetime, json, os, subprocess, time

          repo = os.environ["GITHUB_REPOSITORY"]
          rev = os.environ["REV"]
          path = "nexo-one/tower-head.json"
          body = json.dumps({
              "tower_revision": rev,
              "signalled_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }, indent=2) + "\n"
          encoded = base64.b64encode(body.encode()).decode()

          for attempt in range(1, 6):
              get = subprocess.run(
                  ["gh", "api", f"repos/{repo}/contents/{path}?ref=main"],
                  text=True, capture_output=True
              )
              if get.returncode != 0:
                  print(f"tower-head read failed on attempt {attempt}")
                  time.sleep(2)
                  continue
              sha = json.loads(get.stdout)["sha"]
              payload = json.dumps({
                  "message": f"NEXO writer robot: tower head {rev}",
                  "content": encoded,
                  "sha": sha,
                  "branch": "main",
              })
              put = subprocess.run(
                  ["gh", "api", "--method", "PUT", f"repos/{repo}/contents/{path}", "--input", "-"],
                  input=payload, text=True, capture_output=True
              )
              if put.returncode == 0:
                  print("tower-head CAS PASS")
                  raise SystemExit(0)
              print(f"tower-head CAS conflict/retry {attempt}")
              time.sleep(2)

          raise SystemExit("tower-head CAS failed after 5 retries")
          PY

      - name: Rebuild the ATLAS now
        if: steps.robot.outputs.tower_revision != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nexo-one-pages.yml --ref main
