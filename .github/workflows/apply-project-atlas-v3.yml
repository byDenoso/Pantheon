name: Apply Project Atlas v3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'project-atlas'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Atlas branch
        uses: actions/checkout@v4
        with:
          ref: project-atlas
          fetch-depth: 0

      - name: Detect, decode and validate repository payload
        id: payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, tarfile

          EXPECTED_SHA256 = 'be0d44f56ce90ebe70e09d975a94862aea6692f9959096c8cfc0d0d6ee371245'
          EXPECTED_BASE64_LENGTH = 77544
          single = Path('.atlas-bootstrap/payload.b64')
          chunks = sorted(Path('.atlas-bootstrap').glob('chunk-*'))
          if single.exists():
              encoded = ''.join(single.read_text(encoding='utf-8').split())
              source = single.name
          elif chunks:
              encoded = ''.join(''.join(path.read_text(encoding='utf-8').split()) for path in chunks)
              source = f'{len(chunks)} chunks'
          else:
              Path('/tmp/no-atlas-payload').write_text('true')
              print('No migration payload; branch is already materialized.')
              raise SystemExit(0)
          if len(encoded) != EXPECTED_BASE64_LENGTH:
              raise SystemExit(f'Unexpected payload length: {len(encoded)} from {source}')
          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          if digest != EXPECTED_SHA256:
              raise SystemExit(f'Payload SHA mismatch: {digest}')
          target = Path('/tmp/project-atlas.tar.gz')
          target.write_bytes(archive)
          with tarfile.open(target, 'r:gz') as tar:
              members = tar.getmembers()
              names = {member.name.removeprefix('./') for member in members}
              required = {'package.json', 'api/manifest.js', 'data/manifest.json', 'src/app.js', 'tests/api.test.mjs'}
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'Missing required files: {missing}')
          print(f'validated source={source} archive={len(archive)} sha256={digest} members={len(members)}')
          PY
          if [ -f /tmp/no-atlas-payload ]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
          else
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Replace branch contents atomically
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/project-atlas.tar.gz -C .

      - name: Verify implementation
        if: steps.payload.outputs.present == 'true'
        run: npm run verify

      - name: Commit verified architecture
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          git config user.name 'project-atlas-bot'
          git config user.email 'project-atlas-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No repository changes.'
            exit 0
          fi
          git commit -m 'feat: migrate Project Atlas to live manifest architecture'
          git push origin HEAD:project-atlas
