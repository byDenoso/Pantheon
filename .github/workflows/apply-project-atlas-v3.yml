name: Apply Project Atlas v3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'project-atlas'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Atlas branch
        uses: actions/checkout@v4
        with:
          ref: project-atlas
          fetch-depth: 0

      - name: Decode repository payload
        shell: bash
        run: |
          cat .atlas-bootstrap/chunk-* > /tmp/project-atlas.tar.gz.b64
          base64 -d /tmp/project-atlas.tar.gz.b64 > /tmp/project-atlas.tar.gz
          tar -tzf /tmp/project-atlas.tar.gz >/dev/null

      - name: Replace branch contents atomically
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/project-atlas.tar.gz -C .

      - name: Verify implementation
        run: npm run verify

      - name: Commit verified architecture
        shell: bash
        run: |
          git config user.name 'project-atlas-bot'
          git config user.email 'project-atlas-bot@users.noreply.github.com'
          git add -A
          git commit -m 'feat: migrate Project Atlas to live manifest architecture'
          git push origin HEAD:project-atlas
