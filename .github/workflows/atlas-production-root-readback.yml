name: Atlas Production Root Readback

on:
  workflow_run:
    workflows: ["Atlas Deploy"]
    types: [completed]

permissions:
  contents: read

jobs:
  root-readback:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser probe
        run: |
          npm install --prefix "$RUNNER_TEMP/atlas-root-readback" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/atlas-root-readback/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify production root enters standalone Neural V4
        env:
          PAGE_URL: https://bydenoso.github.io/Pantheon/
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/atlas-root-readback/node_modules/playwright/index.mjs
        run: |
          node --input-type=module <<'NODE'
          const {chromium}=await import(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          let lastError=null;
          try{
            for(let attempt=1;attempt<=6;attempt++){
              const page=await browser.newPage({viewport:{width:1280,height:800}});
              const errors=[];
              page.on('pageerror',error=>errors.push(String(error)));
              try{
                await page.goto(process.env.PAGE_URL,{waitUntil:'networkidle',timeout:30000});
                await page.waitForSelector('.atlas-v3-shell',{timeout:15000});
                await page.waitForSelector('[data-testid="atlas-v3-stage"]',{timeout:15000});
                const finalUrl=new URL(page.url());
                if(finalUrl.origin!=='https://bydenoso.github.io'||finalUrl.pathname!=='/Pantheon/atlas-v3/')throw new Error(`ATLAS_V4_ROOT_WRONG_DESTINATION:${page.url()}`);
                if(await page.locator('.premium-shell').count())throw new Error('ATLAS_V4_ROOT_LEGACY_SHELL_VISIBLE');
                if(errors.length)throw new Error(`ATLAS_V4_ROOT_PAGEERROR:${errors.join(' | ')}`);
                await page.getByText('TOWER_V06').first().waitFor({state:'visible',timeout:10000});
                console.log(`ATLAS_V4_ROOT_REDIRECT_READBACK_OK url=${page.url()}`);
                lastError=null;
                await page.close();
                break;
              }catch(error){
                lastError=error;
                await page.close();
                if(attempt<6)await new Promise(resolve=>setTimeout(resolve,5000));
              }
            }
            if(lastError)throw lastError;
          }finally{
            await browser.close();
          }
          NODE
