name: Atlas Deploy

on:
  push:
    branches: [main]
    paths:
      - 'atlas-control-tower/**'
      - '.github/workflows/atlas-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-control-tower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: atlas-control-tower/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run unit and contract tests
        run: npm test
      - name: Typecheck React frontend
        run: npm run typecheck
      - name: Build production frontend
        run: npm run build
      - name: Check server-side JavaScript syntax
        shell: bash
        run: |
          shopt -s nullglob
          files=(api/*.js *.mjs lib/*.mjs ui/*.mjs webmcp/*.mjs)
          for file in "${files[@]}"; do
            node --check "$file"
          done

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: nexo-one-production
    defaults:
      run:
        working-directory: atlas-control-tower
    env:
      VERCEL_ORG_ID: team_TLkDXqQIHke6IumXh3qzMDcs
      VERCEL_PROJECT_ID: prj_DLQSz5OiIT1HxWMn2i4AgoIv5x8r
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Require production deploy credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured for the release environment."
            exit 1
          fi

      - name: Pull production settings from canonical project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build canonical deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Readback production
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          canonical="https://nexo-atlas-control-tower.vercel.app"

          smoke_frontend(){
            local base="$1"
            for path in / /graphs /graphs/science /graphs/science/D3 /universes /learning /operations /provenance; do
              code=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/page.html -w '%{http_code}' --max-time 30 "$base$path")
              echo "$base$path -> $code"
              [ "$code" = "200" ] || return 1
              grep -q 'id="root"' /tmp/page.html || return 1
            done
            curl -L -sS -H 'Cache-Control: no-cache' --max-time 30 "$base/" -o /tmp/root.html
            grep -Eq 'src="/assets/[^\"]+\.js"' /tmp/root.html || return 1
          }

          smoke_api(){
            local base="$1"
            health=$(curl -L -sS -o /tmp/health.json -w '%{http_code}' --max-time 40 "$base/api/health")
            graph=$(curl -L -sS -o /tmp/graph.json -w '%{http_code}' --max-time 40 "$base/api/graph?focus=system:SCIENCE&depth=1&limit=8")
            ops=$(curl -L -sS -o /tmp/ops.json -w '%{http_code}' --max-time 40 "$base/api/ops")
            learning=$(curl -L -sS -o /tmp/learning.json -w '%{http_code}' --max-time 40 "$base/api/learning")
            runner=$(curl -L -sS -o /tmp/runner.json -w '%{http_code}' --max-time 20 "$base/api/runner?op=health")
            echo "$base API -> health=$health graph=$graph ops=$ops learning=$learning runner=$runner"
            [ "$health" = "200" ] && [ "$graph" = "200" ] && [ "$ops" = "200" ] && [ "$learning" = "200" ] && [ "$runner" = "401" ]
            node -e '
              const fs=require("fs");
              const h=JSON.parse(fs.readFileSync("/tmp/health.json","utf8"));
              if(!h.ok || h.contract!=="v1" || h.dataSource?.freshness!=="LIVE" || h.dataSource?.usedFallback!==false){
                console.error("health contract failed",h);process.exit(1);
              }
              const g=JSON.parse(fs.readFileSync("/tmp/graph.json","utf8"));
              if(!Array.isArray(g.nodes)){console.error("graph contract missing nodes");process.exit(1);}
            '
          }

          smoke_frontend "$DEPLOY_URL"
          smoke_api "$DEPLOY_URL"

          for attempt in $(seq 1 16); do
            echo "canonical readback attempt $attempt"
            if smoke_frontend "$canonical" && smoke_api "$canonical"; then
              echo "Production vNext readback passed."
              exit 0
            fi
            sleep 10
          done

          echo "::error::canonical production alias never converged to the validated vNext deployment"
          exit 1
