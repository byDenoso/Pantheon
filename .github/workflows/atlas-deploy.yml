name: Atlas Deploy

# Explicit production publisher for the existing NEXO Atlas Vercel project.
# The Git integration is not relied upon: pushes to main are tested, built,
# deployed with the Vercel CLI, then read back from the production domain.

on:
  push:
    branches: [main]
    paths:
      - 'atlas-control-tower/**'
      - '.github/workflows/atlas-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-control-tower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit and contract tests
        run: npm test
      - name: Typecheck React frontend
        run: npm run typecheck
      - name: Build production frontend
        run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: atlas-control-tower
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fail early if the deploy credentials are missing
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under Settings → Secrets and variables → Actions."
              exit 1
            fi
          done
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Pull production settings from the existing project
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        id: deploy
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # WRITE → READBACK → VERIFY. Validate the React/Vite shell and the canonical
      # projection API from the production alias. A deploy command succeeding is
      # not enough if the alias still serves an older bundle.
      - name: Readback production
        run: |
          domain="https://nexo-atlas-control-tower.vercel.app"
          fail=0
          for attempt in $(seq 1 20); do
            root=$(curl -s -o /tmp/root.html -w '%{http_code}' --max-time 20 "$domain/" || echo 000)
            contract=$(curl -s -o /tmp/contract.json -w '%{http_code}' --max-time 20 "$domain/api/projection?describe=1" || echo 000)
            health=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 20 "$domain/api/health" || echo 000)
            echo "attempt $attempt: /=$root /api/projection=$contract /api/health=$health"
            if [ "$root" = "200" ] && [ "$contract" = "200" ] && [ "$health" = "200" ]; then
              grep -q 'id="root"' /tmp/root.html || { echo "::error::production root is not the React shell"; exit 1; }
              grep -q '/assets/index-' /tmp/root.html || { echo "::error::production root does not reference the Vite bundle"; exit 1; }
              grep -q 'projection-v1' /tmp/contract.json || { echo "::error::contract payload is not projection-v1"; exit 1; }
              for layer in science execution integrity; do
                state=$(curl -s --max-time 40 "$domain/api/projection?layers=$layer" \
                  | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(j.state+" nodes="+(j.nodes||[]).length)}catch{console.log("UNPARSEABLE")}})')
                echo "  $layer -> $state"
                case "$state" in
                  OK*) : ;;
                  *) echo "::error::layer $layer did not return OK: $state"; fail=1 ;;
                esac
              done
              [ "$fail" = "0" ] && { echo "Production readback passed."; exit 0; }
              exit 1
            fi
            sleep 15
          done
          echo "::error::production alias never served the tested React build"
          exit 1
