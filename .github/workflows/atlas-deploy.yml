name: Atlas Legacy Vercel Deploy

on:
  push:
    branches: [main]
    paths:
      - 'atlas-control-tower/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-vercel-compatibility
  cancel-in-progress: false

jobs:
  compatibility-deploy:
    runs-on: ubuntu-latest
    environment: nexo-one-production
    defaults:
      run:
        working-directory: atlas-control-tower
    env:
      VERCEL_ORG_ID: team_TLkDXqQIHke6IumXh3qzMDcs
      VERCEL_PROJECT_ID: prj_DLQSz5OiIT1HxWMn2i4AgoIv5x8r
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: atlas-control-tower/package-lock.json
      - name: Verify compatibility deploy authorization
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo '::error::Vercel compatibility deployment requires VERCEL_TOKEN.'
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify compatibility build
        run: |
          npm test
          npm run typecheck
          npm run build
      - name: Pull compatibility project settings
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build compatibility deployment
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Deploy compatibility runtime
        id: deploy
        run: |
          set -euo pipefail
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Compatibility deployment: $url"
      - name: Readback compatibility shell
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          code=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/page.html -w '%{http_code}' --max-time 30 "$DEPLOY_URL/")
          [ "$code" = "200" ]
          grep -q 'id="root"' /tmp/page.html
          echo 'VERCEL_COMPATIBILITY_READBACK_OK'
