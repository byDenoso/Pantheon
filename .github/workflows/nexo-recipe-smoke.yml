name: NEXO recipe smoke

# Every recipe with a smoke file runs once on REAL public data. A recipe that crashes or returns the wrong shape
# is caught here, before the Operador dispatches it (the DES parser bug only showed up in a real battery).
on:
  push:
    branches: [main]
    paths:
      - "nexo-one/executor-runtime/recipes/**"
      - "scripts/nexo_recipe_smoke.py"
      - ".github/workflows/nexo-recipe-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: '31 6 * * *'   # daily: public data formats drift too

permissions:
  contents: read
  issues: write

concurrency:
  group: nexo-recipe-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r nexo-one/executor-runtime/requirements.txt
      - name: Run each recipe with its smoke params
        run: python scripts/nexo_recipe_smoke.py run --recipes nexo-one/executor-runtime/recipes --report /tmp/nexo-smoke-report.json
      - name: Open or update an issue when a recipe breaks
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -f /tmp/nexo-smoke-report.json ]; then
            python scripts/nexo_recipe_smoke.py notify --report /tmp/nexo-smoke-report.json --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
