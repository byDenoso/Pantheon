name: NEXO ONE v0.5 one-shot producer cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexo-one-v05-cutover.yml'

permissions:
  contents: read

concurrency:
  group: nexo-one-deployment
  cancel-in-progress: false

jobs:
  cutover:
    if: contains(github.event.head_commit.message, '[nexo-v05-cutover]')
    runs-on: ubuntu-latest
    environment: nexo-one-production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEXO_PRODUCTION_URL: https://nexo-one-two.vercel.app
      ATLAS_PRODUCTION_URL: https://nexo-atlas-control-tower.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nexo-one/package-lock.json

      - name: Verify project identity and build exact source
        run: |
          set -euo pipefail
          test "$VERCEL_PROJECT_ID" = prj_rFoAEgGt4gFNr8DHEOzxY7keS16W
          test "$VERCEL_ORG_ID" = team_TLkDXqQIHke6IumXh3qzMDcs
          test -n "$VERCEL_TOKEN"
          cd nexo-one
          npm ci --no-audit --no-fund
          npm run check
          node scripts/package-release.mjs

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.11.7

      - name: Capture current production deployment
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const team=encodeURIComponent(process.env.VERCEL_ORG_ID);
          const headers={Authorization:`Bearer ${process.env.VERCEL_TOKEN}`};
          const response=await fetch(`https://api.vercel.com/v4/aliases/nexo-one-two.vercel.app?teamId=${team}`,{headers,signal:AbortSignal.timeout(15000)});
          if(!response.ok)throw new Error(`alias read failed: ${response.status}`);
          const body=await response.json();
          const previous=body.deploymentId||body.deployment?.id;
          if(!/^dpl_[A-Za-z0-9]+$/.test(previous||''))throw new Error('previous production deployment unresolved');
          appendFileSync(process.env.GITHUB_ENV,`PREVIOUS_DEPLOYMENT=${previous}\n`);
          console.log(`previous=${previous}`);
          NODE

      - name: Stage exact release as production candidate without moving domain
        run: |
          set -euo pipefail
          STAGED_URL=$(vercel deploy ./nexo-one/release --prod --skip-domain --yes --token "$VERCEL_TOKEN")
          test -n "$STAGED_URL"
          echo "STAGED_URL=$STAGED_URL" >> "$GITHUB_ENV"
          echo "staged=$STAGED_URL"

      - name: Resolve staged identity and require READY production target
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const hostname=new URL(process.env.STAGED_URL).hostname;
          const team=encodeURIComponent(process.env.VERCEL_ORG_ID);
          const headers={Authorization:`Bearer ${process.env.VERCEL_TOKEN}`};
          const response=await fetch(`https://api.vercel.com/v13/deployments/${encodeURIComponent(hostname)}?teamId=${team}`,{headers,signal:AbortSignal.timeout(15000)});
          if(!response.ok)throw new Error(`staged identity read failed: ${response.status}`);
          const deployment=await response.json();
          if(deployment.projectId!==process.env.VERCEL_PROJECT_ID)throw new Error('staged project mismatch');
          if(deployment.readyState!=='READY'||deployment.target!=='production')throw new Error(`staged gate failed: ${deployment.readyState}/${deployment.target}`);
          if(deployment.id===process.env.PREVIOUS_DEPLOYMENT)throw new Error('staged candidate equals current production');
          appendFileSync(process.env.GITHUB_ENV,`STAGED_DEPLOYMENT=${deployment.id}\n`);
          console.log(`staged_id=${deployment.id}`);
          NODE

      - name: Verify staged public and operational boundaries
        env:
          NEXO_VERIFY_URL: ${{ env.STAGED_URL }}
        run: node nexo-one/scripts/verify-release.mjs --operational

      - name: Prove private Atlas bridge exists before promotion
        run: |
          node --input-type=module <<'NODE'
          const headers={};
          if(process.env.VERCEL_AUTOMATION_BYPASS_SECRET)headers['x-vercel-protection-bypass']=process.env.VERCEL_AUTOMATION_BYPASS_SECRET;
          const response=await fetch(new URL('/api/atlas-ssot',process.env.STAGED_URL),{headers,redirect:'error',signal:AbortSignal.timeout(20000)});
          let body={};try{body=await response.json()}catch{}
          if(response.status!==403||body.error!=='ATLAS_SERVICE_REQUIRED')throw new Error(`Atlas bridge gate failed: HTTP ${response.status} ${JSON.stringify(body)}`);
          console.log('atlas-ssot route present and service-auth protected');
          NODE

      - name: Promote candidate and verify end-to-end; rollback on any failure
        run: |
          set -euo pipefail
          rollback() {
            echo "rollback -> $PREVIOUS_DEPLOYMENT"
            vercel rollback "$PREVIOUS_DEPLOYMENT" --yes --token "$VERCEL_TOKEN"
            NEXO_VERIFY_URL="$NEXO_PRODUCTION_URL" node nexo-one/scripts/verify-release.mjs --operational
          }
          fail_with_rollback() {
            local code=$?
            rollback || true
            exit "$code"
          }
          trap fail_with_rollback ERR

          vercel promote "$STAGED_DEPLOYMENT" --yes --token "$VERCEL_TOKEN"
          NEXO_VERIFY_URL="$NEXO_PRODUCTION_URL" node nexo-one/scripts/verify-release.mjs --operational

          node --input-type=module <<'NODE'
          const endpoint=new URL('/api/health?refresh=1',process.env.ATLAS_PRODUCTION_URL);
          const response=await fetch(endpoint,{headers:{Accept:'application/json','Cache-Control':'no-cache'},signal:AbortSignal.timeout(30000)});
          if(!response.ok)throw new Error(`Atlas health HTTP ${response.status}`);
          const health=await response.json();
          const ds=health.dataSource||{};
          if(health.contract!=='drive-ssot-live-v1')throw new Error(`unexpected Atlas contract: ${health.contract}`);
          if(ds.usedFallback!==false||ds.freshness!=='LIVE'||ds.reason!=='LIVE_CANONICAL_SSOT')throw new Error(`Atlas still degraded: ${JSON.stringify(ds)}`);
          if(ds.authority!=='GOOGLE_DRIVE'||ds.sourceFileId!=='1e6s2dKOYVLNsPUguHI85RLVLwJKtlCsQZBJ1BE-UhaY')throw new Error('Atlas authority/source mismatch');
          console.log(JSON.stringify({atlas:'LIVE',sourceModifiedAt:ds.sourceModifiedAt,fingerprint:ds.fingerprint}));
          NODE

          trap - ERR

      - name: Write cutover receipt
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          writeFileSync('nexo-v05-cutover-receipt.json',JSON.stringify({
            sourceSha:process.env.GITHUB_SHA,
            stagedDeployment:process.env.STAGED_DEPLOYMENT||null,
            previousDeployment:process.env.PREVIOUS_DEPLOYMENT||null,
            stagedUrl:process.env.STAGED_URL||null,
            productionUrl:process.env.NEXO_PRODUCTION_URL,
            atlasUrl:process.env.ATLAS_PRODUCTION_URL,
            completedAt:new Date().toISOString()
          },null,2));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexo-v05-cutover-receipt
          path: |
            nexo-v05-cutover-receipt.json
            verification.json
