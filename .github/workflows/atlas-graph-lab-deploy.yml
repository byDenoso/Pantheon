name: Atlas Graph Lab Deploy

on:
  push:
    branches:
      - 'atlas-visual-*'
    paths:
      - 'atlas-control-tower/graph-lab/**'
      - 'atlas-control-tower/test/graph-lab-*.test.mjs'
      - '.github/workflows/atlas-graph-lab-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-graph-lab-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-control-tower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Atlas tests
        run: npm test
      - name: Check graph-lab modules
        run: |
          node --check graph-lab/graph/layout.mjs
          node --check graph-lab/graph/volume-rendering.mjs
          node --check graph-lab/build-cdn-index.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_TLkDXqQIHke6IumXh3qzMDcs
      VERCEL_PROJECT_ID: prj_ZF48d8DZizIkigIhlZS8ag77aS5G
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build commit-pinned standalone index
        shell: bash
        run: |
          set -euo pipefail
          rm -rf graph-lab-deploy
          mkdir graph-lab-deploy
          node atlas-control-tower/graph-lab/build-cdn-index.mjs "$GITHUB_SHA" > graph-lab-deploy/index.html
          grep -q "$GITHUB_SHA" graph-lab-deploy/index.html
          grep -q 'graph/volume-rendering.mjs' graph-lab-deploy/index.html
          if grep -q '"\./' graph-lab-deploy/index.html; then
            echo '::error::standalone index contains unpinned relative assets'
            exit 1
          fi

      - name: Require Vercel credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo '::error::VERCEL_TOKEN is not configured.'
            exit 1
          fi

      - name: Pull canonical Graph Lab project
        working-directory: graph-lab-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production deployment
        working-directory: graph-lab-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy canonical Graph Lab
        id: deploy
        working-directory: graph-lab-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Read back canonical alias
        shell: bash
        run: |
          set -euo pipefail
          domain='https://nexo-atlas-graph-lab.vercel.app/'
          for attempt in $(seq 1 18); do
            code=$(curl -sS -L -o /tmp/graph-lab.html -w '%{http_code}' --max-time 20 "$domain" || echo 000)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = '200' ] && grep -q 'ATLAS GRAPH LAB · NEXO' /tmp/graph-lab.html && grep -q "$GITHUB_SHA" /tmp/graph-lab.html && grep -q 'graph/volume-rendering.mjs' /tmp/graph-lab.html; then
              echo 'Canonical Graph Lab readback passed.'
              exit 0
            fi
            sleep 5
          done
          echo '::error::canonical Graph Lab alias did not converge to the verified commit.'
          exit 1
