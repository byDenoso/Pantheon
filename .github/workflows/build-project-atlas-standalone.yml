name: Build Project Atlas Standalone

on:
  push:
    branches: [project-atlas-standalone]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-chunks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report source chunks
        shell: pwsh
        run: |
          $files = Get-ChildItem bootstrap/chunks/chunk-*.txt | Sort-Object Name
          foreach ($file in $files) {
            $content = (Get-Content $file.FullName -Raw).Trim()
            Write-Host "$($file.Name) length=$($content.Length)"
          }
          $encoded = (($files | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join '')
          Write-Host "total=$($encoded.Length) count=$($files.Count)"
          if ($files.Count -ne 4 -or $encoded.Length -ne 55776) { throw 'Chunk set incomplete' }

