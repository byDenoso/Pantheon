name: Atlas Pages Fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'atlas-control-tower/**'
      - '.github/workflows/atlas-pages-fallback.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages-fallback
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: atlas-control-tower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: atlas-control-tower/package-lock.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci --no-audit --no-fund
      - name: Verify fallback build
        run: |
          npm test
          npm run typecheck
      - name: Build Pages frontend
        env:
          VITE_NEXO_API_BASE_URL: https://nexo-atlas-control-tower.vercel.app/api
        run: |
          npm run build -- --base=/Pantheon/
          cp dist/index.html dist/404.html
      - name: Browser bootstrap smoke
        run: |
          rm -rf /tmp/atlas-pages-smoke
          mkdir -p /tmp/atlas-pages-smoke/Pantheon
          cp -a dist/. /tmp/atlas-pages-smoke/Pantheon/
          python3 -m http.server 4174 --directory /tmp/atlas-pages-smoke >/tmp/atlas-pages-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:4174/Pantheon/ >/dev/null && break
            sleep 1
          done
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [ -n "$browser" ]
          timeout 30s "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=10000 \
            --dump-dom \
            http://127.0.0.1:4174/Pantheon/ \
            >/tmp/atlas-pages-dom.html 2>/tmp/atlas-pages-browser.log || {
              cat /tmp/atlas-pages-browser.log
              exit 1
            }
          grep -q 'class="atlas-app"' /tmp/atlas-pages-dom.html
          if grep -q 'atlas-bootstrap-error' /tmp/atlas-pages-dom.html; then
            cat /tmp/atlas-pages-dom.html
            exit 1
          fi
          echo 'PAGES_BROWSER_BOOTSTRAP_OK'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: atlas-control-tower/dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Readback Pages and canonical API
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          page=''
          for attempt in 1 2 3 4 5 6; do
            page="$(curl -fsSL "$PAGE_URL" 2>/dev/null || true)"
            [ -n "$page" ] && break
            sleep 5
          done
          [ -n "$page" ]
          printf '%s' "$page" | grep -q '/Pantheon/assets/index-'
          health="$(curl -fsSL -H 'Origin: https://bydenoso.github.io' https://nexo-atlas-control-tower.vercel.app/api/health)"
          HEALTH="$health" node --input-type=module -e "const h=JSON.parse(process.env.HEALTH); if(!h.ok) process.exit(1); const f=String(h.dataSource?.freshness||'').toUpperCase(); if(!['LIVE','SNAPSHOT'].includes(f)) process.exit(2); console.log('PAGES_HEALTH_READBACK_OK freshness='+f);"
          graph="$(curl -fsSL -H 'Origin: https://bydenoso.github.io' 'https://nexo-atlas-control-tower.vercel.app/api/graph?focus=system%3ANEXO&mode=children&depth=1')"
          GRAPH="$graph" node --input-type=module -e "const g=JSON.parse(process.env.GRAPH); if(!Array.isArray(g.nodes)||!g.nodes.some(n=>n?.id==='system:NEXO')) process.exit(3); if(String(g.focus||'')!=='system:NEXO') process.exit(4); console.log('PAGES_GRAPH_READBACK_OK nodes='+g.nodes.length);"
