name: Atlas Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'atlas-control-tower/**'
      - '.github/workflows/atlas-pages-fallback.yml'
      - '.github/workflows/atlas-deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: atlas-control-tower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: atlas-control-tower/package-lock.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci --no-audit --no-fund
      - name: Verify production build
        run: |
          npm test
          npm run typecheck
      - name: Build Pages frontend and static state
        run: |
          npm run state:build
          npm run build -- --base=/Pantheon/
          cp dist/index.html dist/404.html
          test -f dist/data/current/manifest.json
          test -f dist/data/v3/current/manifest.json
          test -f dist/atlas-v3/index.html
      - name: Install isolated Pages browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/atlas-pages-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/atlas-pages-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser bootstrap smoke
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/atlas-pages-browser/node_modules/playwright/index.mjs
        run: |
          rm -rf /tmp/atlas-pages-smoke
          mkdir -p /tmp/atlas-pages-smoke/Pantheon
          cp -a dist/. /tmp/atlas-pages-smoke/Pantheon/
          python3 -m http.server 4174 --directory /tmp/atlas-pages-smoke >/tmp/atlas-pages-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/Pantheon/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/atlas-pages-http.log
            exit 1
          fi
          node --input-type=module <<'NODE'
          const {chromium}=await import(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:800}});
          const errors=[];
          const retired=[];
          const dataRequests=[];
          const apiRequests=[];
          page.on('pageerror',error=>errors.push(String(error)));
          page.on('request',request=>{
            const url=new URL(request.url());
            if(url.pathname.includes('/Pantheon/data/'))dataRequests.push(url.pathname);
            if(url.origin==='http://127.0.0.1:4174'&&url.pathname.startsWith('/api/'))apiRequests.push(url.pathname);
          });
          await page.route('**/*',route=>{
            const url=route.request().url();
            if(/vercel\.app|neon|supabase|firebase/i.test(url)){
              retired.push(url);
              return route.abort();
            }
            return route.continue();
          });
          const manifestResponse=page.waitForResponse(response=>response.url().includes('/Pantheon/data/current/manifest.json')&&response.ok(),{timeout:15000});
          await page.goto('http://127.0.0.1:4174/Pantheon/',{waitUntil:'domcontentloaded',timeout:30000});
          await manifestResponse;
          if(await page.locator('.atlas-bootstrap-error').count())throw new Error('ATLAS_BOOTSTRAP_ERROR_VISIBLE_ON_LANDING');
          await page.getByRole('link',{name:'Mapa'}).click();
          await page.waitForSelector('.atlas-app',{timeout:15000});
          await page.waitForSelector('.premium-shell',{timeout:15000});
          await page.waitForSelector('.atlas-context-bar',{timeout:15000});
          await page.waitForSelector('.atlas-command-trigger',{timeout:15000});
          await page.waitForSelector('.graph-renderer-canvas canvas',{timeout:15000});
          if(await page.locator('.atlas-bootstrap-error').count())throw new Error('ATLAS_BOOTSTRAP_ERROR_VISIBLE');
          await page.getByRole('link',{name:'OBSERVATÓRIO'}).click();
          await page.waitForSelector('.graph-renderer-canvas canvas',{state:'detached',timeout:10000});
          await page.getByRole('link',{name:'GRAFOS'}).click();
          await page.waitForSelector('.graph-renderer-canvas canvas',{timeout:15000});
          await page.waitForTimeout(250);
          if(await page.locator('.atlas-bootstrap-error').count())throw new Error('ATLAS_BOOTSTRAP_ERROR_AFTER_GRAPH_REMOUNT');
          if(errors.length)throw new Error(`ATLAS_PAGEERROR:${errors.join(' | ')}`);
          if(!dataRequests.some(path=>path.endsWith('/data/current/manifest.json')))throw new Error(`STATIC_MANIFEST_NOT_REQUESTED:${dataRequests.join(' | ')}`);
          if(apiRequests.length)throw new Error(`LEGACY_API_REQUEST:${apiRequests.join(' | ')}`);
          if(retired.length)throw new Error(`RETIRED_RUNTIME_REQUEST:${retired.join(' | ')}`);
          console.log('GRAPH_LIFECYCLE_SMOKE_OK');
          console.log('PAGES_SOVEREIGN_BOOTSTRAP_OK');

          const v3=await browser.newPage({viewport:{width:1280,height:800}});
          await v3.goto('http://127.0.0.1:4174/Pantheon/atlas-v3/',{waitUntil:'networkidle',timeout:30000});
          await v3.getByText('NEURAL V3').waitFor({state:'visible',timeout:10000});
          await v3.getByText('Um universo. Uma autoridade. Várias camadas.').waitFor({state:'visible',timeout:10000});
          if(await v3.getByText('TOWER_V06').count()===0)throw new Error('ATLAS_V3_AUTHORITY_NOT_VISIBLE');
          if(await v3.getByText('LEARNING').count()===0)throw new Error('ATLAS_V3_LEARNING_LAYER_MISSING');
          await browser.close();
          console.log('PAGES_CANONICAL_BOOTSTRAP_OK');
          console.log('ATLAS_V3_BROWSER_SMOKE_OK');
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: atlas-control-tower/dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Readback Pages static runtime (canonical)
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          page=''
          for attempt in 1 2 3 4 5 6; do
            page="$(curl -fsSL "$PAGE_URL" 2>/dev/null || true)"
            [ -n "$page" ] && break
            sleep 5
          done
          [ -n "$page" ]
          printf '%s' "$page" | grep -q '/Pantheon/assets/index-'
          if printf '%s' "$page" | grep -Eqi 'nexo-atlas-control-tower\.vercel\.app|neon'; then
            echo '::error::Published Pages shell contains a retired runtime reference'
            exit 1
          fi

          curl -fsSL "$base/data/current/manifest.json" -o /tmp/nexo-manifest.json
          snapshot_path="$(node -e "const m=require('/tmp/nexo-manifest.json'); if(m.contract!=='nexo-static-runtime-v1'||!/^sha256:[a-f0-9]{64}$/i.test(m.fingerprint)||!m.artifacts?.['science/D7.json']) process.exit(1); process.stdout.write(m.snapshotPath)")"
          fingerprint="$(node -e "const m=require('/tmp/nexo-manifest.json'); process.stdout.write(m.fingerprint)")"
          curl -fsSL "$base/data/$snapshot_path/science/D7.json" -o /tmp/nexo-d7.json
          curl -fsSL "$base/data/$snapshot_path/health.json" -o /tmp/nexo-health.json
          node <<'NODE'
          const manifest=require('/tmp/nexo-manifest.json');
          const d7=require('/tmp/nexo-d7.json');
          const health=require('/tmp/nexo-health.json');
          if(!Array.isArray(d7.campaigns)||!d7.campaigns.some(campaign=>campaign.id==='CAMP-CMB-ANOMALIES'))throw new Error('D7_CAMPAIGN_SENTINEL_MISSING');
          if(Array.isArray(d7.tests))throw new Error('D7_PUBLIC_TESTS_PRESENT');
          if(health.contract!=='nexo-static-runtime-v1'||health.runtime!=='STATIC_LOCAL')throw new Error('STATIC_HEALTH_INVALID');
          if(manifest.source!=='GOOGLE_DRIVE'||manifest.codeAuthority!=='GITHUB')throw new Error('LEGACY_STATIC_TRANSPORT_INVALID');
          NODE

          curl -fsSL "$base/atlas-v3/" -o /tmp/atlas-v3.html
          grep -q 'NEURAL V3' /tmp/atlas-v3.html
          grep -q 'Um universo. Uma autoridade. Várias camadas.' /tmp/atlas-v3.html
          curl -fsSL "$base/data/v3/current/manifest.json" -o /tmp/atlas-v3-manifest.json
          v3_snapshot_path="$(node -e "const m=require('/tmp/atlas-v3-manifest.json'); if(m.contractVersion!=='ATLAS_PROJECTION_V3'||m.authority!=='TOWER_V06'||m.projectionOnly!==true||!/^sha256:[a-f0-9]{64}$/i.test(m.fingerprint)||!m.snapshotPath) process.exit(1); process.stdout.write(m.snapshotPath)")"
          v3_fingerprint="$(node -e "const m=require('/tmp/atlas-v3-manifest.json'); process.stdout.write(m.fingerprint)")"
          curl -fsSL "$base/data/v3/current/$v3_snapshot_path" -o /tmp/atlas-v3-snapshot.json
          node <<'NODE'
          const snapshot=require('/tmp/atlas-v3-snapshot.json');
          if(snapshot.manifest?.authority!=='TOWER_V06'||snapshot.manifest?.projectionOnly!==true)throw new Error('ATLAS_V3_AUTHORITY_INVALID');
          if(!Array.isArray(snapshot.graph?.root?.nodes)||snapshot.graph.root.nodes.length<1)throw new Error('ATLAS_V3_GRAPH_EMPTY');
          if(!Array.isArray(snapshot.learning?.filaments)||!snapshot.learning.filaments.some(f=>f.id==='META::INTERDOMAIN::COSMO-OLYMPUS-SELECTION-AWARE-CHANGE-001'))throw new Error('ATLAS_V3_FILAMENT_SENTINEL_MISSING');
          if(!Array.isArray(snapshot.operations?.works)||snapshot.operations.works.length<1)throw new Error('ATLAS_V3_OPERATIONS_EMPTY');
          const raw=JSON.stringify(snapshot);
          if(/eligible_cohort_manifest|full_validation|participant_manifest/i.test(raw))throw new Error('ATLAS_V3_PRIVATE_STRUCTURE_LEAK');
          NODE
          echo "PAGES_STATIC_STATE_READBACK_OK fingerprint=$fingerprint"
          echo "ATLAS_V3_READBACK_OK fingerprint=$v3_fingerprint url=$base/atlas-v3/"
