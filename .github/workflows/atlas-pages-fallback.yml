name: Atlas Pages Fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'atlas-control-tower/**'
      - '.github/workflows/atlas-pages-fallback.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages-fallback
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: atlas-control-tower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: atlas-control-tower/package-lock.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci --no-audit --no-fund
      - name: Verify fallback build
        run: |
          npm test
          npm run typecheck
      - name: Build Pages frontend
        run: |
          npm run build -- --base=/Pantheon/
          cp dist/index.html dist/404.html
      - name: Install isolated Pages browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/atlas-pages-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/atlas-pages-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser bootstrap smoke
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/atlas-pages-browser/node_modules/playwright/index.mjs
        run: |
          rm -rf /tmp/atlas-pages-smoke
          mkdir -p /tmp/atlas-pages-smoke/Pantheon
          cp -a dist/. /tmp/atlas-pages-smoke/Pantheon/
          python3 -m http.server 4174 --directory /tmp/atlas-pages-smoke >/tmp/atlas-pages-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/Pantheon/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/atlas-pages-http.log
            exit 1
          fi
          node --input-type=module <<'NODE'
          const {chromium}=await import(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:800}});
          const errors=[];
          const retired=[];
          page.on('pageerror',error=>errors.push(String(error)));
          await page.route('**/*',route=>{
            const url=route.request().url();
            if(/vercel\.app|neon|supabase|firebase/i.test(url)){
              retired.push(url);
              return route.abort();
            }
            return route.continue();
          });
          await page.goto('http://127.0.0.1:4174/Pantheon/',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForSelector('.atlas-app',{timeout:15000});
          await page.waitForSelector('.premium-shell',{timeout:15000});
          await page.waitForSelector('.atlas-context-bar',{timeout:15000});
          await page.waitForSelector('.atlas-command-trigger',{timeout:15000});
          const bootstrapError=await page.locator('.atlas-bootstrap-error').count();
          if(bootstrapError)throw new Error('ATLAS_BOOTSTRAP_ERROR_VISIBLE');
          if(retired.length)throw new Error(`RETIRED_RUNTIME_REQUEST:${retired.join(' | ')}`);
          if(errors.length)throw new Error(`ATLAS_PAGEERROR:${errors.join(' | ')}`);
          await browser.close();
          console.log('PAGES_SOVEREIGN_BOOTSTRAP_OK');
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: atlas-control-tower/dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Readback Pages static runtime
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          page=''
          for attempt in 1 2 3 4 5 6; do
            page="$(curl -fsSL "$PAGE_URL" 2>/dev/null || true)"
            [ -n "$page" ] && break
            sleep 5
          done
          [ -n "$page" ]
          printf '%s' "$page" | grep -q '/Pantheon/assets/index-'
          if printf '%s' "$page" | grep -Eqi 'nexo-atlas-control-tower\.vercel\.app|neon'; then
            echo '::error::Published Pages shell contains a retired runtime reference'
            exit 1
          fi
          echo 'PAGES_STATIC_READBACK_OK'
