name: Atlas Pages Fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'atlas-control-tower/**'
      - '.github/workflows/atlas-pages-fallback.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages-fallback
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: atlas-control-tower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: atlas-control-tower/package-lock.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci --no-audit --no-fund
      - name: Verify fallback build
        run: |
          npm test
          npm run typecheck
      - name: Build Pages frontend
        env:
          VITE_NEXO_API_BASE_URL: https://nexo-atlas-control-tower.vercel.app/api
        run: |
          npm run build -- --base=/Pantheon/
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: atlas-control-tower/dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
