name: NEXO ONE GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'nexo-one/**'
      - '.github/workflows/nexo-one-pages.yml'
  repository_dispatch:
    types: [nexo-public-projection-updated]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nexo-one-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      projection_fingerprint: ${{ steps.projection.outputs.projection_fingerprint }}
      tower_commit: ${{ steps.projection.outputs.tower_commit }}
      event_cursor: ${{ steps.projection.outputs.event_cursor }}
      deploy_needed: ${{ steps.deploy_needed.outputs.deploy_needed }}
    steps:
      - name: Checkout Pantheon
        uses: actions/checkout@v4

      - name: Require read-only public-export credential
        shell: bash
        env:
          NEXO_VAULT_READ_TOKEN: ${{ secrets.NEXO_VAULT_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NEXO_VAULT_READ_TOKEN}" ]; then
            echo "::error::NEXO_VAULT_READ_TOKEN is required for the read-only Git export mirror."
            exit 1
          fi

      - name: Checkout Drive-derived public export mirror
        uses: actions/checkout@v4
        with:
          repository: byDenoso/NEXO-Obsidian-Vault
          ref: main
          token: ${{ secrets.NEXO_VAULT_READ_TOKEN }}
          path: _vault
          persist-credentials: false
          fetch-depth: 0

      - name: Verify Drive-primary export marker
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.manifest.source_storage == "GOOGLE_DRIVE_PRIVATE" and (.manifest.source_snapshot_id|length)>0 and (.manifest.source_state_fingerprint|startswith("sha256:"))'             _vault/TOWER_V06/projections/public/projection.json >/dev/null
          jq -e '.source_storage == "GOOGLE_DRIVE_PRIVATE" and (.source_snapshot_id|length)>0 and (.source_state_fingerprint|startswith("sha256:"))'             _vault/TOWER_V06/projections/public/manifest.json >/dev/null

      - name: Resolve projection verifier revision from export

        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          rev="$(jq -er '.authority_declaration.runtime_revision' _vault/TOWER_V06/projections/public/projection.json)"
          case "${rev}" in
            byDenoso/TCC@*) ;;
            *) echo "::error::export runtime_revision must reference byDenoso/TCC, got ${rev}"; exit 1 ;;
          esac
          sha="${rev#byDenoso/TCC@}"
          printf '%s' "${sha}" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "::error::export runtime_revision must pin a full 40-hex TCC SHA, got ${sha}"
            exit 1
          }
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout projection verifier
        uses: actions/checkout@v4
        with:
          repository: byDenoso/TCC
          ref: ${{ steps.runtime.outputs.sha }}
          path: _tcc
          persist-credentials: false

      - name: Verify sanctioned Tower projection
        id: projection
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.runtime.outputs.sha }}"
          actual="$(git -C _tcc rev-parse HEAD)"
          [ "${actual}" = "${expected}" ] || {
            echo "::error::TCC verifier checkout ${actual} differs from CONTROL.runtime_revision ${expected}"
            exit 1
          }

          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("_tcc").resolve()))
          from runtime.nexo_agent_api.public_projection import verify_projection

          projection_path = Path("_vault/TOWER_V06/projections/public/projection.json")
          manifest_path = Path("_vault/TOWER_V06/projections/public/manifest.json")
          projection = json.loads(projection_path.read_text(encoding="utf-8"))
          external_manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest = projection.get("manifest") or {}

          ok, detail = verify_projection(projection)
          if not ok:
              raise SystemExit(f"sanctioned projection verification failed: {detail}")
          if external_manifest != manifest:
              raise SystemExit("manifest.json differs from projection.manifest")
          if manifest.get("authority") != "TOWER_V06":
              raise SystemExit("authority != TOWER_V06")
          if manifest.get("projection_only") is not True:
              raise SystemExit("projection_only != true")
          if manifest.get("writeback") != "FORBIDDEN":
              raise SystemExit("writeback != FORBIDDEN")
          tower_commit = str(manifest.get("tower_commit") or "")
          event_cursor = str(manifest.get("event_cursor") or "")
          fingerprint = str(manifest.get("projection_fingerprint") or "")
          source_storage = str(manifest.get("source_storage") or "")
          source_snapshot_id = str(manifest.get("source_snapshot_id") or "")
          source_state_fingerprint = str(manifest.get("source_state_fingerprint") or "")
          if source_storage != "GOOGLE_DRIVE_PRIVATE":
              raise SystemExit("public export source_storage is not GOOGLE_DRIVE_PRIVATE")
          if not source_snapshot_id:
              raise SystemExit("public export source_snapshot_id missing")
          if not source_state_fingerprint.startswith("sha256:"):
              raise SystemExit("public export source_state_fingerprint invalid")
          if not event_cursor:
              raise SystemExit("event_cursor missing")
          if not fingerprint.startswith("sha256:") or len(fingerprint) != 71:
              raise SystemExit("projection_fingerprint invalid")
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"tower_commit={tower_commit}\n")
              handle.write(f"event_cursor={event_cursor}\n")
              handle.write(f"projection_fingerprint={fingerprint}\n")
              handle.write(f"source_snapshot_id={source_snapshot_id}\n")
              handle.write(f"source_state_fingerprint={source_state_fingerprint}\n")
          print(f"TOWER_PROJECTION_VERIFIED commit={tower_commit} cursor={event_cursor} fingerprint={fingerprint}")
          PY

      - name: Decide whether scheduled deploy is needed
        id: deploy_needed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_SHA: ${{ github.sha }}
          EXPECTED_FINGERPRINT: ${{ steps.projection.outputs.projection_fingerprint }}
          PAGE_BASE: https://bydenoso.github.io/Pantheon
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "schedule" ]; then
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          manifest=/tmp/current-pages-manifest.json
          meta=/tmp/current-pages-build-meta.json
          if curl -fsSL --retry 1 --connect-timeout 5 "${PAGE_BASE}/tower-projection/manifest.json" -o "${manifest}" &&
             curl -fsSL --retry 1 --connect-timeout 5 "${PAGE_BASE}/build-meta.json" -o "${meta}"; then
            current_fingerprint="$(jq -r '.projection_fingerprint // empty' "${manifest}")"
            current_sha="$(jq -r '.pantheon_commit // empty' "${meta}")"
            if [ "${current_fingerprint}" = "${EXPECTED_FINGERPRINT}" ] && [ "${current_sha}" = "${CURRENT_SHA}" ]; then
              echo "deploy_needed=false" >> "$GITHUB_OUTPUT"
              echo "PAGES_NO_OP projection and Pantheon commit already published"
              exit 0
            fi
          fi
          echo "deploy_needed=true" >> "$GITHUB_OUTPUT"

      - name: Stage Drive-derived public export
        if: steps.deploy_needed.outputs.deploy_needed == 'true'
        shell: bash
        env:
          TOWER_COMMIT: ${{ steps.projection.outputs.tower_commit }}
        run: |
          set -euo pipefail
          rm -rf nexo-one/data/tower-public nexo-one/data/mcp-source
          mkdir -p nexo-one/data/tower-public nexo-one/data/mcp-source
          cp _vault/TOWER_V06/projections/public/projection.json nexo-one/data/tower-public/projection.json
          cp _vault/TOWER_V06/projections/public/manifest.json nexo-one/data/tower-public/manifest.json
          if compgen -G "_vault/TOWER_V06/entities/interdomain/*.json" > /dev/null; then
            jq -s '.' _vault/TOWER_V06/entities/interdomain/*.json > nexo-one/data/tower-public/interdomain.json
          else
            printf '[]\n' > nexo-one/data/tower-public/interdomain.json
          fi
          if [ -s "_vault/TOWER_V06/runtime/artifacts/meta_learning/METALEARNING_CURRENT.json" ]; then
            cp _vault/TOWER_V06/runtime/artifacts/meta_learning/METALEARNING_CURRENT.json nexo-one/data/tower-public/learning.json
          else
            printf '{}\n' > nexo-one/data/tower-public/learning.json
          fi
          if [ -s "_vault/TOWER_V06/contracts/PEER_DETECTION_BATTERY_V1.json" ]; then
            cp _vault/TOWER_V06/contracts/PEER_DETECTION_BATTERY_V1.json nexo-one/data/tower-public/peer-detection-battery.json
          else
            printf '{}\n' > nexo-one/data/tower-public/peer-detection-battery.json
          fi

          # MCP Atlas is also a read-only presentation surface. Stage its inputs
          # from the same sanctioned export mirror instead of relying on local files.
          cp _vault/TOWER_V06/manifests/capabilities.json nexo-one/data/mcp-source/capabilities.json
          cp _vault/services/nexo-api/app/mcp_server.py nexo-one/data/mcp-source/mcp_server.py
          cp _vault/services/nexo-api/app/remote_mcp.py nexo-one/data/mcp-source/remote_mcp.py
          jq -n --arg tower_commit "${TOWER_COMMIT}" '{tower_commit:$tower_commit}' > nexo-one/data/mcp-source/source.json

      - name: Setup Node
        if: steps.deploy_needed.outputs.deploy_needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nexo-one/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        if: steps.deploy_needed.outputs.deploy_needed == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        if: steps.deploy_needed.outputs.deploy_needed == 'true'
        working-directory: nexo-one
        run: npm ci --no-audit --no-fund

      - name: Build static NEXO ONE
        if: steps.deploy_needed.outputs.deploy_needed == 'true'
        working-directory: nexo-one
        env:
          GITHUB_PAGES: '1'
          VITE_SYSTEM_ENDPOINT: ${{ steps.pages.outputs.base_path }}/system.json
          VITE_WORLD_ENDPOINT: ./world-public.ndjson
          VITE_GALAXY_ENDPOINT: ./galaxy/latest.json
          VITE_NEXO_AUTH_BRIDGE_URL: ${{ vars.VITE_NEXO_AUTH_BRIDGE_URL }}
          VITE_PRIVATE_COCKPIT_URL: https://nexo-one-two.vercel.app
        run: |
          set -euo pipefail
          npm run typecheck
          node --test test/atlas3d-metro-production.test.mjs test/pages.test.mjs
          npm run build
          test -s dist/atlas3d/index.html
          expected_system_endpoint="${{ steps.pages.outputs.base_path }}/system.json"
          grep -R -Fq "${expected_system_endpoint}" dist/assets || {
            echo "::error::GitHub Pages bundle does not contain the repository-root SystemState endpoint"
            exit 1
          }

      - name: Hydrate previous valid galaxy history
        if: steps.deploy_needed.outputs.deploy_needed == 'true'
        working-directory: nexo-one
        shell: bash
        env:
          GALAXY_PUBLIC_BASE: https://bydenoso.github.io/Pantheon/galaxy
        run: |
          set -euo pipefail
          mkdir -p dist/galaxy/snapshots
          base="${GALAXY_PUBLIC_BASE%/}"
          curl -fsSL --retry 2 --connect-timeout 5 "${base}/latest.json" -o dist/galaxy/previous.json || rm -f dist/galaxy/previous.json
          if curl -fsSL --retry 2 --connect-timeout 5 "${base}/index.json" -o /tmp/galaxy-index.json; then
            node <<'NODE' >/tmp/galaxy-history-ids.txt
          const fs=require('fs');
          let index;
          try{index=JSON.parse(fs.readFileSync('/tmp/galaxy-index.json','utf8'));}catch{process.exit(0);}
          if(index?.contract!=='NEXO_ONE_GALAXY_INDEX_V1'||!Array.isArray(index.snapshots))process.exit(0);
          const ids=[];
          for(const item of index.snapshots.slice(0,167)){
            const id=String(item?.snapshot_id||'');
            if(/^galaxy-[0-9a-z-]+$/i.test(id)&&!ids.includes(id))ids.push(id);
          }
          process.stdout.write(ids.join('\n'));
          NODE
            export base
            xargs -r -P 8 -I '{}' bash -c '
              id="$1"
              curl -fsSL --retry 1 --connect-timeout 4 "$base/snapshots/$id.json" -o "dist/galaxy/snapshots/$id.json" ||
                rm -f "dist/galaxy/snapshots/$id.json"
            ' _ '{}' </tmp/galaxy-history-ids.txt
          fi

      - name: Compile presentation from sanctioned Tower projection
        if: steps.deploy_needed.outputs.deploy_needed == 'true'
        working-directory: nexo-one
        env:
          NEXO_PUBLIC_PROJECTION: data/tower-public/projection.json
          NEXO_PUBLIC_PROJECTION_MANIFEST: data/tower-public/manifest.json
          NEXO_PUBLIC_INTERDOMAIN: data/tower-public/interdomain.json
          NEXO_PUBLIC_LEARNING: data/tower-public/learning.json
          NEXO_PEER_DETECTION_BATTERY: data/tower-public/peer-detection-battery.json
          NEXO_GALAXY_PREVIOUS: dist/galaxy/previous.json
          NEXO_GALAXY_RETENTION: '168'
          PANTHEON_COMMIT: ${{ github.sha }}
          PROJECTION_FINGERPRINT: ${{ steps.projection.outputs.projection_fingerprint }}
        run: |
          set -euo pipefail
          node scripts/build-pages-system.mjs
          node scripts/build-mcp-topology.mjs
          node scripts/build-galaxy-snapshot.mjs
          test -s dist/system.json
          test -s dist/galaxy/latest.json
          test -s dist/galaxy/index.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('dist/galaxy/latest.json'));const i=JSON.parse(fs.readFileSync('dist/galaxy/index.json'));if(i.latest_snapshot_id!==x.snapshot_id)throw new Error('GALAXY_INDEX_LATEST_MISMATCH');if(!fs.existsSync('dist/galaxy/snapshots/'+x.snapshot_id+'.json'))throw new Error('GALAXY_VERSIONED_SNAPSHOT_MISSING')"
          rm -f dist/galaxy/previous.json
          test -s dist/mcp/index.html
          test -s dist/mcp/topology.json
          test -s dist/world-public.ndjson
          test -s dist/tower-projection/projection.json
          test -s dist/tower-projection/manifest.json
          jq -n --arg pantheon_commit "${PANTHEON_COMMIT}" --arg projection_fingerprint "${PROJECTION_FINGERPRINT}" \
            '{contract:"NEXO_ONE_BUILD_META_V1",pantheon_commit:$pantheon_commit,projection_fingerprint:$projection_fingerprint}' > dist/build-meta.json
          test -s dist/build-meta.json
          touch dist/.nojekyll
          if grep -R -Eqi 'truthgraph-projection|nexo-drive-projection' dist/system.json dist/world-public.ndjson dist/tower-projection; then
            echo "::error::legacy truthgraph/drive-projection source leaked into Pages artifact"
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        if: steps.deploy_needed.outputs.deploy_needed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: nexo-one/dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy_needed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Read back sanctioned projection
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_FINGERPRINT: ${{ needs.build.outputs.projection_fingerprint }}
          EXPECTED_TOWER_COMMIT: ${{ needs.build.outputs.tower_commit }}
          EXPECTED_EVENT_CURSOR: ${{ needs.build.outputs.event_cursor }}
          EXPECTED_PANTHEON_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "${base}/tower-projection/manifest.json" -o /tmp/manifest.json; then break; fi
            sleep 5
          done
          curl -fsSL "${base}/tower-projection/projection.json" -o /tmp/projection.json
          curl -fsSL "${base}/system.json" -o /tmp/system.json
          curl -fsSL "${base}/atlas3d/" -o /tmp/atlas3d.html
          grep -Fq '<title>NEXO Atlas 3D</title>' /tmp/atlas3d.html
          grep -Fq '<div id="root"></div>' /tmp/atlas3d.html

          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [ -n "${chrome_bin}" ] || {
            echo "::error::A headless Chromium/Chrome binary is required for Atlas visual readback"
            exit 1
          }
          "${chrome_bin}" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars \
            --window-size=1440,900 --virtual-time-budget=12000 --dump-dom "${base}/atlas3d/" \
            > /tmp/atlas3d-dom.html

          echo "ATLAS3D_DOM_DIAGNOSTICS_BEGIN"
          grep -oE 'data-atlas-[a-z-]+="[^"]*"' /tmp/atlas3d-dom.html | head -28 || true
          grep -oE 'data-g6-(ready|node-count|label-visible|label-hidden|label-collisions|label-dom-collisions|label-ui-overlaps|label-zoom|label-policy|max-siblings|learning-edges)="[^"]*"' /tmp/atlas3d-dom.html | head -24 || true
          grep -oE 'class="atlas-render-error"[^<]*|G6 não carregou[^<]*|Atlas 3D indisponível[^<]*' /tmp/atlas3d-dom.html | head -10 || true
          echo "ATLAS3D_DOM_DIAGNOSTICS_END"

          "${chrome_bin}" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars \
            --window-size=1440,900 --virtual-time-budget=8000 \
            --screenshot=/tmp/atlas3d-readback.png "${base}/atlas3d/" >/dev/null 2>&1 || true
          test -s /tmp/atlas3d-readback.png || echo "::warning::Atlas screenshot was not produced"

          grep -Fq 'data-atlas-renderer="metro-cluster"' /tmp/atlas3d-dom.html
          grep -Fq 'data-atlas-ready="true"' /tmp/atlas3d-dom.html
          grep -Fq 'data-g6-ready="true"' /tmp/atlas3d-dom.html
          grep -Fq 'data-g6-label-collisions="0"' /tmp/atlas3d-dom.html
          grep -Fq 'data-g6-label-dom-collisions="0"' /tmp/atlas3d-dom.html
          grep -Fq 'data-g6-label-ui-overlaps="0"' /tmp/atlas3d-dom.html
          grep -Fq 'data-g6-label-policy="viewport-adaptive-v2"' /tmp/atlas3d-dom.html
          learning_edges="$(sed -n 's/.*data-g6-learning-edges="\([0-9][0-9]*\)".*/\1/p' /tmp/atlas3d-dom.html | head -1)"
          peer_learning="$(sed -n 's/.*data-atlas-peer-learning-links="\([0-9][0-9]*\)".*/\1/p' /tmp/atlas3d-dom.html | head -1)"
          peer_artifacts="$(sed -n 's/.*data-atlas-peer-artifact-nodes="\([0-9][0-9]*\)".*/\1/p' /tmp/atlas3d-dom.html | head -1)"
          [ -n "${learning_edges}" ] && [ "${learning_edges}" -ge 8 ] || {
            echo "::error::Atlas rendered only ${learning_edges:-0} Learning filaments; semantic Learning projection is underrepresented"
            exit 1
          }
          [ -n "${peer_learning}" ] && [ "${peer_learning}" -ge 8 ] || {
            echo "::error::Peer Detection semantic bundles missing: ${peer_learning:-0}"
            exit 1
          }
          [ "${peer_artifacts:-missing}" = "0" ] || {
            echo "::error::Raw Peer Detection runtime artifacts leaked back into Atlas stations: ${peer_artifacts:-missing}"
            exit 1
          }
          g6_node_count="$(sed -n 's/.*data-g6-node-count="\([0-9][0-9]*\)".*/\1/p' /tmp/atlas3d-dom.html | head -1)"
          [ -n "${g6_node_count}" ] && [ "${g6_node_count}" -gt 3 ] || {
            echo "::error::G6 received only ${g6_node_count:-0} nodes; expected the three hubs plus their initial stations"
            exit 1
          }
          grep -Fq 'data-atlas-root-count="3"' /tmp/atlas3d-dom.html
          grep -Fq 'Nexo' /tmp/atlas3d-dom.html
          grep -Fq 'Science' /tmp/atlas3d-dom.html
          grep -Fq 'Olympus' /tmp/atlas3d-dom.html
          visible_count="$(grep -o 'data-atlas-visible-count="[0-9]*"' /tmp/atlas3d-dom.html | head -1 | tr -cd '0-9')"
          [ -n "${visible_count}" ] && [ "${visible_count}" -gt 3 ] || {
            echo "::error::Atlas Metro rendered only ${visible_count:-0} visible stations; expected the 3 hubs plus named stations"
            exit 1
          }
          echo "PAGES_ATLAS3D_VISUAL_READBACK_OK roots=3 visible=${visible_count} g6_nodes=${g6_node_count} renderer=metro-cluster"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const system = JSON.parse(fs.readFileSync('/tmp/system.json', 'utf8'));
          const rawPeer = system.graph.nodes.filter(node =>
            /^work:PEER-DETECTION-D\d+/i.test(String(node.id || ''))
            || /^test:PEER-DETECTION-D\d+/i.test(String(node.id || ''))
            || /^capability:peer\.detection\./i.test(String(node.id || ''))
          );
          if (rawPeer.length) throw new Error('RAW_PEER_ARTIFACTS_VISIBLE:' + rawPeer.map(node => node.id).join(','));
          const peerFilaments = system.filaments.filter(item => item.kind === 'SCIENTIFIC_LEARNING_PIPELINE');
          const peerGroups = new Set(peerFilaments.map(item => item.peer_detection_group));
          if (peerFilaments.length < 8 || peerGroups.size < 8) {
            throw new Error('PEER_SEMANTIC_BUNDLES_MISSING:' + peerFilaments.length + ':' + peerGroups.size);
          }
          const meta = system.filaments.filter(item => item.kind === 'PROCEDURAL');
          if (!meta.length) throw new Error('METALEARNING_NOT_PROJECTED');
          console.log(
            'PAGES_ATLAS_LEARNING_SEMANTIC_OK'
            + ' peer_bundles=' + peerFilaments.length
            + ' peer_groups=' + peerGroups.size
            + ' meta_learning=' + meta.length
            + ' raw_peer_nodes=0'
          );
          NODE

          depth_url="${base}/atlas3d/?mode=3d&expand=dense-science"
          "${chrome_bin}" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars \
            --use-angle=swiftshader --enable-unsafe-swiftshader \
            --window-size=1440,900 --virtual-time-budget=12000 --dump-dom "${depth_url}" \
            > /tmp/atlas3d-3d-dom.html
          echo "ATLAS3D_3D_DOM_DIAGNOSTICS_BEGIN"
          grep -oE 'data-atlas-[a-z-]+="[^"]*"' /tmp/atlas3d-3d-dom.html | head -20 || true
          grep -oE 'data-three-(ready|node-count|paint-samples|synapse-count|learning-synapses|z-span|same-level-z-span|selected-sibling-count|selected-sibling-z-span|depth-policy|visual)="[^"]*"' /tmp/atlas3d-3d-dom.html | head -28 || true
          echo "ATLAS3D_3D_DOM_DIAGNOSTICS_END"
          grep -Fq 'data-atlas-mode="3d"' /tmp/atlas3d-3d-dom.html
          grep -Fq 'data-active-mode="3d"' /tmp/atlas3d-3d-dom.html
          grep -Fq '3D EXPLORAR ATIVO' /tmp/atlas3d-3d-dom.html
          grep -Fq 'data-three-ready="true"' /tmp/atlas3d-3d-dom.html
          grep -Fq 'data-three-visual="neural-synapse"' /tmp/atlas3d-3d-dom.html
          three_node_count="$(sed -n 's/.*data-three-node-count="\([0-9][0-9]*\)".*/\1/p' /tmp/atlas3d-3d-dom.html | head -1)"
          [ -n "${three_node_count}" ] && [ "${three_node_count}" -gt 3 ] || {
            echo "::error::Three renderer received only ${three_node_count:-0} nodes"
            exit 1
          }
          three_synapse_count="$(sed -n 's/.*data-three-synapse-count="\([0-9][0-9]*\)".*/\1/p' /tmp/atlas3d-3d-dom.html | head -1)"
          [ -n "${three_synapse_count}" ] && [ "${three_synapse_count}" -gt 0 ] || {
            echo "::error::Neural Three renderer produced no synapses"
            exit 1
          }
          three_learning="$(sed -n 's/.*data-three-learning-synapses="\([0-9][0-9]*\)".*/\1/p' /tmp/atlas3d-3d-dom.html | head -1)"
          [ -n "${three_learning}" ] && [ "${three_learning}" -ge 8 ] || {
            echo "::error::Three renderer materialized only ${three_learning:-0} Learning synapses"
            exit 1
          }
          grep -Fq 'data-three-depth-policy="domain-depth-sibling-v3"' /tmp/atlas3d-3d-dom.html
          three_z_span="$(sed -n 's/.*data-three-z-span="\([0-9.][0-9.]*\)".*/\1/p' /tmp/atlas3d-3d-dom.html | head -1)"
          three_same_level_z="$(sed -n 's/.*data-three-same-level-z-span="\([0-9.][0-9.]*\)".*/\1/p' /tmp/atlas3d-3d-dom.html | head -1)"
          selected_sibling_count="$(sed -n 's/.*data-three-selected-sibling-count="\([0-9][0-9]*\)".*/\1/p' /tmp/atlas3d-3d-dom.html | head -1)"
          selected_sibling_z="$(sed -n 's/.*data-three-selected-sibling-z-span="\([0-9.][0-9.]*\)".*/\1/p' /tmp/atlas3d-3d-dom.html | head -1)"
          awk -v value="${three_z_span:-0}" 'BEGIN { exit !(value > 700) }' || {
            echo "::error::Three total Z depth is too flat: ${three_z_span:-missing}"
            exit 1
          }
          awk -v value="${three_same_level_z:-0}" 'BEGIN { exit !(value > 120) }' || {
            echo "::error::Three same-level siblings still form a flat totem: ${three_same_level_z:-missing}"
            exit 1
          }
          [ -n "${selected_sibling_count}" ] && [ "${selected_sibling_count}" -gt 2 ] || {
            echo "::error::Dense Science depth probe selected only ${selected_sibling_count:-0} children"
            exit 1
          }
          awk -v value="${selected_sibling_z:-0}" 'BEGIN { exit !(value > 120) }' || {
            echo "::error::Selected dense Science siblings still form a flat totem: ${selected_sibling_z:-missing}"
            exit 1
          }
          three_paint_samples="$(sed -n 's/.*data-three-paint-samples="\([0-9][0-9]*\)".*/\1/p' /tmp/atlas3d-3d-dom.html | head -1)"
          [ -n "${three_paint_samples}" ] && [ "${three_paint_samples}" -gt 20 ] || {
            echo "::error::Three WebGL framebuffer is visually empty; painted samples=${three_paint_samples:-0}"
            exit 1
          }
          "${chrome_bin}" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars \
            --use-angle=swiftshader --enable-unsafe-swiftshader \
            --window-size=1440,900 --virtual-time-budget=8000 \
            --screenshot=/tmp/atlas3d-readback-3d.png "${depth_url}" >/dev/null 2>&1
          test -s /tmp/atlas3d-readback-3d.png
          echo "PAGES_ATLAS3D_3D_READBACK_OK visual=neural-synapse visible=${visible_count} three_nodes=${three_node_count} synapses=${three_synapse_count} learning=${three_learning} z_span=${three_z_span} same_level_z=${three_same_level_z} selected_siblings=${selected_sibling_count} selected_z=${selected_sibling_z} paint_samples=${three_paint_samples}"

          curl -fsSL "${base}/world-public.ndjson" -o /tmp/world.ndjson
          curl -fsSL "${base}/mcp/topology.json" -o /tmp/mcp-topology.json
          curl -fsSL "${base}/galaxy/latest.json" -o /tmp/galaxy-latest.json
          curl -fsSL "${base}/galaxy/index.json" -o /tmp/galaxy-index.json
          curl -fsSL "${base}/build-meta.json" -o /tmp/build-meta.json

          galaxy_id="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/galaxy-latest.json','utf8'));process.stdout.write(x.snapshot_id)")"
          printf '%s' "${galaxy_id}" | grep -Eq '^galaxy-[0-9a-z-]+$'
          curl -fsSL "${base}/galaxy/snapshots/${galaxy_id}.json" -o /tmp/galaxy-versioned.json

          node <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('/tmp/manifest.json','utf8'));
          const projection=JSON.parse(fs.readFileSync('/tmp/projection.json','utf8'));
          const system=JSON.parse(fs.readFileSync('/tmp/system.json','utf8'));
          const world=JSON.parse(fs.readFileSync('/tmp/world.ndjson','utf8').trim());
          const mcp=JSON.parse(fs.readFileSync('/tmp/mcp-topology.json','utf8'));
          const galaxy=JSON.parse(fs.readFileSync('/tmp/galaxy-latest.json','utf8'));
          const galaxyIndex=JSON.parse(fs.readFileSync('/tmp/galaxy-index.json','utf8'));
          const galaxyVersioned=JSON.parse(fs.readFileSync('/tmp/galaxy-versioned.json','utf8'));
          const buildMeta=JSON.parse(fs.readFileSync('/tmp/build-meta.json','utf8'));

          if(manifest.authority!=='TOWER_V06')throw new Error('READBACK_AUTHORITY_INVALID');
          if(manifest.projection_only!==true)throw new Error('READBACK_PROJECTION_ONLY_INVALID');
          if(manifest.writeback!=='FORBIDDEN')throw new Error('READBACK_WRITEBACK_INVALID');
          if(manifest.tower_commit!==process.env.EXPECTED_TOWER_COMMIT)throw new Error('READBACK_TOWER_COMMIT_MISMATCH');
          if(manifest.event_cursor!==process.env.EXPECTED_EVENT_CURSOR)throw new Error('READBACK_EVENT_CURSOR_MISMATCH');
          if(manifest.projection_fingerprint!==process.env.EXPECTED_FINGERPRINT)throw new Error('READBACK_FINGERPRINT_MISMATCH');
          if(JSON.stringify(projection.manifest)!==JSON.stringify(manifest))throw new Error('READBACK_MANIFEST_SPLIT_BRAIN');
          if(system.bus?.fingerprint!==manifest.projection_fingerprint)throw new Error('SYSTEM_NOT_BOUND_TO_TOWER_PROJECTION');
          if(world.truthGraph?.fingerprint!==manifest.projection_fingerprint)throw new Error('WORLD_NOT_BOUND_TO_TOWER_PROJECTION');

          if(buildMeta.contract!=='NEXO_ONE_BUILD_META_V1')throw new Error('BUILD_META_CONTRACT_INVALID');
          if(buildMeta.pantheon_commit!==process.env.EXPECTED_PANTHEON_COMMIT)throw new Error('BUILD_META_COMMIT_MISMATCH');
          if(buildMeta.projection_fingerprint!==manifest.projection_fingerprint)throw new Error('BUILD_META_FINGERPRINT_MISMATCH');

          const raw=JSON.stringify({system,world,projection});
          if(/truthgraph-projection|nexo-drive-projection/i.test(raw))throw new Error('LEGACY_OPERATIONAL_SOURCE_PRESENT');

          if(mcp.contract!=='NEXO_MCP_TOPOLOGY_V1')throw new Error('MCP_TOPOLOGY_CONTRACT_INVALID');
          if(mcp.source?.authority!=='TOWER_V06'||!mcp.source?.commit)throw new Error('MCP_TOPOLOGY_SOURCE_INVALID');
          if(!Array.isArray(mcp.nodes)||mcp.nodes.length<8||!Array.isArray(mcp.links)||mcp.links.length<7)throw new Error('MCP_TOPOLOGY_EMPTY');

          if(galaxy.contract!=='NEXO_ONE_GALAXY_V1')throw new Error('GALAXY_CONTRACT_INVALID');
          if(galaxy.provenance?.source_fingerprint!==manifest.projection_fingerprint)throw new Error('GALAXY_NOT_BOUND_TO_TOWER_PROJECTION');
          if(galaxy.tower_revision!==manifest.tower_commit)throw new Error('GALAXY_TOWER_REVISION_MISMATCH');
          if(galaxyIndex.contract!=='NEXO_ONE_GALAXY_INDEX_V1')throw new Error('GALAXY_INDEX_CONTRACT_INVALID');
          if(galaxyIndex.latest_snapshot_id!==galaxy.snapshot_id)throw new Error('GALAXY_INDEX_LATEST_MISMATCH');
          if(!Array.isArray(galaxyIndex.snapshots)||!galaxyIndex.snapshots.some(item=>item.snapshot_id===galaxy.snapshot_id))throw new Error('GALAXY_INDEX_MISSING_LATEST');
          if(JSON.stringify(galaxyVersioned)!==JSON.stringify(galaxy))throw new Error('GALAXY_VERSIONED_READBACK_MISMATCH');
          NODE

          echo "PAGES_TOWER_PROJECTION_READBACK_OK ${base}/tower-projection/manifest.json"
          echo "PAGES_SYSTEM_READBACK_OK ${base}/system.json"
          echo "PAGES_WORLD_READBACK_OK ${base}/world-public.ndjson"
          echo "PAGES_MCP_ATLAS_READBACK_OK ${base}/mcp/topology.json"
          echo "PAGES_GALAXY_READBACK_OK ${base}/galaxy/latest.json"
          echo "PAGES_GALAXY_INDEX_READBACK_OK ${base}/galaxy/index.json"
          echo "PAGES_BUILD_META_READBACK_OK ${base}/build-meta.json"

      - name: Upload Atlas 3D visual readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas3d-production-readback
          path: |
            /tmp/atlas3d-readback.png
            /tmp/atlas3d-dom.html
            /tmp/atlas3d-readback-3d.png
            /tmp/atlas3d-3d-dom.html
            /tmp/system.json
          if-no-files-found: warn
          retention-days: 7
