name: NEXO ONE GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'nexo-one/**'
      - '.github/workflows/nexo-one-pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nexo-one-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nexo-one/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        working-directory: nexo-one
        run: npm ci --no-audit --no-fund

      - name: Build static NEXO ONE
        working-directory: nexo-one
        env:
          GITHUB_PAGES: '1'
          VITE_SYSTEM_ENDPOINT: ./system.json
        run: npm run build

      - name: Snapshot public SystemState
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            https://nexo-one-two.vercel.app/api/system \
            --output nexo-one/dist/system.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const value = JSON.parse(readFileSync('nexo-one/dist/system.json', 'utf8'));
          if (!value || typeof value !== 'object' || Array.isArray(value)) {
            throw new Error('SystemState snapshot is not a JSON object');
          }
          NODE
          touch nexo-one/dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: nexo-one/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
