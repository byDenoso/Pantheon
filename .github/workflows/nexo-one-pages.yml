          test -s /tmp/mcp-readback-mobile-dark-3d.png
          echo "PAGES_MCP_NEURAL_MOBILE_DARK_3D_OK"

          echo "PAGES_MCP_VISUAL_READBACK_OK selected=COSMOLOGY nodes=${mcp_nodes} links=${mcp_links}"
          curl -fsSL "${base}/world-public.ndjson" -o /tmp/world.ndjson
          curl -fsSL "${base}/science-projection-v1.json" -o /tmp/science-projection-v1.json
          curl -fsSL "${base}/contracts/science-projection-v1.schema.json" -o /tmp/science-projection-v1.schema.json
          curl -fsSL "${base}/mcp/topology.json" -o /tmp/mcp-topology.json
          curl -fsSL "${base}/galaxy/latest.json" -o /tmp/galaxy-latest.json
          curl -fsSL "${base}/galaxy/index.json" -o /tmp/galaxy-index.json
          curl -fsSL "${base}/build-meta.json" -o /tmp/build-meta.json

          galaxy_id="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/galaxy-latest.json','utf8'));process.stdout.write(x.snapshot_id)")"
          printf '%s' "${galaxy_id}" | grep -Eq '^galaxy-[0-9a-z-]+$'
          curl -fsSL "${base}/galaxy/snapshots/${galaxy_id}.json" -o /tmp/galaxy-versioned.json

          node <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('/tmp/manifest.json','utf8'));
          const projection=JSON.parse(fs.readFileSync('/tmp/projection.json','utf8'));
          const system=JSON.parse(fs.readFileSync('/tmp/system.json','utf8'));
          const science=JSON.parse(fs.readFileSync('/tmp/science-projection-v1.json','utf8'));
          const scienceSchema=JSON.parse(fs.readFileSync('/tmp/science-projection-v1.schema.json','utf8'));
          const world=JSON.parse(fs.readFileSync('/tmp/world.ndjson','utf8').trim());
          const mcp=JSON.parse(fs.readFileSync('/tmp/mcp-topology.json','utf8'));
          const galaxy=JSON.parse(fs.readFileSync('/tmp/galaxy-latest.json','utf8'));
          const galaxyIndex=JSON.parse(fs.readFileSync('/tmp/galaxy-index.json','utf8'));
          const galaxyVersioned=JSON.parse(fs.readFileSync('/tmp/galaxy-versioned.json','utf8'));
          const buildMeta=JSON.parse(fs.readFileSync('/tmp/build-meta.json','utf8'));

          if(manifest.authority!=='TOWER_V06')throw new Error('READBACK_AUTHORITY_INVALID');
          if(manifest.projection_only!==true)throw new Error('READBACK_PROJECTION_ONLY_INVALID');
          if(manifest.writeback!=='FORBIDDEN')throw new Error('READBACK_WRITEBACK_INVALID');
          if(manifest.tower_commit!==process.env.EXPECTED_TOWER_COMMIT)throw new Error('READBACK_TOWER_COMMIT_MISMATCH');
          if(manifest.event_cursor!==process.env.EXPECTED_EVENT_CURSOR)throw new Error('READBACK_EVENT_CURSOR_MISMATCH');
          if(manifest.projection_fingerprint!==process.env.EXPECTED_FINGERPRINT)throw new Error('READBACK_FINGERPRINT_MISMATCH');
          if(JSON.stringify(projection.manifest)!==JSON.stringify(manifest))throw new Error('READBACK_MANIFEST_SPLIT_BRAIN');
          if(system.bus?.fingerprint!==manifest.projection_fingerprint)throw new Error('SYSTEM_NOT_BOUND_TO_TOWER_PROJECTION');
          if(science.contract!=='NEXO_SCIENCE_PROJECTION_V1'||science.version!==1)throw new Error('SCIENCE_PROJECTION_CONTRACT_INVALID');
          if(science.source?.projection_fingerprint!==manifest.projection_fingerprint||science.source?.tower_commit!==manifest.tower_commit)throw new Error('SCIENCE_PROJECTION_SOURCE_MISMATCH');
          if(science.source?.writeback!=='FORBIDDEN'||scienceSchema.properties?.contract?.const!==science.contract)throw new Error('SCIENCE_PROJECTION_SCHEMA_OR_WRITEBACK_INVALID');
          if(JSON.stringify(system.science_projection_v1)!==JSON.stringify(science))throw new Error('SYSTEM_SCIENCE_PROJECTION_READBACK_MISMATCH');
          const scienceBase={...science}; delete scienceBase.fingerprint;
          const canonical=value=>Array.isArray(value)?value.map(canonical):value&&typeof value==='object'?Object.fromEntries(Object.keys(value).sort().map(key=>[key,canonical(value[key])])):value;
          const scienceDigest='sha256:'+require('crypto').createHash('sha256').update(JSON.stringify(canonical(scienceBase))).digest('hex');
          if(science.fingerprint!==scienceDigest)throw new Error('SCIENCE_PROJECTION_FINGERPRINT_INVALID');
          const checkScienceRecords=records=>{for(const record of records){if(!record.source_ref?.startsWith('tower://')||!/^sha256:[0-9a-f]{64}$/i.test(record.fingerprint||''))throw new Error('SCIENCE_RECORD_PROVENANCE_INVALID '+record.id);const visit=value=>{if(Array.isArray(value)){for(const item of value)visit(item);return;}if(!value||typeof value!=='object')return;if(Object.hasOwn(value,'value')&&Object.hasOwn(value,'source_ref')){if(!value.source_ref.startsWith('tower://')||!/^sha256:[0-9a-f]{64}$/i.test(value.fingerprint||''))throw new Error('SCIENCE_FIELD_PROVENANCE_INVALID '+record.id);if(value.value===null&&!String(value.unavailable_reason||'').trim())throw new Error('SCIENCE_NULL_REASON_MISSING '+record.id);if(value.value!==null&&value.unavailable_reason!==null)throw new Error('SCIENCE_VALUE_REASON_CONFLICT '+record.id);return;}for(const child of Object.values(value))visit(child);};for(const [key,value] of Object.entries(record)){if(!['id','source_ref','fingerprint'].includes(key))visit(value);}}};
          checkScienceRecords([...(science.campaigns||[]),...(science.hypotheses||[]),...(science.tests||[])]);
          if(world.truthGraph?.fingerprint!==manifest.projection_fingerprint)throw new Error('WORLD_NOT_BOUND_TO_TOWER_PROJECTION');

          const projectedWork=Array.isArray(projection.work)?projection.work:[];
          const publishedWork=Array.isArray(system.projected_work)?system.projected_work:[];
          if(publishedWork.length!==projectedWork.length){
            throw new Error(`WORK_COUNT_DRIFT projection=${projectedWork.length} system=${publishedWork.length}`);
          }
          const projectedById=new Map(projectedWork.map(item=>[String(item.id||''),item]));
          const systemById=new Map(publishedWork.map(node=>[String(node.id||'').replace(/^work:/,''),node]));
          const humanIds=new Set(Array.isArray(projection.human_gates?.work_ids)?projection.human_gates.work_ids.map(String):[]);
          for(const [id,item] of projectedById){
            const node=systemById.get(id);
            if(!node)throw new Error(`WORK_MISSING_FROM_SYSTEM ${id}`);
            const expectedStatus=String(item.operational_status||item.status||'UNSPECIFIED').toUpperCase();
            const actualStatus=String(node.operational_status||node.state||'UNSPECIFIED').toUpperCase();
            if(actualStatus!==expectedStatus)throw new Error(`WORK_STATUS_DRIFT ${id} projection=${expectedStatus} system=${actualStatus}`);
            if(Boolean(node.human_gate)!==humanIds.has(id))throw new Error(`WORK_HUMAN_GATE_DRIFT ${id}`);
          }
          const expectedBlocked=projectedWork.filter(item=>String(item.operational_status||item.status||'').toUpperCase()==='BLOCKED').length;
          const actualBlocked=publishedWork.filter(node=>String(node.operational_status||node.state||'').toUpperCase()==='BLOCKED').length;
          if(actualBlocked!==expectedBlocked)throw new Error(`WORK_BLOCKED_COUNT_DRIFT projection=${expectedBlocked} system=${actualBlocked}`);
          const expectedWaiting=projectedWork.filter(item=>String(item.operational_status||item.status||'').toUpperCase()==='WAIT_DEPENDENCY').length;
          const actualWaiting=publishedWork.filter(node=>String(node.operational_status||node.state||'').toUpperCase()==='WAIT_DEPENDENCY').length;
          if(actualWaiting!==expectedWaiting)throw new Error(`WORK_WAITING_COUNT_DRIFT projection=${expectedWaiting} system=${actualWaiting}`);
          if((system.inbox||[]).length!==humanIds.size)throw new Error(`WORK_HUMAN_COUNT_DRIFT projection=${humanIds.size} inbox=${(system.inbox||[]).length}`);
          const inboxByWork=new Map((system.inbox||[]).map(item=>[String(item.id||'').replace(/^needs-dener:/,''),item]));
          for(const id of humanIds){
            const inbox=inboxByWork.get(id);
            if(!inbox)throw new Error(`WORK_HUMAN_INBOX_MISSING ${id}`);
            if(!Array.isArray(inbox.human_requirements)||inbox.human_requirements.length<1){
              throw new Error(`WORK_HUMAN_REQUIREMENTS_EMPTY ${id}`);
            }
            if(!inbox.human_requirements.every(req=>String(req?.detail||'').trim()&&String(req?.label||'').trim())){
              throw new Error(`WORK_HUMAN_REQUIREMENTS_UNEXPLAINED ${id}`);
            }
            if(Array.isArray(inbox.automatic_requirements)&&inbox.automatic_requirements.some(req=>
              inbox.human_requirements.some(human=>String(human?.id||'')===String(req?.id||'')))){
              throw new Error(`WORK_DEPENDENCY_CLASSIFICATION_OVERLAP ${id}`);
            }
            if(inbox.kind==='CONFIGURAR_ACESSO'&&!String(inbox.action_location||'').trim()){
              throw new Error(`WORK_AUTH_LOCATION_MISSING ${id}`);
            }
          }
          console.log('PAGES_NEEDS_DENER_SEMANTIC_READBACK_OK gates='+humanIds.size);

          if(buildMeta.contract!=='NEXO_ONE_BUILD_META_V1')throw new Error('BUILD_META_CONTRACT_INVALID');
          if(buildMeta.pantheon_commit!==process.env.EXPECTED_PANTHEON_COMMIT)throw new Error('BUILD_META_COMMIT_MISMATCH');
          if(buildMeta.projection_fingerprint!==manifest.projection_fingerprint)throw new Error('BUILD_META_FINGERPRINT_MISMATCH');
          if(buildMeta.presentation_input_fingerprint!==process.env.EXPECTED_PRESENTATION_FINGERPRINT)throw new Error('BUILD_META_PRESENTATION_INPUT_FINGERPRINT_MISMATCH');

          const raw=JSON.stringify({system,world,projection});
          if(/truthgraph-projection|nexo-drive-projection/i.test(raw))throw new Error('LEGACY_OPERATIONAL_SOURCE_PRESENT');

          if(mcp.contract!=='NEXO_MCP_TOPOLOGY_V1')throw new Error('MCP_TOPOLOGY_CONTRACT_INVALID');
          if(mcp.source?.authority!=='TOWER_V06'||!mcp.source?.commit)throw new Error('MCP_TOPOLOGY_SOURCE_INVALID');
          if(mcp.source?.source_storage!=='GOOGLE_DRIVE_PRIVATE'||mcp.source?.source_snapshot_id!==manifest.source_snapshot_id)throw new Error('MCP_TOPOLOGY_FRESHNESS_SOURCE_INVALID');
          if(mcp.source?.source_state_fingerprint!==manifest.source_state_fingerprint||mcp.source?.projection_fingerprint!==manifest.projection_fingerprint)throw new Error('MCP_TOPOLOGY_FRESHNESS_FINGERPRINT_MISMATCH');
          if(!Array.isArray(mcp.nodes)||mcp.nodes.length<8||!Array.isArray(mcp.links)||mcp.links.length<7)throw new Error('MCP_TOPOLOGY_EMPTY');
          const registeredCapabilityNodes=mcp.nodes.filter(node=>node.kind==='CAPABILITY');
          const registeredCapabilityIds=registeredCapabilityNodes.map(node=>String(node.meta?.id||node.id||'')).filter(Boolean);
          if(registeredCapabilityIds.length!==new Set(registeredCapabilityIds).size)throw new Error('MCP_CAPABILITY_ID_DUPLICATE');
          if(mcp.stats?.capabilities!==registeredCapabilityNodes.length)throw new Error('MCP_CAPABILITY_REGISTRY_COUNT_MISMATCH');
          const systemCapabilityIds=(system.capabilities||[]).map(item=>String(item.capability_id||'')).filter(Boolean);
          if(systemCapabilityIds.length!==new Set(systemCapabilityIds).size)throw new Error('SYSTEM_CAPABILITY_ID_DUPLICATE');
          const outsidePass=(system.capabilities||[]).filter(item=>item.status!=='PASS'&&item.status!=='RETIRED_RUNTIME').length;
          console.log(`CAPABILITY_SEMANTICS_PARITY registered=${registeredCapabilityIds.length} system_total=${systemCapabilityIds.length} system_outside_pass=${outsidePass} projection=${manifest.projection_fingerprint}`);

          if(galaxy.contract!=='NEXO_ONE_GALAXY_V1')throw new Error('GALAXY_CONTRACT_INVALID');
          if(galaxy.provenance?.source_fingerprint!==manifest.projection_fingerprint)throw new Error('GALAXY_NOT_BOUND_TO_TOWER_PROJECTION');
          if(galaxy.tower_revision!==manifest.tower_commit)throw new Error('GALAXY_TOWER_REVISION_MISMATCH');
          if(galaxyIndex.contract!=='NEXO_ONE_GALAXY_INDEX_V1')throw new Error('GALAXY_INDEX_CONTRACT_INVALID');
          if(galaxyIndex.latest_snapshot_id!==galaxy.snapshot_id)throw new Error('GALAXY_INDEX_LATEST_MISMATCH');
          if(!Array.isArray(galaxyIndex.snapshots)||!galaxyIndex.snapshots.some(item=>item.snapshot_id===galaxy.snapshot_id))throw new Error('GALAXY_INDEX_MISSING_LATEST');
          if(JSON.stringify(galaxyVersioned)!==JSON.stringify(galaxy))throw new Error('GALAXY_VERSIONED_READBACK_MISMATCH');
          NODE

          echo "PAGES_TOWER_PROJECTION_READBACK_OK ${base}/tower-projection/manifest.json"
          echo "PAGES_SYSTEM_READBACK_OK ${base}/system.json"
          echo "PAGES_SCIENCE_PROJECTION_READBACK_OK ${base}/science-projection-v1.json"
          echo "PAGES_WORLD_READBACK_OK ${base}/world-public.ndjson"
          echo "PAGES_MCP_ATLAS_READBACK_OK ${base}/mcp/topology.json"
