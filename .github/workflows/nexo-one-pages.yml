name: NEXO ONE GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'nexo-atlas/**'
      - '.github/workflows/nexo-one-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nexo-one-github-pages-v2
  cancel-in-progress: false

# Pages is an unauthenticated static host. Publish only the reviewed v67b
# projection generated by its public Worker route. Never read Tower or copy
# private runtime data into this artifact.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nexo-atlas/package-lock.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        working-directory: nexo-atlas
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Build and verify NEXO Atlas v67b
        working-directory: nexo-atlas
        env:
          VITE_PUBLIC_API_URL: /atlas-public.json
          VITE_PRIVATE_COCKPIT_URL: https://nexo-one-two.vercel.app/#/privado
        run: |
          set -euo pipefail
          npm run check
          node scripts/build-pages-public.mjs
      - name: Verify final Pages package after all build steps
        working-directory: nexo-atlas
        run: node scripts/build-pages-public.mjs --check
      - name: Upload NEXO Atlas public artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: nexo-atlas/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy shell-only GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify former data URLs are unavailable
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGES_URL%/}"
          for route in system.json science-projection-v1.json world-public.ndjson \
            tower-projection/publication.json tower-projection/projection.json \
            tower-projection/manifest.json mcp/topology.json galaxy/latest.json \
            galaxy/index.json build-meta.json; do
            status="$(curl --silent --show-error --location --output /dev/null \
              --write-out '%{http_code}' "${base}/${route}")"
            case "${status}" in
              403|404|410) ;;
              *) echo "::error::Former public data path is still reachable: ${route} (${status})"; exit 1 ;;
            esac
          done
