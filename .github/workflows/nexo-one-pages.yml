          grep -Fq 'data-mcp-graph-view="3d"' /tmp/mcp-readback-mobile-dark-3d-dom.html
          grep -Fq 'data-mcp-renderer="neural-3d"' /tmp/mcp-readback-mobile-dark-3d-dom.html
