name: NEXO ONE GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'nexo-one/**'
      - '.github/workflows/nexo-one-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nexo-one-github-pages-v2
  cancel-in-progress: false

# Pages is an unauthenticated static host. No research or operational content
# has an approved public allowlist. Never read Tower, hydrate old history, or
# copy backend projections into this artifact. Private data stays behind APIs.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nexo-one/package-lock.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        working-directory: nexo-one
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Build public application shell
        working-directory: nexo-one
        env:
          GITHUB_PAGES: '1'
          VITE_PRIVATE_COCKPIT_URL: ${{ vars.VITE_PRIVATE_COCKPIT_URL }}
        run: |
          set -euo pipefail
          npm run typecheck
          node --test test/static-publication-boundary.test.mjs
          npm run build
          node scripts/build-pages-system.mjs
          touch dist/.nojekyll
          node scripts/static-publication.mjs --check
      - name: Add NEXO state projection (read by the agents and the alarm)
        run: |
          set -euo pipefail
          mkdir -p nexo-one/dist/tower-projection
          for f in projection.json manifest.json; do
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/nexo-projection/$f" -o "nexo-one/dist/tower-projection/$f"
          done
      - name: Upload shell-only Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: nexo-one/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy shell-only GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify former data URLs are unavailable
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGES_URL%/}"
          for route in system.json science-projection-v1.json world-public.ndjson \
            tower-projection/publication.json mcp/topology.json galaxy/latest.json \
            galaxy/index.json build-meta.json; do
            status="$(curl --silent --show-error --location --output /dev/null \
              --write-out '%{http_code}' "${base}/${route}")"
            case "${status}" in
              403|404|410) ;;
              *) echo "::error::Former public data path is still reachable: ${route} (${status})"; exit 1 ;;
            esac
          done
          curl -fsSL "${base}/tower-projection/projection.json" | jq -e '.manifest' >/dev/null
