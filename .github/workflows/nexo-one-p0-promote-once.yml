name: NEXO ONE P0 promote PERSONAL_LOOP once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexo-one-p0-promote-once.yml'

permissions:
  contents: read

concurrency:
  group: nexo-one-deployment
  cancel-in-progress: false

jobs:
  promote:
    if: "${{ startsWith(github.event.head_commit.message, 'ops(nexo-one): promote verified PERSONAL_LOOP preview') }}"
    runs-on: ubuntu-latest
    environment: nexo-one-production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      TARGET_DEPLOYMENT: dpl_QRiVzgTQi2WLirf7D9Ga4WT2fAJf
      TARGET_URL: https://nexo-lyymfmbsb-denosooo2-1701s-projects.vercel.app
      PREVIOUS_DEPLOYMENT: dpl_F9A6nBmB6jKDqazKvQ7dTWcp2SHq
      PRODUCTION_URL: https://nexo-one-two.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify bounded promotion inputs
        env:
          CLI_VERSION: ${{ vars.NEXO_VERCEL_CLI_VERSION }}
        run: |
          set -euo pipefail
          test "$VERCEL_PROJECT_ID" = prj_rFoAEgGt4gFNr8DHEOzxY7keS16W
          test -n "$VERCEL_TOKEN"
          test -n "$CLI_VERSION"
          npm install --global "vercel@$CLI_VERSION"
      - name: Verify exact preview public and privacy boundary
        run: |
          set -euo pipefail
          headers=()
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            headers=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi
          code=$(curl -L -sS "${headers[@]}" -o /tmp/health.json -w '%{http_code}' --max-time 30 "$TARGET_URL/api/health")
          test "$code" = 200
          node -e 'const x=require("/tmp/health.json"); if(x.access!=="PUBLIC"||x.privateConfigured!==false) process.exit(1)'
          personal_code=$(curl -sS "${headers[@]}" -o /tmp/personal.json -w '%{http_code}' --max-time 30 "$TARGET_URL/api/personal")
          test "$personal_code" = 401
      - name: Promote same verified artifact and read back production
        run: |
          set -euo pipefail
          vercel promote "$TARGET_DEPLOYMENT" --yes --token "$VERCEL_TOKEN"
          if ! code=$(curl -L -sS -o /tmp/prod-health.json -w '%{http_code}' --max-time 30 "$PRODUCTION_URL/api/health") || [ "$code" != 200 ]; then
            vercel rollback "$PREVIOUS_DEPLOYMENT" --yes --token "$VERCEL_TOKEN"
            exit 1
          fi
          node -e 'const x=require("/tmp/prod-health.json"); if(x.access!=="PUBLIC"||x.privateConfigured!==false) process.exit(1)'
          personal_code=$(curl -sS -o /tmp/prod-personal.json -w '%{http_code}' --max-time 30 "$PRODUCTION_URL/api/personal")
          if [ "$personal_code" != 401 ]; then
            vercel rollback "$PREVIOUS_DEPLOYMENT" --yes --token "$VERCEL_TOKEN"
            exit 1
          fi
          node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('personal-loop-promotion-receipt.json',JSON.stringify({
            status:'PASS',
            targetDeployment:process.env.TARGET_DEPLOYMENT,
            previousDeployment:process.env.PREVIOUS_DEPLOYMENT,
            productionUrl:process.env.PRODUCTION_URL,
            sourceSha:'9271cf168cd618d8396cc80a1e8e19d509ff3e98',
            personalLoopMerge:'0655584c949073d31972839b60dc65db54bd39c5',
            healthStatus:200,
            anonymousPersonalStatus:401,
            checkedAt:new Date().toISOString()
          },null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexo-one-p0-personal-loop-promotion-receipt
          path: personal-loop-promotion-receipt.json
