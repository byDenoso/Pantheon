name: NEXO test battery
run-name: battery ${{ inputs.battery_id || 'bat-runner-canary-1' }}

# Public scientific compute only. The Writer robot dispatches production batteries.
# Pull requests run the fixed canary so this exact runner is proven before changes merge.
# No secrets, no Tower/Drive access, read-only repository token, checkout credentials removed.
on:
  workflow_dispatch:
    inputs:
      battery_id:
        description: battery id (file batteries/<id>.json on branch nexo-batteries)
        required: true
  pull_request:
    paths:
      - '.github/workflows/nexo-test-battery.yml'
      - 'nexo-one/executor-runtime/**'

permissions:
  contents: read

concurrency:
  group: nexo-battery-${{ inputs.battery_id || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

env:
  NEXO_BATTERY_ID: ${{ inputs.battery_id || 'bat-runner-canary-1' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout runtime definition
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: nexo-one/executor-runtime/requirements.txt
      - name: Install base scientific runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r nexo-one/executor-runtime/requirements.txt
          python -m pip check
      - name: Verify runner capabilities
        run: python nexo-one/executor-runtime/smoke.py

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - name: Checkout frozen battery specs
        uses: actions/checkout@v4
        with:
          ref: nexo-batteries
          path: battery-specs
          sparse-checkout: batteries
          persist-credentials: false
      - id: m
        env:
          BID: ${{ env.NEXO_BATTERY_ID }}
        run: |
          python3 - <<'PY'
          import json, os, re
          bid = os.environ["BID"]
          assert re.fullmatch(r"[a-z0-9-]{3,48}", bid), "bad battery id"
          spec = json.load(open(f"battery-specs/batteries/{bid}.json", encoding="utf-8"))
          tests = list(spec.get("tests") or [])
          assert tests, "battery has no tests"
          assert len(tests) <= 20, "battery exceeds 20-test limit"
          include, seen = [], set()
          for i, test in enumerate(tests):
              test_id = str(test.get("test_id") or "")
              assert test_id and test_id not in seen, "missing or duplicate test_id"
              seen.add(test_id)
              include.append({"test_id": test_id, "index": i})
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("matrix=" + json.dumps({"include": include}, separators=(",", ":")) + "\n")
          PY

  run:
    needs: [preflight, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout runtime definition
        uses: actions/checkout@v4
        with:
          path: runtime-base
          persist-credentials: false
      - name: Checkout frozen battery specs
        uses: actions/checkout@v4
        with:
          ref: nexo-batteries
          path: battery-specs
          sparse-checkout: batteries
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: runtime-base/nexo-one/executor-runtime/requirements.txt
      - name: Prepare frozen test
        id: prepare
        continue-on-error: true
        env:
          BID: ${{ env.NEXO_BATTERY_ID }}
          IDX: ${{ matrix.index }}
          MATRIX_TEST_ID: ${{ matrix.test_id }}
        run: |
          mkdir -p /tmp/job
          python3 - <<'PY'
          import json, os
          bid, idx, expected_id = os.environ["BID"], int(os.environ["IDX"]), os.environ["MATRIX_TEST_ID"]
          spec = json.load(open(f"battery-specs/batteries/{bid}.json", encoding="utf-8"))
          test = spec["tests"][idx]
          test_id = str(test.get("test_id") or "")
          meta = {"battery_id": bid, "test_id": test_id or expected_id,
                  "timeout_min": max(1, min(int(test.get("timeout_min", 30)), 340))}
          json.dump(meta, open("/tmp/job/meta.json", "w", encoding="utf-8"), ensure_ascii=False)
          if test_id != expected_id:
              raise SystemExit("matrix/spec test_id mismatch")
          import re
          if str(test.get("script") or "").strip():
              raise SystemExit("inline scientific scripts are forbidden; use recipe+params")
          recipe = str(test.get("recipe") or "")
          if not re.fullmatch(r"[a-z0-9_]{2,40}", recipe):
              raise SystemExit(f"invalid or missing recipe name {recipe!r}")
          script_path = f"runtime-base/nexo-one/executor-runtime/recipes/{recipe}.py"
          script = open(script_path, encoding="utf-8").read()
          params = test.get("params") or {}
          if not isinstance(params, dict):
              raise SystemExit("params must be an object")
          requires_camb = bool(params.get("requires_camb"))
          camb_commit = str(params.get("camb_commit") or "")
          if requires_camb:
              if not re.fullmatch(r"[0-9a-f]{40}", camb_commit):
                  raise SystemExit("CAMB recipe requires a frozen 40-char TCC commit")
              if "NEXO_PORTABLE_CAMB_ROOT" not in script:
                  raise SystemExit("CAMB recipe must invoke the versioned portable CAMB runtime")
          json.dump(params, open("/tmp/job/params.json", "w", encoding="utf-8"), ensure_ascii=False)
          open("/tmp/job/test.py", "w", encoding="utf-8").write(script)
          open("/tmp/job/requirements-extra.txt", "w", encoding="utf-8").write("")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"requires_camb={'true' if requires_camb else 'false'}\n")
              out.write(f"camb_commit={camb_commit}\n")
          PY
      - name: Checkout frozen portable CAMB runtime
        if: steps.prepare.outcome == 'success' && steps.prepare.outputs.requires_camb == 'true'
        uses: actions/checkout@v4
        with:
          repository: byDenoso/TCC
          ref: ${{ steps.prepare.outputs.camb_commit }}
          path: tcc-runtime
          sparse-checkout: runtime/portable_camb
          persist-credentials: false
      - name: Install deterministic runtime dependencies
        id: deps
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r runtime-base/nexo-one/executor-runtime/requirements.txt 2>&1 | tee /tmp/job/deps.log
          if [ -s /tmp/job/requirements-extra.txt ]; then
            python -m pip install --disable-pip-version-check -r /tmp/job/requirements-extra.txt 2>&1 | tee -a /tmp/job/deps.log
          fi
          python -m pip check 2>&1 | tee -a /tmp/job/deps.log
      - name: Run frozen scientific script
        id: execute
        if: steps.prepare.outcome == 'success' && steps.deps.outcome == 'success'
        env:
          RESULT_PATH: /tmp/job/result.json
          PARAMS_PATH: /tmp/job/params.json
          NEXO_PORTABLE_CAMB_ROOT: ${{ github.workspace }}/tcc-runtime/runtime/portable_camb
          NEXO_PORTABLE_CAMB_COMMIT: ${{ steps.prepare.outputs.camb_commit }}
        run: |
          set +e
          T=$(python3 -c "import json; print(json.load(open('/tmp/job/meta.json'))['timeout_min'])")
          cd /tmp/job
          timeout "${T}m" python3 test.py > run.log 2>&1
          printf '%s\n' "$?" > exit-code.txt
          exit 0
      - name: Build shard receipt
        if: always()
        env:
          PREP_OUTCOME: ${{ steps.prepare.outcome }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          EXEC_OUTCOME: ${{ steps.execute.outcome }}
          MATRIX_TEST_ID: ${{ matrix.test_id }}
        run: |
          mkdir -p /tmp/job
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("/tmp/job")
          meta = {"test_id": os.environ["MATRIX_TEST_ID"]}
          try:
              meta.update(json.load(open(root / "meta.json", encoding="utf-8")))
          except Exception:
              pass
          prep, deps, execute = os.environ.get("PREP_OUTCOME", ""), os.environ.get("DEPS_OUTCOME", ""), os.environ.get("EXEC_OUTCOME", "")
          result = semantic = failure_stage = None
          ok = False
          if prep != "success":
              failure_stage = "PREPARE"
          elif deps != "success":
              failure_stage = "DEPENDENCIES"
          elif execute != "success":
              failure_stage = "EXECUTOR_STEP"
          else:
              try:
                  exit_code = int((root / "exit-code.txt").read_text().strip())
              except Exception:
                  exit_code = 999
              try:
                  payload = json.load(open(root / "result.json", encoding="utf-8"))
                  valid = isinstance(payload, dict) and bool(payload.get("verdict"))
              except Exception:
                  payload, valid = None, False
              ok = exit_code == 0 and valid
              if valid:
                  result = payload.get("result", payload)
                  semantic = payload.get("semantic")
              if not ok:
                  failure_stage = "SCIENTIFIC_SCRIPT"
          logs = []
          for name in ("deps.log", "run.log"):
              path = root / name
              if path.is_file():
                  logs.append(path.read_text(encoding="utf-8", errors="replace"))
          receipt = {"test_id": meta["test_id"], "ok": ok, "result": result if ok else None,
                     "semantic": semantic if ok else None, "failure_stage": failure_stage,
                     "log_tail": "\n".join(logs)[-4000:]}
          json.dump(receipt, open(root / "out.json", "w", encoding="utf-8"), ensure_ascii=False)
          print("test", meta["test_id"], "ok" if ok else f"FAILED:{failure_stage}")
          PY
      - name: Upload shard receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.index }}
          path: /tmp/job/out.json
          retention-days: 3
      - name: Fail closed on runtime failure
        if: always()
        run: |
          python3 - <<'PY'
          import json
          value = json.load(open("/tmp/job/out.json", encoding="utf-8"))
          if not value.get("ok"):
              raise SystemExit(f"runtime shard failed closed: {value.get('failure_stage')}")
          PY

  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
      - name: Aggregate receipts
        run: |
          python3 - <<'PY'
          import glob, json
          paths = sorted(glob.glob("parts/*/out.json"))
          if not paths:
              raise SystemExit("no shard receipts")
          results = [json.load(open(path, encoding="utf-8")) for path in paths]
          json.dump({"results": results}, open("battery-results.json", "w", encoding="utf-8"), ensure_ascii=False)
          print("collected", len(results), "ok", sum(1 for item in results if item.get("ok")), "failed", sum(1 for item in results if not item.get("ok")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: battery-results
          path: battery-results.json
          retention-days: 7

      - name: Wake the Writer robot to record the results now
        # Otherwise results wait for GitHub's throttled */5 schedule (hours) before reaching the Tower.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nexo-writer-robot.yml --repo "$GITHUB_REPOSITORY" --ref main && echo "writer robot dispatched"
