name: NEXO test battery
run-name: battery ${{ inputs.battery_id }}

# Heavy/parallel NEXO tests dispatched by the Executor through the Writer robot.
# Isolation by design: NO secrets, read-only token, no access to the Tower or Drive.
# The spec (frozen scripts) lives in this public repo at branch nexo-batteries, batteries/<id>.json.
on:
  workflow_dispatch:
    inputs:
      battery_id:
        description: battery id (file batteries/<id>.json on branch nexo-batteries)
        required: true

permissions:
  contents: read

concurrency:
  group: nexo-battery-${{ inputs.battery_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexo-batteries
          sparse-checkout: batteries
      - id: m
        env:
          BID: ${{ inputs.battery_id }}
        run: |
          python3 - <<'PY'
          import json, os, re
          bid = os.environ["BID"]
          assert re.fullmatch(r"[a-z0-9-]{3,48}", bid), "bad battery id"
          spec = json.load(open(f"batteries/{bid}.json", encoding="utf-8"))
          tests = [{"test_id": t["test_id"], "index": i} for i, t in enumerate(spec["tests"][:20])]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"include": tests}) + "\n")
          PY

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexo-batteries
          sparse-checkout: batteries
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: batteries/${{ inputs.battery_id }}.json
      - name: Run frozen test script
        env:
          BID: ${{ inputs.battery_id }}
          IDX: ${{ matrix.index }}
        run: |
          python3 - <<'PY'
          import json, os
          spec = json.load(open(f"batteries/{os.environ['BID']}.json", encoding="utf-8"))
          test = spec["tests"][int(os.environ["IDX"])]
          os.makedirs("/tmp/job", exist_ok=True)
          open("/tmp/job/test.py", "w", encoding="utf-8").write(test["script"])
          open("/tmp/job/requirements.txt", "w").write("\n".join(["numpy", "scipy", "pandas", "requests"] + test.get("requirements", [])))
          open("/tmp/job/meta.json", "w").write(json.dumps({"test_id": test["test_id"], "timeout_min": test.get("timeout_min", 30)}))
          PY
          pip install -q -r /tmp/job/requirements.txt || true
          T=$(python3 -c "import json;print(json.load(open('/tmp/job/meta.json'))['timeout_min'])")
          cd /tmp/job
          set +e
          RESULT_PATH=/tmp/job/result.json timeout "${T}m" python3 test.py > log.txt 2>&1
          echo "exit=$?" >> log.txt
          set -e
          python3 - <<'PY'
          import json
          meta = json.load(open("/tmp/job/meta.json"))
          log = open("/tmp/job/log.txt", encoding="utf-8", errors="replace").read()
          try:
              result = json.load(open("/tmp/job/result.json", encoding="utf-8"))
              ok = isinstance(result, dict) and bool(result.get("verdict"))
          except Exception:
              result, ok = None, False
          out = {"test_id": meta["test_id"], "ok": ok, "result": (result or {}).get("result", result) if ok else None,
                 "semantic": (result or {}).get("semantic") if ok else None, "log_tail": log[-4000:]}
          json.dump(out, open("/tmp/job/out.json", "w", encoding="utf-8"), ensure_ascii=False)
          print("test", meta["test_id"], "ok" if ok else "FAILED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.index }}
          path: /tmp/job/out.json
          retention-days: 3

  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
      - run: |
          python3 - <<'PY'
          import json, glob
          results = [json.load(open(p, encoding="utf-8")) for p in sorted(glob.glob("parts/*/out.json"))]
          json.dump({"results": results}, open("battery-results.json", "w", encoding="utf-8"), ensure_ascii=False)
          print("collected", len(results), "ok", sum(1 for r in results if r["ok"]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: battery-results
          path: battery-results.json
          retention-days: 7
