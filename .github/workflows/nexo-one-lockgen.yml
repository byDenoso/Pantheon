name: NEXO ONE lockfile generator
on:
  push:
    branches: ['feat/nexo-atlas-3d-v1']
    paths: ['nexo-one/package.json', '.github/workflows/nexo-one-lockgen.yml']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nexo-atlas-3d-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate package lock
        working-directory: nexo-one
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package lock
        run: |
          if git diff --quiet -- nexo-one/package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexo-one/package-lock.json
          git commit -m 'build: sync Babylon.js package lock'
          git push origin HEAD:feat/nexo-atlas-3d-v1
