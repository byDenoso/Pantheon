name: Atlas verified deploy via existing Vercel credential

on:
  push:
    branches:
      - ops/atlas-via-nexo-token-20260910

permissions:
  contents: read

concurrency:
  group: atlas-via-nexo-token-temp
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: nexo-one-preview
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      ATLAS_ORG_ID: team_TLkDXqQIHke6IumXh3qzMDcs
      ATLAS_PROJECT_ID: prj_DLQSz5OiIT1HxWMn2i4AgoIv5x8r
      SOURCE_SHA: 17d07fe0e3ac13bc879dc3b7a6adbedbde562034
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prove Atlas source is exactly main
        run: |
          test -n "$VERCEL_TOKEN"
          git diff --quiet "$SOURCE_SHA" -- atlas-control-tower
          test -f atlas-control-tower/api/universal-projection.js
          test -f atlas-control-tower/ui/universal-projection.mjs
          grep -q '/api/universal-projection' atlas-control-tower/vercel.json

      - name: Install, test, typecheck and build Atlas
        working-directory: atlas-control-tower
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.11.7

      - name: Link canonical Atlas project explicitly
        working-directory: atlas-control-tower
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ATLAS_ORG_ID" "$ATLAS_PROJECT_ID" > .vercel/project.json

      - name: Deploy complete Atlas preview
        id: deploy
        working-directory: atlas-control-tower
        run: |
          URL=$(vercel deploy . --yes --token "$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "$URL"

      - name: Read back shell, health, UI and Projection Bus
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.DEPLOYMENT_URL;
          const headers=process.env.VERCEL_AUTOMATION_BYPASS_SECRET?{'x-vercel-protection-bypass':process.env.VERCEL_AUTOMATION_BYPASS_SECRET}:{};
          async function get(path){
            const r=await fetch(new URL(path,base),{headers,redirect:'error',signal:AbortSignal.timeout(20000)});
            const text=await r.text();
            if(!r.ok)throw new Error(`${path}: HTTP ${r.status} ${text.slice(0,200)}`);
            return {r,text};
          }
          const root=await get('/');
          if(!root.text.includes('NEXO Atlas')||!root.text.includes('/ui/universal-projection.mjs'))throw new Error('Atlas shell is incomplete.');
          const ui=await get('/ui/universal-projection.mjs');
          if(!ui.text.includes('ProjectionEnvelope/v1')||!ui.text.includes('/api/universal-projection'))throw new Error('Projection UI module missing or stale.');
          const health=await get('/api/health');
          const h=JSON.parse(health.text);if(h.ok!==true)throw new Error('Atlas health failed.');
          const projection=await get('/api/universal-projection');
          const p=JSON.parse(projection.text);
          if(p.contract!=='ProjectionEnvelope/v1'||p.bus!=='Pantheon/UniversalProjectionBus'||p.consumer!=='ATLAS'||p.projection_role!=='NON_AUTHORITATIVE')throw new Error('Universal Projection contract failed.');
          console.log(JSON.stringify({url:base,shell:'pass',health:'pass',projectionUI:'pass',projection:'pass',projectionState:p.state,upstream:p.upstream?.state,fingerprint:p.fingerprint},null,2));
          NODE
