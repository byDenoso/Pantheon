name: Atlas OIDC bridge probe

on:
  push:
    branches:
      - ops/atlas-via-nexo-token-20260910

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Reach protected Atlas preview and execute proxy probe
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          PROBE_URL: https://nexo-atlas-control-tower-fdtmelhj3-denosooo2-1701s-projects.vercel.app/api/proxy-probe
        run: |
          status=$(curl -sS -o /tmp/probe.json -w '%{http_code}' --max-time 30 "$PROBE_URL" \
            -H "x-vercel-trusted-oidc-idp-token: $GITHUB_OIDC_TOKEN")
          echo "probe HTTP $status"
          cat /tmp/probe.json
          echo
          test "$status" = "200"
          node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/probe.json","utf8"));if(j.ok!==true||j.upstreamStatus!==200)process.exit(1);console.log("OIDC proxy bridge PASS")'
