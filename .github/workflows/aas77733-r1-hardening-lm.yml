name: AAS77733-R1 Hardening LM

on:
  push:
    branches: [agent/aas77733-r1-hardening-lm]
    paths:
      - 'science/aas77733r1_hardening/**'
      - '.github/workflows/aas77733-r1-hardening-lm.yml'
  workflow_dispatch:
    inputs:
      mocks:
        description: 'Score-space mocks per variant'
        required: false
        default: '5000'

permissions:
  contents: read

concurrency:
  group: aas77733-r1-hardening-lm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned numerical dependencies
        run: python -m pip install 'numpy==2.2.6' 'scipy==1.15.3'
      - name: Restore immutable public-data cache
        uses: actions/cache@v4
        with:
          path: .cache/aas77733
          key: aas77733-r1-hardening-c447f0f-c9a4fca-v1
      - name: Run hardening contract tests
        run: python -m unittest discover -s science/aas77733r1_hardening -p 'test*.py' -v
      - name: Execute H0-H6 hardening battery
        run: |
          mkdir -p artifacts
          MOCKS='${{ inputs.mocks }}'
          if [ -z "$MOCKS" ]; then MOCKS=5000; fi
          python -m science.aas77733r1_hardening.run --mocks "$MOCKS" --seed 77733 --cache-dir .cache/aas77733 --output artifacts/aas77733-r1-hardening-lm.json
      - name: Validate artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/aas77733-r1-hardening-lm.json').read_text())
          assert p['validation_status']=='PASS', p
          assert p['battery_id']=='AAS77733_R1_HARDENING_LM_V1'
          assert set(p['tests'])=={f'H{i}' for i in range(7)}
          assert len(p['result_hash'])==64
          print(json.dumps({'synthesis':p['synthesis'],'result_hash':p['result_hash']},sort_keys=True))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aas77733-r1-hardening-lm-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
