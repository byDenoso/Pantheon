name: NEXO MCP Client Test Lock

on:
  push:
    branches:
      - feat/science-read-model-v2-mcp
    paths:
      - .github/workflows/nexo-mcp-client-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/science-read-model-v2-mcp
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nexo-one/package-lock.json
      - name: Install pinned official MCP client for integration tests
        working-directory: nexo-one
        run: npm install --save-dev --save-exact @modelcontextprotocol/client@2.0.0
      - name: Commit deterministic package lock
        run: |
          if git diff --quiet -- nexo-one/package.json nexo-one/package-lock.json; then
            echo "Lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexo-one/package.json nexo-one/package-lock.json
          git commit -m "chore(mcp): lock official MCP client v2 for tests"
          git push origin HEAD:feat/science-read-model-v2-mcp
