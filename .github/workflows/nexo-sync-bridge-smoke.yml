name: NEXO Public Projection Fallback Smoke

on:
  push:
    branches: [fix/atlas-g6-render-timeout]
    paths:
      - '.github/workflows/nexo-sync-bridge-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify browser-safe sanctioned projection origin
        shell: bash
        env:
          PAGE_BASE: https://bydenoso.github.io/Pantheon
          RAW_PROJECTION: https://raw.githubusercontent.com/byDenoso/NEXO-Obsidian-Vault/main/TOWER_V06/projections/public/projection.json
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          curl -fsSL --retry 3 --connect-timeout 5             -H 'Origin: https://bydenoso.github.io'             -D "$headers" -o "$body"             "$RAW_PROJECTION?sync_readback=$(date +%s)"

          grep -Eiq '^access-control-allow-origin: (\*|https://bydenoso\.github\.io)' "$headers"
          jq -e '
            .contract == "NEXO_PUBLIC_PROJECTION_V1" and
            .manifest.authority == "TOWER_V06" and
            .manifest.projection_only == true and
            .manifest.writeback == "FORBIDDEN" and
            .manifest.source_storage == "GOOGLE_DRIVE_PRIVATE" and
            .manifest.truth_owner == "TOWER_V06@GOOGLE_DRIVE_PRIVATE" and
            (.manifest.source_snapshot_id | length > 0) and
            (.manifest.projection_fingerprint | test("^sha256:[0-9a-f]{64}$")) and
            (.manifest.source_state_fingerprint | test("^sha256:[0-9a-f]{64}$"))
          ' "$body" >/dev/null

          origin_fp="$(jq -er '.manifest.projection_fingerprint' "$body")"
          pages_fp="$(curl -fsSL --retry 3 "$PAGE_BASE/tower-projection/manifest.json?t=$(date +%s)" | jq -er '.projection_fingerprint')"
          work="$(jq -r '.counts.active_work' "$body")"
          human="$(jq -r '.counts.needs_dener' "$body")"

          echo "PUBLIC_PROJECTION_FALLBACK_OK origin_fp=$origin_fp pages_fp=$pages_fp work=$work human=$human"
