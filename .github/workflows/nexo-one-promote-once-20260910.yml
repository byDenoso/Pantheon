name: NEXO ONE one-shot verified production promotion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexo-one-promote-once-20260910.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: nexo-one-deployment
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    environment: nexo-one-production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXO_QA_COOKIE: ${{ secrets.NEXO_QA_COOKIE }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERIFIED_SOURCE_SHA: eb767557354b203cebe3e0e6e0d2a30a8220aca2
      VERIFIED_CI_RUN_ID: '34468657470'
      PREVIOUS_DEPLOYMENT: dpl_23eBDJSb6vsRdRqpgte7F4rmw74D
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: nexo-one-release-${{ env.VERIFIED_SOURCE_SHA }}
          run-id: ${{ env.VERIFIED_CI_RUN_ID }}
          github-token: ${{ github.token }}
          path: release
      - name: Verify immutable artifact and project identity
        env:
          CLI_VERSION: ${{ vars.NEXO_VERCEL_CLI_VERSION }}
        run: |
          test "$VERCEL_PROJECT_ID" = prj_rFoAEgGt4gFNr8DHEOzxY7keS16W
          test -n "$VERCEL_TOKEN"
          test -n "$CLI_VERSION"
          node -e 'const m=require("./release/release-manifest.json");if(m.gitCommit!==process.env.VERIFIED_SOURCE_SHA)process.exit(1)'
          npm install --global "vercel@$CLI_VERSION"
      - name: Stage exact verified artifact as production without domain switch
        id: stage
        run: |
          STAGED_URL=$(vercel deploy ./release --prod --skip-domain --yes --token "$VERCEL_TOKEN")
          echo "url=$STAGED_URL" >> "$GITHUB_OUTPUT"
      - name: Verify staged operational readback
        env:
          NEXO_VERIFY_URL: ${{ steps.stage.outputs.url }}
        run: node nexo-one/scripts/verify-release.mjs --operational
      - name: Promote same deployment with rollback on failed readback
        env:
          STAGED_URL: ${{ steps.stage.outputs.url }}
        run: |
          vercel promote "$STAGED_URL" --yes --token "$VERCEL_TOKEN"
          if ! NEXO_VERIFY_URL=https://nexo-one-two.vercel.app node nexo-one/scripts/verify-release.mjs --operational; then
            vercel rollback "$PREVIOUS_DEPLOYMENT" --yes --token "$VERCEL_TOKEN"
            NEXO_VERIFY_URL=https://nexo-one-two.vercel.app node nexo-one/scripts/verify-release.mjs --operational
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexo-one-one-shot-production-receipt
          path: |
            verification.json
