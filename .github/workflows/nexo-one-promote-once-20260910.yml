name: NEXO ONE one-shot verified production promotion
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nexo-one-promote-once-20260910.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: nexo-one-deployment
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    environment: nexo-one-production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXO_QA_COOKIE: ${{ secrets.NEXO_QA_COOKIE }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      SOURCE_SHA: 49f5863472ae5e2eb0d44c53055fa015f0d3fa5b
      CI_RUN_ID: '34478774743'
      PREVIOUS_DEPLOYMENT: dpl_9CigzsFXowkPR2b1g9uwpJ9FatND
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 49f5863472ae5e2eb0d44c53055fa015f0d3fa5b
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: nexo-one-release-49f5863472ae5e2eb0d44c53055fa015f0d3fa5b
          run-id: 34478774743
          github-token: ${{ github.token }}
          path: release
      - name: Verify immutable artifact and tooling
        env:
          CLI_VERSION: ${{ vars.NEXO_VERCEL_CLI_VERSION }}
        run: |
          test "$VERCEL_PROJECT_ID" = prj_rFoAEgGt4gFNr8DHEOzxY7keS16W
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$CLI_VERSION"
          node -e 'const m=require("./release/release-manifest.json");if(m.gitCommit!==process.env.SOURCE_SHA)process.exit(1)'
          npm install --global "vercel@$CLI_VERSION"
      - name: Stage exact production artifact without domain
        id: stage
        run: |
          DEPLOYMENT_URL=$(vercel deploy ./release --prod --skip-domain --yes --token "$VERCEL_TOKEN")
          STAGED_HOST=${DEPLOYMENT_URL#https://}
          curl --fail --silent --show-error -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$STAGED_HOST?teamId=$VERCEL_ORG_ID" > staged-deployment.json
          TARGET_DEPLOYMENT=$(node -p 'require("./staged-deployment.json").id')
          test -n "$TARGET_DEPLOYMENT"
          echo "target=$TARGET_DEPLOYMENT" >> "$GITHUB_OUTPUT"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
      - name: Verify staged identity and operational readback
        env:
          TARGET_DEPLOYMENT: ${{ steps.stage.outputs.target }}
          NEXO_VERIFY_URL: ${{ steps.stage.outputs.url }}
        run: |
          node nexo-one/scripts/release-identity.mjs
          node nexo-one/scripts/verify-release.mjs --operational
      - name: Promote same deployment with rollback on failed production readback
        env:
          TARGET_DEPLOYMENT: ${{ steps.stage.outputs.target }}
        run: |
          vercel promote "$TARGET_DEPLOYMENT" --yes --token "$VERCEL_TOKEN"
          if ! node nexo-one/scripts/release-identity.mjs --current || ! NEXO_VERIFY_URL=https://nexo-one-two.vercel.app node nexo-one/scripts/verify-release.mjs --operational; then
            vercel rollback "$PREVIOUS_DEPLOYMENT" --yes --token "$VERCEL_TOKEN"
            NEXO_VERIFY_URL=https://nexo-one-two.vercel.app node nexo-one/scripts/verify-release.mjs --operational
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexo-one-production-receipt-49f5863472ae5e2eb0d44c53055fa015f0d3fa5b
          path: |
            verification.json
            deployment-identity.json
            staged-deployment.json
