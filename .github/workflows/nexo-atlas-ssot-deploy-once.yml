name: NEXO Atlas SSOT deploy once

on:
  push:
    branches: [feat/atlas-graph-engine-v2]
    paths:
      - '.github/workflows/nexo-atlas-ssot-deploy-once.yml'

permissions:
  contents: read

concurrency:
  group: nexo-one-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: nexo-one-production
    defaults:
      run:
        working-directory: nexo-one
    env:
      VERCEL_ORG_ID: team_TLkDXqQIHke6IumXh3qzMDcs
      VERCEL_PROJECT_ID: prj_rFoAEgGt4gFNr8DHEOzxY7keS16W
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nexo-one/package-lock.json
      - name: Verify source
        run: |
          npm ci --no-audit --no-fund
          npm run check
      - name: Verify release credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CLI_VERSION: ${{ vars.NEXO_VERCEL_CLI_VERSION }}
        run: |
          test "$VERCEL_PROJECT_ID" = prj_rFoAEgGt4gFNr8DHEOzxY7keS16W
          test -n "$VERCEL_TOKEN"
          test -n "$CLI_VERSION"
          npm install --global "vercel@$CLI_VERSION"
      - name: Pull production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
      - name: Build production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token "$VERCEL_TOKEN"
      - name: Deploy production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"
      - name: Readback public boundary
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs --operational
          canonical="https://nexo-one-two.vercel.app"
          for attempt in $(seq 1 12); do
            health=$(curl -L -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 "$canonical/api/health") || health=000
            ssot=$(curl -L -sS -o /tmp/ssot.json -w '%{http_code}' --max-time 30 "$canonical/api/atlas-ssot") || ssot=000
            echo "attempt=$attempt health=$health atlas-ssot=$ssot"
            if [ "$health" = "200" ] && [ "$ssot" = "403" ]; then
              node -e 'const x=require("/tmp/ssot.json"); if(x.error!=="ATLAS_SERVICE_REQUIRED") process.exit(1)'
              exit 0
            fi
            sleep 5
          done
          echo "::error::NEXO production alias did not converge to the service-only Atlas SSOT reader"
          exit 1
