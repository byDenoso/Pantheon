name: NEXO Writer selection CI
on:
  pull_request:
    paths:
      - '.github/workflows/nexo-writer-robot.yml'
      - '.github/workflows/nexo-writer-selection-ci.yml'
      - 'scripts/select_tested_tcc_main.py'
      - 'scripts/tests/test_select_tested_tcc_main.py'
      - 'scripts/collect_execution_assessments.py'
      - 'scripts/tests/test_collect_execution_assessments.py'
      - 'nexo-control/execution-assessment-approvals.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexo-writer-robot.yml'
      - '.github/workflows/nexo-writer-selection-ci.yml'
      - 'scripts/select_tested_tcc_main.py'
      - 'scripts/tests/test_select_tested_tcc_main.py'
      - 'scripts/collect_execution_assessments.py'
      - 'scripts/tests/test_collect_execution_assessments.py'
      - 'nexo-control/execution-assessment-approvals.json'
permissions:
  contents: read
jobs:
  verify-main-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -p test_select_tested_tcc_main.py -v
      - run: python -m unittest discover -s scripts/tests -p test_collect_execution_assessments.py -v
