name: Cleanup old Atlas branches
# cleanup-policy-v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-atlas-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete merged stale Atlas/NEXO branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --all --prune
          cutoff_epoch="$(date -u -d '72 hours ago' +%s)"

          deleted=0
          kept=0

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin               | grep -Ev '^(HEAD|main)$'               | grep -E '^(atlas-|feat/atlas-|chatgpt/nexo-|claude/nexo-|backup/nexo-one-|feat/nexo-atlas-)'
          )

          for branch in "${branches[@]}"; do
            if ! git merge-base --is-ancestor "origin/$branch" origin/main; then
              echo "KEEP unmerged: $branch"
              kept=$((kept+1))
              continue
            fi

            commit_epoch="$(git show -s --format=%ct "origin/$branch")"
            if [ "$commit_epoch" -gt "$cutoff_epoch" ]; then
              echo "KEEP recent merged: $branch"
              kept=$((kept+1))
              continue
            fi

            encoded="$(python - <<'PY' "$branch"
import sys, urllib.parse
print(urllib.parse.quote(sys.argv[1], safe=''))
PY
)"
            echo "DELETE merged stale: $branch"
            gh api --method DELETE "repos/$REPO/git/refs/heads/$encoded"
            deleted=$((deleted+1))
          done

          echo "deleted=$deleted" >> "$GITHUB_STEP_SUMMARY"
          echo "kept=$kept" >> "$GITHUB_STEP_SUMMARY"
          echo "Policy: never create a branch only to deploy; production deploys from main." >> "$GITHUB_STEP_SUMMARY"
