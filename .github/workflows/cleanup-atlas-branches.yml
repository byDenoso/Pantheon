name: Cleanup old Atlas branches

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-atlas-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete merged stale Atlas/NEXO branches
        shell: bash
        run: |
          set -euo pipefail

          git fetch --all --prune
          cutoff_epoch="$(date -u -d '72 hours ago' +%s)"

          deleted=0
          kept=0

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -Ev '^(HEAD|main)$' \
              | grep -E '^(atlas-|feat/atlas-|chatgpt/nexo-|claude/nexo-|backup/nexo-one-|feat/nexo-atlas-)'
          )

          for branch in "${branches[@]}"; do
            if ! git merge-base --is-ancestor "origin/$branch" origin/main; then
              echo "KEEP unmerged: $branch"
              kept=$((kept+1))
              continue
            fi

            commit_epoch="$(git show -s --format=%ct "origin/$branch")"
            if [ "$commit_epoch" -gt "$cutoff_epoch" ]; then
              echo "KEEP recent merged: $branch"
              kept=$((kept+1))
              continue
            fi

            echo "DELETE merged stale: $branch"
            git push origin --delete "$branch"
            deleted=$((deleted+1))
          done

          {
            echo "### Atlas/NEXO branch cleanup"
            echo "- deleted: $deleted"
            echo "- kept: $kept"
            echo "- policy: deploys use main; merged stale experiment branches are pruned"
          } >> "$GITHUB_STEP_SUMMARY"
