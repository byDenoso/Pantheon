name: Cleanup old Atlas branches

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-atlas-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archive unique work and remove stale Atlas/NEXO branches
        shell: bash
        run: |
          set -euo pipefail

          git fetch --all --tags --prune
          cutoff_epoch="$(date -u -d '72 hours ago' +%s)"

          merged_deleted=0
          archived_deleted=0
          recent_kept=0

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -Ev '^(HEAD|main)$' \
              | grep -E '^(atlas-|feat/atlas-|chatgpt/nexo-|claude/nexo-|backup/nexo-one-|feat/nexo-atlas-)'
          )

          for branch in "${branches[@]}"; do
            commit_epoch="$(git show -s --format=%ct "origin/$branch")"
            if [ "$commit_epoch" -gt "$cutoff_epoch" ]; then
              echo "KEEP recent: $branch"
              recent_kept=$((recent_kept+1))
              continue
            fi

            if git merge-base --is-ancestor "origin/$branch" origin/main; then
              echo "DELETE merged stale: $branch"
              git push origin --delete "$branch"
              merged_deleted=$((merged_deleted+1))
              continue
            fi

            safe="${branch//\//--}"
            tag="archive/branch/$safe"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "ARCHIVE exists: $tag"
            else
              echo "ARCHIVE unique branch: $branch -> $tag"
              git tag "$tag" "origin/$branch"
              git push origin "refs/tags/$tag"
            fi
            git push origin --delete "$branch"
            archived_deleted=$((archived_deleted+1))
          done

          {
            echo "### Atlas/NEXO branch cleanup"
            echo "- merged stale deleted: $merged_deleted"
            echo "- unique stale archived as tags then deleted: $archived_deleted"
            echo "- recent branches kept: $recent_kept"
            echo "- deploy policy: production deploys from main; deployment-only branches are forbidden"
          } >> "$GITHUB_STEP_SUMMARY"
