name: NEXO ONE PR CI

on:
  pull_request:
    paths:
      - 'nexo-one/**'
      - 'atlas-control-tower/**'
      - '.github/workflows/nexo-one-pages.yml'
      - '.github/workflows/nexo-one-pr-ci.yml'

permissions:
  contents: read

concurrency:
  group: nexo-one-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pantheon
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nexo-one/package-lock.json

      - name: Install dependencies
        working-directory: nexo-one
        run: npm ci --no-audit --no-fund

      - name: Typecheck, Atlas production tests and build
        working-directory: nexo-one
        run: |
          set -euo pipefail
          npm run typecheck
          node --test test/atlas3d-metro-production.test.mjs test/pages.test.mjs test/science-projection-v1.test.mjs test/projection-sync-resilience.test.mjs test/github-origin-resilience.test.mjs
          npm run build

      - name: Install Tower dependencies
        working-directory: atlas-control-tower
        run: npm ci --no-audit --no-fund

      - name: Verify Drive bundle semantics and Tower build
        working-directory: atlas-control-tower
        run: |
          set -euo pipefail
          node --test test/tower-drive-writer.test.mjs test/drive-storage-authority.test.mjs
          npm run typecheck
          npm run build
