name: NEXO ONE PR CI

on:
  pull_request:
    paths:
      - 'nexo-one/**'
      - 'atlas-control-tower/**'
      - '.github/workflows/nexo-one-pages.yml'
      - '.github/workflows/nexo-one-pr-ci.yml'
      - '.github/workflows/nexo-test-battery.yml'
      - '.github/workflows/nexo-writer-robot.yml'
      - 'scripts/nexo_autonomy_runtime.py'
      - 'scripts/tests/**'

permissions:
  contents: read

concurrency:
  group: nexo-one-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pantheon
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nexo-one/package-lock.json

      - name: Install dependencies
        working-directory: nexo-one
        run: npm ci --no-audit --no-fund

      - name: Typecheck, Atlas production tests and build
        working-directory: nexo-one
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run style:lint
          npm run build
          npx playwright install --with-deps chromium
          node test/atlas-performance.browser.mjs
          npm run test:mcp-browser
          node test/google-drive-consent.browser.mjs

      - name: Verify Atlas visual regression matrix
        working-directory: nexo-one
        run: |
          set -euo pipefail
          mkdir -p test-output/cinematic
          PORT=4178 VITE_SYSTEM_SOURCE=remote npm run dev > test-output/cinematic/dev-server.log 2>&1 &
          server_pid=$!
          baseline_pid=""
          trap 'kill "$server_pid" ${baseline_pid:+"$baseline_pid"} 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4178/ > /dev/null; then break; fi
            sleep 1
          done
          NEXO_BASE_URL=http://127.0.0.1:4178 node test/incident-operations.browser.mjs
          NEXO_BASE_URL=http://127.0.0.1:4178 node test/lab-cinematic-integrity.browser.mjs
          NEXO_BASE_URL=http://127.0.0.1:4178 node test/board-message.browser.mjs
          baseline_dir="$RUNNER_TEMP/atlas-crew-baseline"
          git fetch --no-tags --depth=1 origin 052fd7e3c1051b3542fd0dcf1be6fc54619e6f67
          git worktree add --detach "$baseline_dir" FETCH_HEAD
          ln -s "$PWD/node_modules" "$baseline_dir/nexo-one/node_modules"
          baseline_log="$PWD/test-output/crew-layout-baseline/dev-server.log"
          mkdir -p test-output/crew-layout-baseline
          (cd "$baseline_dir/nexo-one"; PORT=4179 VITE_SYSTEM_SOURCE=remote npm run dev > "$baseline_log" 2>&1) &
          baseline_pid=$!
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4179/ > /dev/null; then break; fi
            sleep 1
          done
          NEXO_BASE_URL=http://127.0.0.1:4179 NEXO_CREW_EXPECT_BASELINE_BUG=1 node test/crew-layout.browser.mjs
          NEXO_BASE_URL=http://127.0.0.1:4178 node test/crew-layout.browser.mjs

      - name: Upload Atlas visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-cinematic-visual-${{ github.event.pull_request.head.sha }}
          path: |
            nexo-one/test-output/google-drive-consent/
            nexo-one/test-output/cinematic/
            nexo-one/test-output/board-message/
            nexo-one/test-output/crew-layout/
            nexo-one/test-output/crew-layout-baseline/
            nexo-one/test-output/incident-operations/
            nexo-one/test-output/atlas-performance/
          if-no-files-found: warn
          retention-days: 7

      - name: Install Tower dependencies
        working-directory: atlas-control-tower
        run: npm ci --no-audit --no-fund

      - name: Verify Drive bundle semantics and Tower build
        working-directory: atlas-control-tower
        run: |
          set -euo pipefail
          node --test test/tower-drive-writer.test.mjs test/drive-storage-authority.test.mjs
          node --test test/legacy-static-bridge.test.mjs test/private-publication-boundary.test.mjs
          npm run typecheck
          npm run build

  executor-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Pantheon
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: nexo-one/executor-runtime/requirements.txt

      - name: Install Executor runtime dependencies
        run: python -m pip install --disable-pip-version-check -r nexo-one/executor-runtime/requirements.txt

      - name: Verify frozen-input and prospective-selection regression tests
        run: python -m unittest discover -s nexo-one/executor-runtime/tests -p test_tower_native_frozen_inputs.py -v

      - name: Verify Writer transport, authority and recovery collectors
        run: python -m unittest discover -s scripts/tests -v

      - name: Verify BAO release and frozen decision regression tests
        working-directory: nexo-one/executor-runtime/recipes
        run: OPENBLAS_NUM_THREADS=1 python -m unittest test_w0wa_bao_sn_multi -v

      - name: Verify frozen rank-score leave-one-out regression tests
        working-directory: nexo-one/executor-runtime/recipes
        run: python -m unittest test_rank_score_leave_one_out -v

      - name: Verify parameter preflight and operational failure receipts
        run: python -m unittest discover -s nexo-one/executor-runtime/tests -p test_recipe_param_preflight.py -v

      - name: Verify runner, scientific stack and network
        env:
          GH_TOKEN: ${{ github.token }}
        run: python nexo-one/executor-runtime/smoke.py

      - name: Verify current TCC execution contracts on the same runner
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/byDenoso/TCC.git /tmp/nexo-tcc
          cd /tmp/nexo-tcc
          PYTHONPATH=. python -m unittest             runtime.nexo_execution.test_execution             runtime.nexo_execution.test_peer_detection             runtime.portable_camb.test_runtime
