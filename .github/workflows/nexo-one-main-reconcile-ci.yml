name: NEXO ONE Main Reconcile CI

on:
  push:
    branches:
      - chatgpt/nexo-one-main-reconcile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nexo-one/package-lock.json
      - name: Install
        working-directory: nexo-one
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: nexo-one
        run: npm run typecheck
      - name: Full tests
        working-directory: nexo-one
        run: npm test
      - name: Style lint
        working-directory: nexo-one
        run: npm run style:lint
      - name: Build
        working-directory: nexo-one
        run: npm run build
