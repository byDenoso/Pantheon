name: NEXO heartbeat

# Manual-only legacy diagnostic: a deliberate dispatch temporarily monitors the Writer.
# The bounded run neither re-seeds itself nor schedules a successor.
# Recurrence remains with the Writer's own cron and event triggers.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: nexo-heartbeat
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CADENCE_S: 900
      CHECK_EVERY_S: 300
      LIFETIME_S: 19800   # 5h30 + one last sleep stays well under the 350-min job timeout
    steps:
      - name: Keep the robot on cadence
        run: |
          set -u
          start=$(date -u +%s)
          while [ $(( $(date -u +%s) - start )) -lt "$LIFETIME_S" ]; do
            busy=$(gh run list --workflow nexo-writer-robot.yml --limit 5 --json status --jq '[.[] | select(.status != "completed")] | length' || echo 1)
            last=$(gh run list --workflow nexo-writer-robot.yml --limit 1 --json createdAt --jq '.[0].createdAt // "1970-01-01T00:00:00Z"' || echo "")
            if [ -n "$last" ] && [ "$busy" = "0" ]; then
              age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
              if [ "$age" -ge "$CADENCE_S" ]; then
                gh workflow run nexo-writer-robot.yml --ref main && echo "$(date -u +%H:%M) robot dispatched (last start ${age}s ago)"
              else
                echo "$(date -u +%H:%M) robot started ${age}s ago"
              fi
            else
              echo "$(date -u +%H:%M) robot busy or status unavailable; skipping"
            fi
            sleep "$CHECK_EVERY_S"
          done

