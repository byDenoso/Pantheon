name: NEXO Sheet Spool Canary

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nexo-calendar-bridge-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export scheduled spool Sheet with writer service account
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.NEXO_DRIVE_WRITER_JSON }}
          SPOOL_ID: 1M2maKkuEjxumZRa145dzei7dEPFi2yKsKlUf7_scC-E
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "writer secret missing"; exit 2; }
          pip install --quiet google-auth requests
          python - <<'PY'
          import json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          info=json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])
          creds=service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/drive.readonly"])
          s=AuthorizedSession(creds)
          url=f"https://www.googleapis.com/drive/v3/files/{os.environ['SPOOL_ID']}/export"
          r=s.get(url,params={"mimeType":"text/csv"},timeout=30)
          print("sheet_export_probe",r.status_code)
          print(r.text[:1000] if r.ok else r.text[:500])
          r.raise_for_status()
          assert "sheet-canary-001" in r.text
          PY
