name: NEXO private campaign

# Generic segmented runner for a private campaign. Code, configuration, checkpoints and
# results live only in a private Drive folder and are fetched/updated at runtime; nothing
# private is stored in this repository, printed to the log or uploaded as an artifact.
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: choice
        options: [pilot, m1r1, m1r2, m2r1, m2r2, m3r1, m3r2, validation-a, inspect-src, contract-check, c0m1r1, c0m1r2, c0m2r1, c0m2r2, c0m3r1, c0m3r2]

permissions:
  contents: read
  actions: write

concurrency:
  group: nexo-private-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  inspect:
    if: inputs.run_id == 'inspect-src'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CODE_FILE_ID: 1zTmiuRaSPcNjDqZKVFPIcAD0E1cdJx-V
      CODE_SHA256: 96186d8a295c9ca865462b0097c1f50325e684dc43c5d8623b7d6ce930fd5288
      OUT_SLOT: 178NH09LChZ7d-2uh-vWD8V3Ye51LLKs-
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install client
        run: pip install -q google-auth requests >/dev/null
      - name: Copy runner source to the private Drive folder (nothing is logged)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.NEXO_DRIVE_WRITER_JSON }}
        run: |
          python - 2>/dev/null <<'PY' || exit 1
          import hashlib, io, json, os, tarfile
          stage = "start"
          try:
              from google.oauth2 import service_account
              from google.auth.transport.requests import AuthorizedSession
              stage = "auth"
              creds = service_account.Credentials.from_service_account_info(json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]), scopes=["https://www.googleapis.com/auth/drive"])
              s = AuthorizedSession(creds)
              stage = "download"
              r = s.get(f"https://www.googleapis.com/drive/v3/files/{os.environ['CODE_FILE_ID']}", params={"alt": "media"}, timeout=120)
              r.raise_for_status()
              stage = "hash"
              assert hashlib.sha256(r.content).hexdigest() == os.environ["CODE_SHA256"]
              stage = "untar"
              tf = tarfile.open(fileobj=io.BytesIO(r.content), mode="r:gz")
              files = [m for m in tf.getmembers() if m.isfile()]
              rc = [m for m in files if os.path.basename(m.name) == "run_campaign.py"]
              assert len(rc) == 1
              stage = "build"
              parts = ["# archive members (name, bytes)\n"]
              parts += [f"{m.name}\t{m.size}\n" for m in files]
              parts += ["\n=====FILE run_campaign.py=====\n", tf.extractfile(rc[0]).read().decode("utf-8"),
                        "\n=====PAD=====\n", "x" * (300 * 1024)]
              body = "".join(parts).encode("utf-8")
              stage = "upload"
              u = s.patch(f"https://www.googleapis.com/upload/drive/v3/files/{os.environ['OUT_SLOT']}", params={"uploadType": "media", "supportsAllDrives": "true", "fields": "id"}, data=body, headers={"Content-Type": "text/plain"}, timeout=120)
              u.raise_for_status()
              print("inspect ok")
          except BaseException as e:
              resp = getattr(e, "response", None)
              print("inspect failed stage=%s exc=%s http=%s" % (stage, type(e).__name__, getattr(resp, "status_code", None)))
              raise SystemExit(1)
          PY

  segment:
    if: inputs.run_id != 'validation-a' && inputs.run_id != 'inspect-src'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      CODE_FILE_ID: 1zTmiuRaSPcNjDqZKVFPIcAD0E1cdJx-V
      CODE_SHA256: 96186d8a295c9ca865462b0097c1f50325e684dc43c5d8623b7d6ce930fd5288
      COBAYA_PACKAGES_PATH: /home/runner/cobaya_packages
      PATCH_FILE_ID: 1rVG_mF5kf41ZQkqzI0AQGFwOtN4V0CJk
      PATCH_SHA256: 2783b3c7e5591e002a259034b5d5c0dc44db349a090b64d2aba8a43958f0ac60
    steps:
      - name: Deadline
        run: echo "DEADLINE=$(( $(date +%s) + 335*60 ))" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'

      - name: Install pinned stack
        run: pip install -q "cobaya==3.6.2" "camb==1.6.6" "dynesty==2.1.5" "numpy==2.5.3" "scipy==1.18.1" pyyaml google-auth requests >/dev/null

      - name: Restore public likelihood data cache
        uses: actions/cache@v4
        with:
          path: /home/runner/cobaya_packages
          key: cobaya-planck2018-desi2024-v1

      - name: Fetch private code
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.NEXO_DRIVE_WRITER_JSON }}
        run: |
          python - <<'PY'
          import hashlib, io, json, os, tarfile
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          creds = service_account.Credentials.from_service_account_info(json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]), scopes=["https://www.googleapis.com/auth/drive"])
          r = AuthorizedSession(creds).get(f"https://www.googleapis.com/drive/v3/files/{os.environ['CODE_FILE_ID']}", params={"alt": "media"}, timeout=120)
          r.raise_for_status()
          if hashlib.sha256(r.content).hexdigest() != os.environ["CODE_SHA256"]:
              raise SystemExit("code hash mismatch")
          tarfile.open(fileobj=io.BytesIO(r.content), mode="r:gz").extractall(os.environ["RUNNER_TEMP"] + "/c", filter="data")
          print("code ok")
          PY

      - name: Apply reviewed runner fixes
        working-directory: ${{ runner.temp }}/c
        run: |
          python - <<'PY'
          import pathlib
          p = pathlib.Path("run_campaign.py")
          s = p.read_text()
          subs = [
              ('chunk=600 if run_id == "pilot" else 1500,', 'chunk=600 if run_id == "pilot" else 300,'),
              ('    return {"RUNNING": EXIT_SEGMENT_DONE, "RETRY": EXIT_SEGMENT_DONE}.get(state["status"], 0)',
               '    if state["status"] in ("RUNNING", "RETRY"):\n'
               '        return EXIT_SEGMENT_DONE\n'
               '    return 0 if state["status"] in ("CONVERGED", "BUDGET_EXHAUSTED", "PILOT_DONE") else 1'),
          ]
          for old, new in subs:
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          p.write_text(s)
          print("runner patched")
          PY

      - name: Apply private patch
        working-directory: ${{ runner.temp }}/c
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.NEXO_DRIVE_WRITER_JSON }}
        run: |
          python - 2>/dev/null <<'PY' || { echo "patch failed"; exit 1; }
          import hashlib, json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          creds = service_account.Credentials.from_service_account_info(json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]), scopes=["https://www.googleapis.com/auth/drive"])
          r = AuthorizedSession(creds).get(f"https://www.googleapis.com/drive/v3/files/{os.environ['PATCH_FILE_ID']}", params={"alt": "media", "supportsAllDrives": "true"}, timeout=120)
          r.raise_for_status()
          got = hashlib.sha256(r.content).hexdigest()
          if got != os.environ["PATCH_SHA256"]:
              print("patch hash mismatch got=" + got); raise SystemExit(1)
          exec(compile(r.content.decode("utf-8"), "private_patch", "exec"), {"__name__": "__patch__"})
          PY

      - name: Install likelihood data (public, official sources)
        working-directory: ${{ runner.temp }}/c
        run: |
          python -c "import yaml,run_campaign as R; yaml.safe_dump(R.frozen_info('M3','$COBAYA_PACKAGES_PATH'),open('install.yaml','w'))"
          cobaya-install install.yaml -p "$COBAYA_PACKAGES_PATH" --skip-global >/dev/null 2>&1 || cobaya-install install.yaml -p "$COBAYA_PACKAGES_PATH" --skip-global 2>&1 | tail -3
          rm -f install.yaml

      - name: Segment
        id: seg
        working-directory: ${{ runner.temp }}/c
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.NEXO_DRIVE_WRITER_JSON }}
          OMP_NUM_THREADS: '1'
        run: |
          set +e
          python run_campaign.py "${{ inputs.run_id }}" "$DEADLINE" 2>/dev/null | grep '^STATUS' ; rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" = "0" ] || [ "$rc" = "75" ]

      - name: Continue in a new job
        if: steps.seg.outputs.rc == '75'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nexo-private-ns.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" -f run_id="${{ inputs.run_id }}"

  private-validation:
    if: inputs.run_id == 'validation-a'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      CODE_FILE_ID: 17WTz82won53xBEKGRrxhnZqznaYVOjcA
      CODE_SHA256: 3c85b7b909f3a5bd12b2244228495cf4f9c07727cb14f31ece30557f3d44df8a
      INPUT_FILE_ID: 1RUH9uzEwNkJwqcPYiKkaKtmUM1hf9jBe
      INPUT_SHA256: 68487970d1719490618688de8e147dcf919ef3c35eacb5c36c69280134f7d8e8
      OUTPUT_FILE_ID: 1iUk5SO1Ju0KGeWoBgxLVWvA3MtIkl6Ye
      STATE_FILE_ID: 1yulWKsC67kYrz-ydwBX44ti0Ebl1yoUs
    steps:
      - name: Set single-segment deadline
        run: echo "DEADLINE=$(( $(date +%s) + 300*60 ))" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install frozen validation stack
        run: python -m pip install --disable-pip-version-check "cobaya==3.6.2" "camb==1.6.6" "dynesty==2.1.5" "numpy==2.5.3" "scipy==1.18.1" "astropy==8.0.1" "clipy-like==0.15" "PyYAML==6.0.3" google-auth requests >/dev/null 2>&1
      - name: Fetch immutable private runner
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.NEXO_DRIVE_WRITER_JSON }}
        run: |
          python - <<'PYCODE' > "$RUNNER_TEMP/private-fetch.log" 2>&1
          import hashlib, io, json, os, tarfile
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          creds = service_account.Credentials.from_service_account_info(json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]), scopes=["https://www.googleapis.com/auth/drive"])
          r = AuthorizedSession(creds).get(f"https://www.googleapis.com/drive/v3/files/{os.environ['CODE_FILE_ID']}", params={"alt": "media"}, timeout=120)
          r.raise_for_status()
          assert hashlib.sha256(r.content).hexdigest() == os.environ["CODE_SHA256"]
          tarfile.open(fileobj=io.BytesIO(r.content), mode="r:gz").extractall(os.environ["RUNNER_TEMP"] + "/validation", filter="data")
          PYCODE
      - name: Run one bounded private validation segment
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.NEXO_DRIVE_WRITER_JSON }}
        run: |
          set +e
          python "$RUNNER_TEMP/validation/run_private_segment.py" > "$RUNNER_TEMP/private-segment.log" 2>&1
          rc=$?
          grep '^STATUS [A-Z_]*$' "$RUNNER_TEMP/private-segment.log" || true
          exit "$rc"
