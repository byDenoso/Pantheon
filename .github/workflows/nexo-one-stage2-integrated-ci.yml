name: NEXO ONE Stage 2 Integrated CI

on:
  push:
    branches:
      - chatgpt/nexo-one-stage2-integrated
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nexo-one/package-lock.json
      - name: Install
        working-directory: nexo-one
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: nexo-one
        run: npm run typecheck
      - name: Stage 1 and Stage 2 tests
        working-directory: nexo-one
        run: node --test test/galaxy-compiler.test.mjs test/galaxy-snapshot-pipeline.test.mjs test/graph3d.test.mjs test/galaxy-stage2.test.mjs test/canvas-25d.test.mjs
      - name: Full tests for baseline readback
        working-directory: nexo-one
        continue-on-error: true
        run: npm test
      - name: Style lint
        working-directory: nexo-one
        run: npm run style:lint
      - name: Build
        working-directory: nexo-one
        run: npm run build
