name: Atlas Export Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-export-source.yml'

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-control-tower-source
          path: atlas-control-tower
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
