<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>NEXO Mobile</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color-scheme:dark;--bg:#080d18;--panel:#10192b;--line:#26344e;--text:#f7f9fc;--muted:#9ba9bd;--blue:#6aa9ff;--green:#61d4a1;--amber:#f2bd66;--red:#ff7d84}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#14213d,var(--bg) 46%);color:var(--text);padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}main{max-width:720px;margin:auto;padding:18px 0 96px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.top h1{margin:0;font-size:23px}.top p{margin:4px 0 0;color:var(--muted);font-size:12px}.status,.panel{border:1px solid var(--line);background:linear-gradient(180deg,rgba(18,28,47,.98),rgba(12,19,33,.98));border-radius:18px}.status{display:flex;gap:9px;align-items:center;padding:11px 13px;color:var(--muted);font-size:12px;margin-bottom:12px}.dot{width:9px;height:9px;border-radius:50%;background:var(--amber)}.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}.grid{display:grid;gap:12px}.panel{padding:15px}.panel h2{margin:0 0 12px;color:#bdc9da;font-size:12px;letter-spacing:.14em;text-transform:uppercase}.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.hero strong{font-size:26px}.pill{border:1px solid #2b456d;background:#10203a;color:var(--blue);border-radius:999px;padding:7px 10px;font-size:10px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card,.item{padding:13px;border:1px solid var(--line);border-radius:15px;background:#0b1322}.card{min-height:104px;display:flex;flex-direction:column;justify-content:space-between}.card b,.item b{font-size:13px}.card strong{font-size:21px;color:var(--blue)}.card span,.item span,.empty{color:var(--muted);font-size:11px;line-height:1.4}.providers{display:flex;gap:7px;flex-wrap:wrap}.provider{padding:7px 9px;border-radius:999px;border:1px solid var(--line);font-size:10px;color:var(--muted)}.provider.available{color:var(--green);border-color:#285641}.provider.auth_required{color:var(--amber);border-color:#5b4727}.list{display:grid;gap:8px}.item{display:grid;gap:4px}.item .meta{display:flex;justify-content:space-between;gap:8px}.item a{color:inherit;text-decoration:none}.attention{font-size:10px;color:var(--amber)}.action{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(692px,calc(100vw - 28px));height:58px;border:0;border-radius:17px;background:linear-gradient(180deg,#79b5ff,#4d91f1);color:#07101f;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 18px 45px rgba(77,145,241,.25)}@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main>
<header class="top"><div><h1>NEXO</h1><p>Mobile · backend integrado</p></div><div class="pill">LIVE</div></header>
<div class="status"><span class="dot" id="dot"></span><span id="status">Conectando ao NEXO ONE…</span></div>
<section class="grid">
<article class="panel"><h2>Agora</h2><div class="hero"><div><strong id="clock">--:--</strong><div class="empty" id="date">—</div></div><div class="pill" id="revision">PUBLIC</div></div><div class="cards" style="margin-top:12px"><div class="card"><b>Itens ativos</b><strong id="activeCount">0</strong><span>Projeção pública atual.</span></div><div class="card"><b>Backend</b><strong id="backendState">…</strong><span>NEXO ONE / Vercel.</span></div></div></article>
<article class="panel"><h2>Fontes</h2><div class="providers" id="providers"></div></article>
<article class="panel"><h2>Alertas</h2><div class="list" id="alerts"><div class="empty">Carregando…</div></div></article>
<article class="panel"><h2>Próximos</h2><div class="list" id="upcoming"><div class="empty">Carregando…</div></div></article>
</section>
</main>
<a class="action" href="https://nexo-one-two.vercel.app/">Abrir NEXO ONE</a>
<script>
const API='https://nexo-one-two.vercel.app/api?route=world';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tick(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});$('date').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});}tick();setInterval(tick,30000);
function itemHtml(x){const when=x.dueAt?new Date(x.dueAt).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';const body=`<div class="meta"><b>${esc(x.title)}</b><span class="attention">${esc(x.attention||x.status||'')}</span></div><span>${esc(x.summary||x.source||'')}${when?' · '+esc(when):''}</span>`;return x.sourceRef?`<a class="item" href="${esc(x.sourceRef)}" target="_blank" rel="noopener">${body}</a>`:`<div class="item">${body}</div>`;}
function renderList(id,items,empty){$(id).innerHTML=items.length?items.map(itemHtml).join(''):`<div class="empty">${esc(empty)}</div>`;}
async function refresh(){try{const res=await fetch(API,{headers:{Accept:'application/json'},cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);const world=await res.json();const providers=Array.isArray(world.providers)?world.providers:[];const items=Array.isArray(world.items)?world.items:[];$('dot').className='dot ok';$('status').textContent=`NEXO ONE conectado · ${new Date(world.generatedAt||Date.now()).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;$('backendState').textContent='ON';$('activeCount').textContent=items.length;$('revision').textContent='PUBLIC';$('providers').innerHTML=providers.map(p=>`<span class="provider ${String(p.status||'').toLowerCase()}">${esc(p.label||p.id)} · ${esc(p.status)}</span>`).join('');const alerts=items.filter(x=>x.attention==='ESCALATE'||x.attention==='ACT'||x.status==='NEEDS_ME').slice(0,6);const upcoming=items.filter(x=>x.kind==='EVENT'&&x.dueAt).sort((a,b)=>Date.parse(a.dueAt)-Date.parse(b.dueAt)).slice(0,6);renderList('alerts',alerts,'Nenhum alerta público agora.');renderList('upcoming',upcoming,'Calendar privado ainda não autorizado no backend.');}catch(e){$('dot').className='dot bad';$('status').textContent='Backend indisponível';$('backendState').textContent='OFF';renderList('alerts',[],'Falha ao consultar NEXO ONE.');renderList('upcoming',[],'Sem readback do backend.');}}
refresh();setInterval(refresh,60000);
</script>
</body></html>
